<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07090f">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Planning · FOC 2026 Delta</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23FF5722'/><text y='.9em' font-size='66' x='50' text-anchor='middle' font-family='Arial Black' fill='white'>&#916;</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700;800;900&family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#07090f;--bg2:#0d1018;
  --card:#141925;--card2:#1a2030;--card3:#222a3d;
  --brd:rgba(255,255,255,.07);--brd2:rgba(255,255,255,.14);
  --ink:#F3F6FC;--ink2:#A8B3C7;--ink3:#6B7890;
  --fire:#FF5722;--ember:#FF8A00;--gold:#FFB020;
  --blue:#4DA6FF;--purple:#9B6BFF;--ok:#00E5A0;
  --ff:'Bebas Neue',sans-serif;--fb:'Inter',sans-serif;--fm:'JetBrains Mono',monospace;
}
html,body{background:var(--bg);color:var(--ink);font-family:var(--fb);-webkit-font-smoothing:antialiased}
body{min-height:100vh;overflow-x:hidden}
.bg-glow{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bg-glow::before,.bg-glow::after{content:'';position:absolute;border-radius:50%;filter:blur(120px);opacity:.18}
.bg-glow::before{width:600px;height:600px;background:var(--fire);top:-200px;right:-150px;animation:float1 18s ease-in-out infinite}
.bg-glow::after{width:500px;height:500px;background:var(--blue);bottom:-150px;left:-150px;animation:float2 22s ease-in-out infinite}
@keyframes float1{0%,100%{transform:translate(0,0)}50%{transform:translate(-60px,40px)}}
@keyframes float2{0%,100%{transform:translate(0,0)}50%{transform:translate(50px,-30px)}}
.wrap{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:18px 14px 60px}
.hero{text-align:center;padding:30px 0 22px;position:relative}
.hero-badge{display:inline-flex;align-items:center;gap:7px;background:rgba(255,87,34,.12);border:1px solid rgba(255,87,34,.3);color:var(--ember);font-size:11px;font-weight:800;letter-spacing:2px;padding:6px 14px;border-radius:20px;text-transform:uppercase;margin-bottom:14px}
.hero-badge .dot{width:7px;height:7px;border-radius:50%;background:var(--fire);box-shadow:0 0 10px var(--fire);animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.85)}}
.hero h1{font-family:var(--ff);font-size:clamp(44px,11vw,86px);line-height:.92;letter-spacing:2px;background:linear-gradient(135deg,#fff 0%,var(--gold) 45%,var(--fire) 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 4px 30px rgba(255,87,34,.3))}
.hero .sub{font-family:var(--ff);font-size:clamp(16px,4vw,24px);letter-spacing:6px;color:var(--ink2);margin-top:2px}
.hero .tagline{font-size:13px;color:var(--ink3);margin-top:12px;font-weight:600}
.controls{position:sticky;top:0;z-index:20;background:rgba(7,9,15,.82);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--brd);margin:0 -14px 20px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.search-box{position:relative}
.search-box input{width:100%;background:var(--card);border:1.5px solid var(--brd2);border-radius:13px;padding:13px 44px;font-size:15px;color:var(--ink);outline:none;font-family:inherit;font-weight:600;transition:.2s}
.search-box input::placeholder{color:var(--ink3)}
.search-box input:focus{border-color:var(--fire);background:var(--card2);box-shadow:0 0 0 4px rgba(255,87,34,.12)}
.search-box .ico{position:absolute;left:15px;top:50%;transform:translateY(-50%);font-size:17px;opacity:.6}
.search-box .clear{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:var(--card3);border:none;color:var(--ink2);width:26px;height:26px;border-radius:50%;cursor:pointer;font-size:14px;display:none;align-items:center;justify-content:center}
.search-box .clear.show{display:flex}
.team-select-wrap{position:relative;margin-top:9px}
.team-select-wrap select{width:100%;-webkit-appearance:none;appearance:none;background:var(--card);border:1.5px solid var(--brd2);border-radius:13px;padding:13px 42px 13px 44px;font-size:15px;color:var(--ink);outline:none;font-family:inherit;font-weight:700;transition:.2s}
.team-select-wrap select:focus{border-color:var(--fire);background:var(--card2);box-shadow:0 0 0 4px rgba(255,87,34,.12)}
.team-select-wrap .ico{position:absolute;left:15px;top:50%;transform:translateY(-50%);font-size:17px;opacity:.6;pointer-events:none}
.team-select-wrap .chev{position:absolute;right:15px;top:50%;transform:translateY(-50%);font-size:12px;opacity:.6;pointer-events:none}
.team-select-wrap select optgroup{font-weight:800;font-size:13px;color:var(--fire);background:var(--card3,#1b1d24);text-transform:uppercase;letter-spacing:.5px}
.team-select-wrap select option{font-weight:600;color:var(--ink);background:var(--card,#15161a);text-transform:none}
.ctrl-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.day-tabs{display:flex;gap:4px;background:var(--card);padding:4px;border-radius:11px;border:1px solid var(--brd)}
.day-tab{padding:9px 16px;background:transparent;border:none;border-radius:8px;font-family:var(--ff);font-size:17px;letter-spacing:1.5px;color:var(--ink3);cursor:pointer;transition:.18s;white-space:nowrap}
.day-tab:hover{color:var(--ink2)}
.day-tab.active{background:linear-gradient(135deg,var(--fire),var(--ember));color:#fff;box-shadow:0 4px 14px rgba(255,87,34,.35)}
.spacer{flex:1}
.btn{display:inline-flex;align-items:center;gap:7px;padding:10px 15px;border-radius:11px;font-size:13px;font-weight:800;cursor:pointer;border:1px solid var(--brd2);background:var(--card);color:var(--ink2);font-family:inherit;transition:.18s;white-space:nowrap}
.btn:hover{background:var(--card2);color:var(--ink);border-color:var(--ink3)}
.btn .ic{font-size:15px;transition:transform .4s}
.cat-filters{display:flex;gap:7px;overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.cat-filters::-webkit-scrollbar{display:none}
.cat-chip{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;background:var(--card);border:1.5px solid var(--brd);border-radius:18px;font-size:12px;font-weight:700;color:var(--ink2);cursor:pointer;white-space:nowrap;transition:.16s;flex-shrink:0}
.cat-chip:hover{border-color:var(--brd2)}
.cat-chip.active{color:#fff;border-color:transparent}
.cat-chip .cdot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.cat-chip .ccount{opacity:.65;font-size:10px}
.day-block{margin-bottom:30px}
.day-head{display:flex;align-items:center;gap:12px;margin:8px 0 14px;padding-bottom:10px;border-bottom:2px solid var(--brd)}
.day-head .num{font-family:var(--ff);font-size:40px;letter-spacing:1px;background:linear-gradient(135deg,var(--gold),var(--fire));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.day-head .lbl{font-family:var(--ff);font-size:26px;letter-spacing:3px;color:var(--ink)}
.day-head .meta{margin-left:auto;font-size:11px;color:var(--ink3);font-weight:700;text-transform:uppercase;letter-spacing:1px}
.heat-group{margin-bottom:16px;animation:slideUp .4s cubic-bezier(.22,1,.36,1) backwards}
@keyframes slideUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.heat-bar{display:flex;align-items:center;gap:10px;padding:9px 14px;background:linear-gradient(90deg,var(--card2),var(--card));border:1px solid var(--brd);border-radius:12px 12px 0 0;border-bottom:none}
.heat-bar .htime{font-family:var(--fm);font-size:18px;font-weight:800;color:var(--gold)}
.heat-bar .hzone{font-size:11px;font-weight:800;color:var(--ink2);background:var(--card3);padding:3px 9px;border-radius:7px;letter-spacing:.5px}
.heat-bar .hwod{font-family:var(--ff);font-size:19px;letter-spacing:1.5px;color:var(--ink);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.heat-bar .hnum{font-size:11px;font-weight:800;color:var(--ink3);font-family:var(--fm)}
.lanes{background:var(--card);border:1px solid var(--brd);border-radius:0 0 12px 12px;overflow:hidden}
.lane{display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:1px solid var(--brd);transition:.15s}
.lane:last-child{border-bottom:none}
.lane:hover{background:var(--card2)}
.lane.hit{background:linear-gradient(90deg,rgba(255,87,34,.16),rgba(255,87,34,.03));box-shadow:inset 3px 0 0 var(--fire)}
.lane-num{width:30px;height:30px;border-radius:8px;background:var(--card3);display:flex;align-items:center;justify-content:center;font-family:var(--fm);font-size:14px;font-weight:800;color:var(--ink2);flex-shrink:0}
.lane.hit .lane-num{background:var(--fire);color:#fff}
.lane-team{flex:1;min-width:0}
.lane-team .tname{font-size:15px;font-weight:800;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lane-team .tcat{font-size:10px;color:var(--ink3);margin-top:1px;display:flex;align-items:center;gap:5px}
.lane-team .tcat .cdot{width:7px;height:7px;border-radius:50%}
.state{text-align:center;padding:60px 20px;color:var(--ink3)}
.state .em{font-size:46px;margin-bottom:14px;opacity:.5}
.state .ttl{font-family:var(--ff);font-size:24px;letter-spacing:2px;color:var(--ink2);margin-bottom:6px}
.spinner{width:42px;height:42px;border:4px solid var(--brd2);border-top-color:var(--fire);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 18px}
@keyframes spin{to{transform:rotate(360deg)}}
.last-update{text-align:center;font-size:11px;color:var(--ink3);margin-top:8px;font-weight:600}
/* ===== TEMPS RÉEL : bandeau "prochain passage" + états de heat (100% client) ===== */
#nextBanner{margin:0 0 18px;display:none}
#nextBanner.show{display:block;animation:slideUp .35s cubic-bezier(.22,1,.36,1) backwards}
.nb-card{border-radius:16px;padding:14px 16px;border:1.5px solid var(--brd2);background:linear-gradient(135deg,var(--card2),var(--card));position:relative;overflow:hidden}
.nb-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:5px}
.nb-card .nb-kicker{font-size:11px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink3);display:flex;align-items:center;gap:7px}
.nb-card .nb-main{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-top:7px}
.nb-card .nb-count{font-family:var(--fm);font-size:clamp(30px,9vw,42px);font-weight:800;line-height:1;letter-spacing:-.5px}
.nb-card .nb-count .nb-unit{font-family:var(--fb);font-size:15px;font-weight:800;color:var(--ink2);letter-spacing:0;margin-left:3px}
.nb-card .nb-at{font-size:13px;font-weight:700;color:var(--ink2)}
.nb-card .nb-detail{margin-top:9px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;font-weight:700;color:var(--ink)}
.nb-card .nb-detail .nb-wod{font-family:var(--ff);font-size:19px;letter-spacing:1px;color:var(--ink)}
.nb-card .nb-detail .nb-tag{background:var(--card3);color:var(--ink2);padding:3px 10px;border-radius:7px;font-size:11px;font-weight:800;letter-spacing:.5px}
/* à venir (défaut) → ambre/feu */
.nb-card.nb-soon::before{background:linear-gradient(var(--ember),var(--fire))}
.nb-card.nb-soon .nb-count{color:var(--gold)}
.nb-card.nb-soon .nb-kicker{color:var(--ember)}
/* en ce moment → rouge pulsé */
.nb-card.nb-live{border-color:rgba(255,87,34,.55);background:linear-gradient(135deg,rgba(255,87,34,.16),rgba(255,87,34,.04))}
.nb-card.nb-live::before{background:var(--fire);box-shadow:0 0 16px var(--fire)}
.nb-card.nb-live .nb-kicker{color:var(--fire)}
.nb-card.nb-live .nb-count{color:var(--fire)}
.nb-card.nb-live .nb-livedot{width:10px;height:10px;border-radius:50%;background:var(--fire);box-shadow:0 0 10px var(--fire);animation:pulse 1.4s infinite;display:inline-block}
/* terminés → vert sobre */
.nb-card.nb-done::before{background:var(--ok)}
.nb-card.nb-done .nb-kicker{color:var(--ok)}
.nb-card.nb-done .nb-count{font-size:22px;color:var(--ink)}
/* invitation à choisir / hors plage → neutre */
.nb-card.nb-info::before{background:var(--ink3)}
.nb-card.nb-info .nb-count{font-size:20px;color:var(--ink2)}
.nb-est{font-size:11px;color:var(--ink3);font-weight:600;margin-top:8px;display:flex;align-items:center;gap:5px}
/* ---- badge EN COURS + états dans la grille ---- */
.heat-bar{position:relative}
.hb-live{background:linear-gradient(90deg,rgba(255,87,34,.22),var(--card2))!important;border-color:rgba(255,87,34,.45)!important;box-shadow:0 0 0 1px rgba(255,87,34,.25),0 6px 20px rgba(255,87,34,.14)}
.hb-badge{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:900;letter-spacing:1px;color:#fff;background:var(--fire);padding:3px 9px;border-radius:7px;text-transform:uppercase;white-space:nowrap;box-shadow:0 0 12px rgba(255,87,34,.5)}
.hb-badge .lv{width:6px;height:6px;border-radius:50%;background:#fff;animation:pulse 1.4s infinite}
.hb-badge.hb-next{background:var(--card3);color:var(--gold);box-shadow:none;border:1px solid rgba(255,176,32,.4)}
.heat-group.is-past{opacity:.5}
.heat-group.is-past .heat-bar{filter:saturate(.6)}
.heat-group.is-past .hb-done{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:800;letter-spacing:.5px;color:var(--ink3);background:var(--card3);padding:2px 8px;border-radius:7px;text-transform:uppercase}
@media print{
  @page{margin:1cm}
  .bg-glow,.controls,.btn,.hero-badge,.hero .tagline,.last-update{display:none!important}
  body,html{background:#fff!important;color:#000!important}
  .wrap{max-width:100%;padding:0}
  .hero{padding:0 0 14px}
  .hero h1{-webkit-text-fill-color:#000;color:#000;background:none;filter:none;font-size:40px}
  .hero .sub{color:#444}
  .day-head .num,.day-head .lbl{-webkit-text-fill-color:#000;color:#000;background:none}
  .day-head{border-color:#000}
  .heat-bar{background:#f0f0f0!important;border:1px solid #999;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .heat-bar .htime{color:#b8500a!important}
  .heat-bar .hwod{color:#000}
  .lanes{border:1px solid #999}
  .lane{border-color:#ddd;break-inside:avoid}
  .lane-num{background:#e8e8e8!important;color:#000;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .lane-team .tname{color:#000}
  .lane-team .tcat{color:#555}
  .cdot{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .heat-group{animation:none;page-break-inside:avoid}
}
</style>
<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').catch(function(){});}</script>
</head>
<body>
<div class="bg-glow"></div>
<div class="wrap">
  <div class="hero">
    <div class="hero-badge"><span class="dot"></span> Planning officiel</div>
    <h1>FOC 2026</h1>
    <div class="sub">DELTA</div>
    <div class="tagline">Retrouve ton equipe &middot; Horaires des deux jours</div>
  </div>
  <div class="controls">
    <div class="search-box">
      <span class="ico">&#128269;</span>
      <input type="text" id="search" placeholder="Cherche ton equipe..." autocomplete="off">
      <button class="clear" id="clearBtn" onclick="clearSearch()">&#10005;</button>
    </div>
    <div class="team-select-wrap">
      <span class="ico">&#128101;</span>
      <select id="teamSelect" onchange="onTeamSelect(this.value)">
        <option value="">— Choisis ton equipe dans la liste —</option>
      </select>
      <span class="chev">&#9660;</span>
    </div>
    <div class="ctrl-row">
      <div class="day-tabs" id="dayTabs"></div>
      <div class="spacer"></div>
      <button class="btn" onclick="loadPlanning()"><span class="ic" id="refIc">&#128260;</span> Actualiser</button>
      <button class="btn" id="myPdfBtn" onclick="downloadMyPlanning()" style="display:none;background:linear-gradient(135deg,var(--fire,#FF6B35),var(--ember,#E8421A));border:none;color:#fff;font-weight:800"><span class="ic">&#128196;</span> Mon planning PDF</button>
    </div>
    <div class="cat-filters" id="catFilters"></div>
  </div>
  <div id="nextBanner" aria-live="polite"></div>
  <div id="content">
    <div class="state"><div class="spinner"></div><div class="ttl">Chargement...</div></div>
  </div>
  <div class="last-update" id="lastUpdate"></div>
</div>
<script src="./firebase-app-compat.js"></script>
<script src="./firebase-database-compat.js"></script>
<script>
var FIREBASE_DB_URL='https://foc-2026-default-rtdb.europe-west1.firebasedatabase.app';
if(!firebase.apps.length) firebase.initializeApp({databaseURL:FIREBASE_DB_URL});
var db=firebase.database();
var _allHeats={},_dayFilter=null,_catFilter='all',_searchTerm='',_cats={};
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function fmtMin(m){m=parseInt(m,10);if(isNaN(m))return '--';var h=Math.floor(m/60),mn=m%60;return (h<10?'0':'')+h+':'+(mn<10?'0':'')+mn;}
function startMinuteFromHeat(h){
  if(!h) return null;
  if(h.estimatedStartMin!=null){var e=parseInt(h.estimatedStartMin,10);if(isFinite(e))return e;}
  var horaires=h.horaires||{};
  var wodId=(h.wodId!=null&&h.wodId!=='')?String(h.wodId):((h.wodInfo&&h.wodInfo.id!=null)?String(h.wodInfo.id):'');
  if(wodId && horaires[wodId] && horaires[wodId].debut!=null){var exact=parseInt(horaires[wodId].debut,10);if(isFinite(exact))return exact;}
  var keys=Object.keys(horaires);
  for(var i=0;i<keys.length;i++){var item=horaires[keys[i]];if(item&&item.debut!=null){var mins=parseInt(item.debut,10);if(isFinite(mins))return mins;}}
  return null;
}
// ★ TEMPS RÉEL — minute de FIN d'un heat (miroir de startMinuteFromHeat, lit .fin).
//   Les horaires publiés contiennent {debut,fin} par WOD (cf. index.html). AUCUNE lecture
//   Firebase : on travaille sur les données DÉJÀ en mémoire (_allHeats).
function endMinuteFromHeat(h){
  if(!h) return null;
  if(h.estimatedEndMin!=null){var e=parseInt(h.estimatedEndMin,10);if(isFinite(e))return e;}
  var horaires=h.horaires||{};
  var wodId=(h.wodId!=null&&h.wodId!=='')?String(h.wodId):((h.wodInfo&&h.wodInfo.id!=null)?String(h.wodInfo.id):'');
  if(wodId && horaires[wodId] && horaires[wodId].fin!=null){var exact=parseInt(horaires[wodId].fin,10);if(isFinite(exact))return exact;}
  var keys=Object.keys(horaires);
  for(var i=0;i<keys.length;i++){var item=horaires[keys[i]];if(item&&item.fin!=null){var mins=parseInt(item.fin,10);if(isFinite(mins))return mins;}}
  // repli : pas de .fin → on estime une durée de heat par défaut après le début
  var st=startMinuteFromHeat(h);
  return (st==null)?null:st+_DEFAULT_HEAT_MIN;
}
// ═══════════════ HORLOGE TEMPS RÉEL (100% local, 0 appel réseau) ═══════════════
// Les horaires sont stockés en MINUTES DANS LA JOURNÉE (ex: 845 = 14:05) + un n° de jour.
// La page planning_public NE contient PAS de date calendaire ni d'offset serveur : on se
// base donc sur l'heure LOCALE du téléphone. _MOCK_NOW_MS permet aux tests d'injecter l'heure.
var _DEFAULT_HEAT_MIN=6;            // durée de repli si un heat n'a pas de .fin
var _MOCK_NOW_MS=null;              // override test uniquement (window.__setMockNow)
var _TICK_MS=20000;                 // rafraîchissement local du "dans X min"
var _liveTimer=null;
function _nowMs(){ return (_MOCK_NOW_MS!=null)?_MOCK_NOW_MS:Date.now(); }
function nowMinuteOfDay(){ var d=new Date(_nowMs()); return d.getHours()*60+d.getMinutes()+d.getSeconds()/60; }
function _fmtDelta(mins){                // "~23 min", "~1 h 05", "<1 min"
  mins=Math.round(mins);
  if(mins<=0) return 'maintenant';
  if(mins<60) return '~'+mins+' min';
  var h=Math.floor(mins/60),mn=mins%60;
  return '~'+h+' h'+(mn>0?' '+(mn<10?'0':'')+mn:'');
}
// Jours présents dans le planning (triés).
function _planningDays(){
  var set={};
  Object.keys(_allHeats).forEach(function(hid){var h=_allHeats[hid];if(!h)return;var j=parseInt(h.catJour||h.jour||1,10)||1;set[j]=true;});
  return Object.keys(set).map(function(x){return parseInt(x,10);}).sort(function(a,b){return a-b;});
}
// ★ Comme la page n'a pas la DATE de la compét, on détermine le "jour pertinent" (celui sur
//   lequel appliquer EN COURS / terminé) à partir de l'heure courante :
//   - le jour qui a un heat en cours [debut,fin[  → ce jour ;
//   - sinon le 1er jour qui a encore un heat à venir aujourd'hui → ce jour ;
//   - sinon (tout est passé pour l'heure courante) → le dernier jour.
//   Évite de marquer tous les heats du J1 comme "terminés" si on ouvre la page le matin du J2
//   (chaque jour est évalué contre la même heure du téléphone, qui est l'heure du jour réel).
function _liveDayContext(){
  var now=nowMinuteOfDay(), days=_planningDays();
  if(!days.length) return null;
  var liveDay=null, nextDay=null;
  days.forEach(function(j){
    Object.keys(_allHeats).forEach(function(hid){
      var h=_allHeats[hid]; if(!h) return;
      if((parseInt(h.catJour||h.jour||1,10)||1)!==j) return;
      var s=startMinuteFromHeat(h), e=endMinuteFromHeat(h);
      if(s==null) return;
      if(e==null) e=s+_DEFAULT_HEAT_MIN;
      if(now>=s&&now<e){ if(liveDay==null) liveDay=j; }
      if(now<s){ if(nextDay==null) nextDay=j; }
    });
  });
  return liveDay!=null?liveDay:(nextDay!=null?nextDay:days[days.length-1]);
}
// État temporel d'un heat pour un jour-contexte donné : 'live' | 'past' | 'future'.
//   - jour < jour-contexte  → 'past'   (définitivement terminé : on a dépassé ce jour)
//   - jour > jour-contexte  → 'future' (pas encore : aucun marquage trompeur)
//   - jour === jour-contexte → comparaison [debut,fin[ à l'heure courante
function _heatTimeState(h, ctxDay){
  if(!h) return 'future';
  var j=parseInt(h.catJour||h.jour||1,10)||1;
  if(ctxDay!=null && j<ctxDay) return 'past';
  if(ctxDay!=null && j>ctxDay) return 'future';
  var s=startMinuteFromHeat(h); if(s==null) return 'future';
  var e=endMinuteFromHeat(h); if(e==null) e=s+_DEFAULT_HEAT_MIN;
  var now=nowMinuteOfDay();
  if(now<s) return 'future';
  if(now>=e) return 'past';
  return 'live';
}
// ★★ BANDE PASSANTE : convertit le nœud léger "planning_public" (~18 Ko, champs courts)
//   vers le format complet attendu par render()/buildFilters(). On ne touche qu'ici.
function _expandPlanningPublic(pub){
  var out={};
  if(!pub) return out;
  Object.keys(pub).forEach(function(hid){
    var p=pub[hid]; if(!p) return;
    var lanes={};
    var pl=p.ln||{};
    Object.keys(pl).forEach(function(k){
      var o=pl[k]||{};
      var l={teamName:o.t};
      if(o.g){ l.isGuest=true; if(o.tci)l.teamCatId=o.tci; if(o.tcn)l.teamCatName=o.tcn; if(o.tcc)l.teamCatColor=o.tcc; }
      lanes[k]=l;
    });
    out[hid]={
      catJour:p.j, jour:p.j,
      catId:p.cid, catName:p.cn, catNom:p.cn, catCouleur:p.cc,
      catZone:p.z, zone:p.z,
      horaires:p.ho||{},
      wodNom:p.w, wodInfo:{nom:p.w},
      globalNum:p.gn, catHeatNum:p.chn, wodHeatNum:p.chn,
      nbHeatsTotal:p.nb, wodHeatTotal:p.nb,
      lanes:lanes
    };
  });
  return out;
}

// ★ Remplit le menu déroulant avec TOUTES les équipes, GROUPÉES PAR CATÉGORIE
//   (séparateurs <optgroup>). Dédupliqué, trié A→Z dans chaque catégorie.
function _fillTeamsList(){
  var sel=document.getElementById('teamSelect'); if(!sel) return;
  var seen={}, byCat={}, catOrder=[], total=0;
  Object.keys(_allHeats).forEach(function(hid){
    var h=_allHeats[hid]; if(!h) return;
    var catName=h.catName||h.catNom||'Categorie';
    var lanes=h.lanes||h.slots||{};
    Object.keys(lanes).forEach(function(ln){
      var l=lanes[ln]; if(!l||!l.teamName) return;
      var nm=String(l.teamName).trim(); if(!nm) return;
      var key=nm.toLowerCase(); if(seen[key]) return;
      seen[key]=1; total++;
      // catégorie de l'équipe (invité = sa propre catégorie, comme dans render())
      var cat=(l.isGuest&&l.teamCatName)?l.teamCatName:catName;
      if(!byCat[cat]){ byCat[cat]=[]; catOrder.push(cat); }
      byCat[cat].push(nm);
    });
  });
  catOrder.sort(function(a,b){return a.localeCompare(b,'fr',{sensitivity:'base'});});
  var cur=sel.value;
  var html='<option value="">— Choisis ton equipe ('+total+') —</option>';
  catOrder.forEach(function(cat){
    byCat[cat].sort(function(a,b){return a.localeCompare(b,'fr',{sensitivity:'base'});});
    html+='<optgroup label="'+esc(cat)+'">'
      + byCat[cat].map(function(n){return '<option value="'+esc(n)+'">'+esc(n)+'</option>';}).join('')
      + '</optgroup>';
  });
  sel.innerHTML=html;
  if(cur){ sel.value=cur; }
}

// ★★ CACHE PLANNING (bande passante niveau ultime) ───────────────────────────────────
//   Le planning est FIGÉ après "Générer & Publier". On le garde donc en mémoire du
//   téléphone (localStorage) avec son numéro de version "v". À chaque ouverture, on lit
//   SEULEMENT la version (quelques octets) : si elle n'a pas changé → on affiche le cache
//   (0 Ko de planning téléchargé). Si elle a changé (ex: arrêt d'urgence qui décale les
//   horaires) → on re-télécharge le planning léger une seule fois et on remet à jour le cache.
var _CACHE_KEY='boxcrew_planning_cache_v1';
function _readCache(){
  try{ var raw=localStorage.getItem(_CACHE_KEY); return raw?JSON.parse(raw):null; }catch(e){ return null; }
}
function _writeCache(v, heatsObj){
  // ★ NE JAMAIS cacher un planning vide (sinon on resservirait du vide en boucle).
  if(!heatsObj || !Object.keys(heatsObj).length) return;
  try{ localStorage.setItem(_CACHE_KEY, JSON.stringify({v:v, h:heatsObj})); }catch(e){}
}
function _cacheHasData(c){ return !!(c && c.h && _countTeams(c.h) > 0); }
// ★ Compte les heats qui ont au moins une équipe (= affichables). Sert de filet : si la
//   version légère ne produit RIEN d'affichable, on bascule sur le nœud "heats" complet.
function _countTeams(heatsObj){
  var n=0;
  try{
    Object.keys(heatsObj||{}).forEach(function(hid){
      var h=heatsObj[hid]; if(!h) return;
      var lanes=h.lanes||h.slots||{};
      Object.keys(lanes).forEach(function(k){ if(lanes[k]&&lanes[k].teamName) n++; });
    });
  }catch(e){}
  return n;
}
function _loadHeatsFull(ic, cb){
  db.ref('heats').once('value').then(function(s2){
    _allHeats=s2.val()||{};
    _afterPlanningLoaded(ic);
    if(cb) cb(true);
  }).catch(function(){ if(cb)cb(false); else _planErr(); });
}
function _loadFromPlanningPublic(ic, cb){
  // télécharge le nœud léger complet, l'étend, met en cache, affiche
  db.ref('planning_public').once('value').then(function(snap){
    var pub=snap.val();
    if(pub && pub.heats && Object.keys(pub.heats).length){
      var expanded=_expandPlanningPublic(pub.heats);
      // ★★ FILET : si la version légère ne contient aucune équipe affichable, on NE l'utilise
      //   pas — on retombe sur "heats" complet (comportement d'origine, toujours fiable).
      if(_countTeams(expanded) > 0){
        _allHeats=expanded;
        _writeCache(pub.v||0, _allHeats);
        _afterPlanningLoaded(ic);
        if(cb) cb(true);
        return;
      }
      // planning_public vide/incomplet → fallback heats
      _loadHeatsFull(ic, cb);
      return;
    }
    // Pas de planning_public → heats complet comme avant
    _loadHeatsFull(ic, cb);
  }).catch(function(){
    _loadHeatsFull(ic, cb);
  });
}
function loadPlanning(){
  var ic=document.getElementById('refIc'); if(ic) ic.style.transform='rotate(360deg)';
  var cache=_readCache();
  var hasCache=_cacheHasData(cache);  // ★ cache valide SEULEMENT s'il contient des heats
  // 1) On lit UNIQUEMENT la version (quelques octets), pas tout le planning
  db.ref('planning_public/v').once('value').then(function(snap){
    var v=snap.val();
    if(v==null){
      // pas encore de planning_public → cache valide si présent, sinon chargement complet
      if(hasCache){ _allHeats=cache.h; _afterPlanningLoaded(ic); }
      else _loadFromPlanningPublic(ic);
      return;
    }
    // 2) Version inchangée ET cache VALIDE (non vide) → 0 Ko, on affiche le cache
    if(hasCache && String(cache.v)===String(v)){
      _allHeats=cache.h;
      _afterPlanningLoaded(ic);
      return;
    }
    // 3) Version changée, OU pas de cache, OU cache vide → on recharge le planning léger
    _loadFromPlanningPublic(ic);
  }).catch(function(){
    // Hors ligne / erreur réseau : on affiche le cache SEULEMENT s'il a des données
    if(hasCache){ _allHeats=cache.h; _afterPlanningLoaded(ic); }
    else _loadFromPlanningPublic(ic);
  });
}
function buildFilters(){
  var daysSet={}; _cats={};
  Object.keys(_allHeats).forEach(function(hid){
    var h=_allHeats[hid]; if(!h) return;
    var j=parseInt(h.catJour||h.jour||1,10)||1; daysSet[j]=true;
    var catId=String(h.catId||h.catName||''),catName=h.catName||h.catNom||'Categorie',catColor=h.catCouleur||'#4DA6FF';
    var lanes=h.lanes||h.slots||{};
    Object.keys(lanes).forEach(function(ln){
      var l=lanes[ln]; if(!l||!l.teamName) return;
      var cid=(l.isGuest&&l.teamCatId)?String(l.teamCatId):catId;
      var cnm=(l.isGuest&&l.teamCatName)?l.teamCatName:catName;
      var ccl=(l.isGuest&&l.teamCatColor)?l.teamCatColor:catColor;
      if(!_cats[cid])_cats[cid]={name:cnm,color:ccl,count:0};
      _cats[cid].count++;
    });
  });
  var days=Object.keys(daysSet).map(function(x){return parseInt(x,10);}).sort(function(a,b){return a-b;});
  if(_dayFilter==null)_dayFilter=days.length?days[0]:1;
  if(days.indexOf(_dayFilter)===-1&&_dayFilter!=='all')_dayFilter=days.length?days[0]:1;
  var dt=document.getElementById('dayTabs'),html='';
  days.forEach(function(j){html+='<button class="day-tab'+(_dayFilter===j?' active':'')+'" onclick="setDay('+j+')">Jour '+j+'</button>';});
  if(days.length>1)html+='<button class="day-tab'+(_dayFilter==='all'?' active':'')+'" onclick="setDay(\'all\')">Tout</button>';
  dt.innerHTML=html;
  var cf=document.getElementById('catFilters');
  var catHtml='<button class="cat-chip'+(_catFilter==='all'?' active':'')+'" style="'+(_catFilter==='all'?'background:linear-gradient(135deg,var(--fire),var(--ember))':'')+'" onclick="setCat(\'all\')">Toutes</button>';
  Object.keys(_cats).sort(function(a,b){return _cats[a].name.localeCompare(_cats[b].name,'fr');}).forEach(function(cid){
    var c=_cats[cid],act=_catFilter===cid;
    catHtml+='<button class="cat-chip'+(act?' active':'')+'" style="'+(act?'background:'+c.color+';':'')+'" onclick="setCat(\''+esc(cid).replace(/\x27/g,"\\\x27")+'\')"><span class="cdot" style="background:'+c.color+'"></span>'+esc(c.name)+' <span class="ccount">'+c.count+'</span></button>';
  });
  cf.innerHTML=catHtml;
}

      teamName=l.teamName;
      catName=(l.isGuest&&l.teamCatName)?l.teamCatName:(h.catName||h.catNom||'');

        jour:parseInt(h.catJour||h.jour||1,10)||1,

        nbHeats:parseInt(h.nbHeatsTotal||h.wodHeatTotal||0,10)||0,

  passages.sort(function(a,b){ if(a.jour!==b.jour)return a.jour-b.jour; var sa=a.startMin==null?999999:a.startMin,sb=b.startMin==null?999999:b.startMin; return sa-sb; });
  var byDay={}; passages.forEach(function(p){ (byDay[p.jour]=byDay[p.jour]||[]).push(p); });

  var dateStr=new Date().toLocaleDateString('fr-FR');
  // ★ QR codes planning + classement : l'athlète garde son PDF papier et scanne pour

    + '</div>';
  var html='<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Planning - '+esc(teamName)+'</title><style>'
    + 'body{font-family:"Segoe UI",system-ui,Arial,sans-serif;color:#15161A;margin:0;padding:24px}'

  var w=window.open('','_blank');

function heatGlobalNum(hid,h){var n=parseInt(h.globalNum||h.catHeatNum||String(hid).replace(/\D/g,''),10);return isNaN(n)?0:n;}
// ═══════════════ BANDEAU "PROCHAIN PASSAGE" (équipe sélectionnée) ═══════════════
// Réutilise EXACTEMENT la logique de correspondance d'équipe de downloadMyPlanning()/render()
// (_searchTerm vs teamName), sur les données déjà chargées. 0 appel Firebase.
function _myPassages(){
  if(!_searchTerm) return [];
  var out=[];
  Object.keys(_allHeats).forEach(function(hid){
    var h=_allHeats[hid]; if(!h) return;
    var lanes=h.lanes||h.slots||{};
    Object.keys(lanes).forEach(function(ln){
      var l=lanes[ln]; if(!l||!l.teamName) return;
      if(l.teamName.toLowerCase().indexOf(_searchTerm)<0) return;
      out.push({
        jour:parseInt(h.catJour||h.jour||1,10)||1,
        startMin:startMinuteFromHeat(h),
        endMin:endMinuteFromHeat(h),
        zone:h.catZone||h.zone||1,
        lane:ln,
        wod:(h.wodInfo&&h.wodInfo.nom)||h.wodNom||h.wod||'WOD'
      });
    });
  });
  out=out.filter(function(p){return p.startMin!=null;});
  out.sort(function(a,b){ if(a.jour!==b.jour)return a.jour-b.jour; return a.startMin-b.startMin; });
  return out;
}
// Minute "absolue" sur l'axe multi-jours : (jour-1)*1440 + minute. Permet de comparer des
// passages de jours différents à l'heure courante du jour-contexte pertinent.
function _absMin(jour, minOfDay, ctxDay){ return ((jour-(ctxDay||jour)))*1440 + minOfDay; }
function _renderBanner(){
  var el=document.getElementById('nextBanner'); if(!el) return;
  // pas d'équipe choisie → petite invitation (le badge EN COURS de la grille suffit).
  if(!_searchTerm){
    el.className='show';
    el.innerHTML='<div class="nb-card nb-info"><div class="nb-kicker">👥 Ton planning perso</div>'
      +'<div class="nb-main"><span class="nb-count">Choisis ton équipe</span></div>'
      +'<div class="nb-detail" style="color:var(--ink2);font-weight:600">Sélectionne-la dans la liste pour voir ton prochain passage en direct.</div></div>';
    return;
  }
  var ps=_myPassages();
  if(!ps.length){ el.className=''; el.innerHTML=''; return; }
  var ctx=_liveDayContext();
  var now=nowMinuteOfDay();
  // passage EN COURS pour cette équipe (dans le jour-contexte) ?
  var liveP=null;
  for(var i=0;i<ps.length;i++){var p=ps[i];var e=p.endMin==null?p.startMin+_DEFAULT_HEAT_MIN:p.endMin;
    if(p.jour===ctx && now>=p.startMin && now<e){ liveP=p; break; }}
  // prochain passage à venir (jour-contexte d'abord, sinon jours suivants).
  var nextP=null, bestAbs=Infinity;
  ps.forEach(function(p){
    var ref=(p.jour<ctx)? -1 : _absMin(p.jour,p.startMin,ctx);   // jours passés exclus
    if(p.jour<ctx) return;
    if(p.jour===ctx && now>=p.startMin) return;                  // déjà commencé/fini aujourd'hui
    if(ref<bestAbs){ bestAbs=ref; nextP=p; }
  });
  var tagHtml=function(p){
    return '<span class="nb-wod">'+esc(p.wod)+'</span>'
      +'<span class="nb-tag">Zone '+esc(p.zone)+'</span>'
      +'<span class="nb-tag">Lane '+esc(p.lane)+'</span>'
      +(p.jour!==ctx?'<span class="nb-tag">Jour '+p.jour+'</span>':'');
  };
  var est='<div class="nb-est">⚠️ Horaires estimatifs (prévisionnels, susceptibles d\'être décalés)</div>';
  el.className='show';
  if(liveP){
    el.innerHTML='<div class="nb-card nb-live"><div class="nb-kicker"><span class="nb-livedot"></span> En ce moment</div>'
      +'<div class="nb-main"><span class="nb-count" style="font-size:26px">🔴 C\'EST À TOI</span></div>'
      +'<div class="nb-detail">'+tagHtml(liveP)+'</div>'
      +'<div class="nb-est">Jusqu\'à ~'+fmtMin(liveP.endMin)+' (estimatif)</div></div>';
    return;
  }
  if(nextP){
    var delta=_absMin(nextP.jour,nextP.startMin,ctx)-now;   // minutes jusqu'au départ
    var kicker, countInner;
    // Avant le tout début de la journée-contexte : phrasé "la compét commence à…"
    var firstStart=_firstStartOfDay(ctx);
    var beforeStart=(nextP.jour===ctx && firstStart!=null && now<firstStart && nextP.startMin===firstStart);
    if(beforeStart){
      kicker='⏱️ Avant le début';
      countInner='<span class="nb-count">'+_fmtDelta(delta)+'<span class="nb-unit">avant le 1er heat</span></span>'
        +'<span class="nb-at">(départ à '+fmtMin(nextP.startMin)+')</span>';
    } else {
      kicker='⏱️ Prochain passage';
      countInner='<span class="nb-count" id="nbCount">'+_fmtDelta(delta)+'<span class="nb-unit">restantes</span></span>'
        +'<span class="nb-at">(à '+fmtMin(nextP.startMin)+')</span>';
    }
    el.innerHTML='<div class="nb-card nb-soon"><div class="nb-kicker">'+kicker+'</div>'
      +'<div class="nb-main">'+countInner+'</div>'
      +'<div class="nb-detail">'+tagHtml(nextP)+'</div>'+est+'</div>';
    return;
  }
  // plus aucun passage à venir → tout terminé.
  el.innerHTML='<div class="nb-card nb-done"><div class="nb-kicker">✅ Terminé</div>'
    +'<div class="nb-main"><span class="nb-count">Tous tes passages sont terminés</span></div>'
    +'<div class="nb-detail" style="color:var(--ink2);font-weight:600">Bravo &mdash; rendez-vous sur le classement en direct !</div></div>';
}
// 1er heat (minute de début) d'un jour donné, tous WOD/zones confondus.
function _firstStartOfDay(jour){
  var min=null;
  Object.keys(_allHeats).forEach(function(hid){
    var h=_allHeats[hid]; if(!h) return;
    if((parseInt(h.catJour||h.jour||1,10)||1)!==jour) return;
    var s=startMinuteFromHeat(h); if(s==null) return;
    if(min==null||s<min) min=s;
  });
  return min;
}
// ═══════════════ TICK LOCAL (setInterval) — met à jour SANS re-render ni réseau ═══════════════
// Recalcule le "dans X min" (bandeau) et réapplique les états EN COURS/terminé aux .heat-group
// déjà présents dans le DOM. AUCUNE lecture Firebase ici : pur calcul sur _allHeats + horloge.
function _applyGridStates(){
  var ctx=_liveDayContext();
  var groups=document.querySelectorAll('#content .heat-group[data-hid]');
  for(var i=0;i<groups.length;i++){
    var g=groups[i], hid=g.getAttribute('data-hid'), h=_allHeats[hid];
    if(!h){ continue; }
    var st=_heatTimeState(h, ctx);
    var bar=g.querySelector('.heat-bar'); if(!bar) continue;
    g.classList.toggle('is-past', st==='past');
    bar.classList.toggle('hb-live', st==='live');
    // (ré)insère/retire les pastilles d'état sans toucher au reste de la barre
    var old=bar.querySelector('.hb-badge,.hb-done'); if(old) old.remove();
    if(st==='live'){
      var b=document.createElement('span'); b.className='hb-badge';
      b.innerHTML='<span class="lv"></span> En cours';
      bar.insertBefore(b, bar.firstChild);
    } else if(st==='past'){
      var d=document.createElement('span'); d.className='hb-done'; d.textContent='✓ Terminé';
      var nE=bar.querySelector('.hnum'); if(nE) bar.insertBefore(d, nE); else bar.appendChild(d);
    }
  }
}
function _tickLive(){
  try{ _renderBanner(); }catch(e){}
  try{ _applyGridStates(); }catch(e){}
}
function _startLiveTimer(){
  if(_liveTimer) return;                 // un seul interval, jamais dupliqué
  _liveTimer=setInterval(_tickLive, _TICK_MS);
}
// Hook de test : injecte l'heure courante en ms puis rafraîchit (sans toucher au réseau).
window.__setMockNow=function(ms){ _MOCK_NOW_MS=ms; _tickLive(); };
window.__clearMockNow=function(){ _MOCK_NOW_MS=null; _tickLive(); };
function render(){
  var content=document.getElementById('content'),list=[];
  Object.keys(_allHeats).forEach(function(hid){
    var h=_allHeats[hid]; if(!h) return;
    var j=parseInt(h.catJour||h.jour||1,10)||1;
    if(_dayFilter!=='all'&&j!==_dayFilter) return;
    var lanes=h.lanes||h.slots||{},laneArr=[];
    Object.keys(lanes).forEach(function(ln){
      var l=lanes[ln]; if(!l||!l.teamName) return;
      var cid=(l.isGuest&&l.teamCatId)?String(l.teamCatId):String(h.catId||h.catName||'');
      var cnm=(l.isGuest&&l.teamCatName)?l.teamCatName:(h.catName||h.catNom||'');
      var ccl=(l.isGuest&&l.teamCatColor)?l.teamCatColor:(h.catCouleur||'#4DA6FF');
      if(_catFilter!=='all'&&cid!==_catFilter) return;
      laneArr.push({ln:ln,team:l.teamName,catId:cid,catName:cnm,catColor:ccl});
    });
    if(!laneArr.length) return;
    laneArr.sort(function(a,b){return (parseInt(a.ln,10)||0)-(parseInt(b.ln,10)||0);});
    list.push({hid:hid,jour:j,startMin:startMinuteFromHeat(h),zone:h.catZone||h.zone||1,
      wod:(h.wodInfo&&h.wodInfo.nom)||h.wodNom||h.wod||'WOD',globalNum:heatGlobalNum(hid,h),
      catHeatNum:parseInt(h.catHeatNum||h.wodHeatNum||0,10)||0,nbHeats:parseInt(h.nbHeatsTotal||h.wodHeatTotal||0,10)||0,lanes:laneArr});
  });
  list.sort(function(a,b){
    if(a.jour!==b.jour)return a.jour-b.jour;
    var sa=a.startMin==null?999999:a.startMin,sb=b.startMin==null?999999:b.startMin;
    if(sa!==sb)return sa-sb;
    return a.globalNum-b.globalNum;
  });
  if(!list.length){
    content.innerHTML='<div class="state"><div class="em">&#128269;</div><div class="ttl">Aucun resultat</div><div>'+(_searchTerm?'Aucune equipe ne correspond':'Pas de heat pour ce filtre')+'</div></div>';
    _renderBanner();        // ★ le bandeau reste utile même si le filtre jour ne montre rien
    _startLiveTimer();
    return;
  }
  var byDay={};
  list.forEach(function(it){(byDay[it.jour]=byDay[it.jour]||[]).push(it);});
  var _ctxDay=_liveDayContext();   // ★ jour pertinent pour EN COURS / terminé (0 réseau)
  var html='';
  Object.keys(byDay).map(function(x){return parseInt(x,10);}).sort(function(a,b){return a-b;}).forEach(function(j){
    var heats=byDay[j];
    html+='<div class="day-block"><div class="day-head"><span class="num">J'+j+'</span><span class="lbl">JOUR '+j+'</span><span class="meta">'+heats.length+' heats</span></div>';
    var di=0;
    heats.forEach(function(ht){
      di++;
      var heatNumLbl=(ht.catHeatNum&&ht.nbHeats)?('H'+ht.catHeatNum+'/'+ht.nbHeats):(ht.globalNum?('#'+ht.globalNum):'');
      // ★ état temporel initial (correct dès le 1er paint, avant le 1er tick)
      var st=_heatTimeState(_allHeats[ht.hid], _ctxDay);
      var grpCls='heat-group'+(st==='past'?' is-past':'');
      var barCls='heat-bar'+(st==='live'?' hb-live':'');
      var liveBadge=(st==='live')?'<span class="hb-badge"><span class="lv"></span> En cours</span>':'';
      var doneBadge=(st==='past')?'<span class="hb-done">✓ Terminé</span>':'';
      html+='<div class="'+grpCls+'" data-hid="'+esc(ht.hid)+'" data-jour="'+j+'" style="animation-delay:'+(Math.min(di*0.03,0.4))+'s">';
      html+='<div class="'+barCls+'">'+liveBadge+'<span class="htime">'+fmtMin(ht.startMin)+'</span><span class="hzone">Zone '+esc(ht.zone)+'</span><span class="hwod">'+esc(ht.wod)+'</span>'+doneBadge+'<span class="hnum">'+heatNumLbl+'</span></div>';
      html+='<div class="lanes">';
      ht.lanes.forEach(function(l){
        var hit=_searchTerm&&l.team.toLowerCase().indexOf(_searchTerm)>=0;
        html+='<div class="lane'+(hit?' hit':'')+'"><div class="lane-num">'+esc(l.ln)+'</div><div class="lane-team"><div class="tname">'+esc(l.team)+'</div><div class="tcat"><span class="cdot" style="background:'+l.catColor+'"></span>'+esc(l.catName)+'</div></div></div>';
      });
      html+='</div></div>';
    });
    html+='</div>';
  });
  content.innerHTML=html;
  _renderBanner();        // ★ bandeau prochain passage (équipe sélectionnée)
  _startLiveTimer();      // ★ démarre (une seule fois) le rafraîchissement local 20 s
  if(_searchTerm){var fh=content.querySelector('.lane.hit');if(fh)fh.scrollIntoView({behavior:'smooth',block:'center'});}
}
loadPlanning();
</script>
