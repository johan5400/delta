<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Historique des Résultats</title>
<script>var FIREBASE_DB_URL='https://foc-2026-default-rtdb.europe-west1.firebasedatabase.app';</script>
<script src="./firebase-app-compat.js"></script>
<script src="./firebase-database-compat.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#05070a;--panel:#0d1520;--panel2:#0f1a28;
  --brd:rgba(255,255,255,.08);--brd2:rgba(255,255,255,.13);
  --ink:#E8F4FF;--ink2:#7FB8E0;--ink3:#3A5270;--mid:#2E5070;
  --accent:#FF5722;--accent2:#FF8A00;
  --ok:#06D6A0;--err:#ef4444;--warn:#FFB020;--gold:#FFD166;
  --ff:'Bebas Neue',sans-serif;--fb:'Plus Jakarta Sans',sans-serif;--fm:'JetBrains Mono',monospace;
}
html,body{min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--fb);overflow-x:hidden}
body{display:flex;flex-direction:column;min-height:100vh}

/* TOPBAR */
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:10px 18px;background:rgba(3,5,10,.96);backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,.06)}
.brand{display:flex;align-items:center;gap:10px}
.brand-k{width:36px;height:36px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-family:var(--ff);font-size:22px;color:#fff;flex-shrink:0}
.brand-title{font-family:var(--ff);font-size:22px;letter-spacing:2px;line-height:1;color:#fff}
.nav-links{display:flex;gap:10px}
.nav-btn{text-decoration:none;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.03);color:var(--ink2);border-radius:999px;padding:6px 14px;font-size:10px;font-weight:800;letter-spacing:1px;text-transform:uppercase;transition:.15s}
.nav-btn:hover{background:rgba(255,255,255,.08)}

/* FILTERS */
.filters{padding:16px 18px;display:flex;gap:10px;overflow-x:auto;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filter-chip{white-space:nowrap;padding:8px 16px;border-radius:999px;background:var(--panel);border:1px solid var(--brd);color:var(--ink2);font-size:12px;font-weight:700;cursor:pointer;transition:.2s}
.filter-chip.active{background:var(--accent);color:#fff;border-color:transparent}

/* CONTENT */
.shell{flex:1;padding:0 18px 24px;display:flex;flex-direction:column;gap:16px}
.section-title{font-family:var(--ff);font-size:24px;letter-spacing:2px;color:var(--gold);margin-bottom:4px;display:flex;align-items:center;gap:8px}
.section-title::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--brd),transparent)}

.history-grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(340px, 1fr));gap:16px}
@media (max-width:400px){ .history-grid{grid-template-columns:1fr} }

.heat-card{background:var(--panel);border:1px solid var(--brd);border-radius:16px;overflow:hidden;transition:transform .2s, border-color .2s}
.heat-card:hover{border-color:rgba(255,255,255,.15)}
.heat-header{padding:12px 16px;background:rgba(255,255,255,.02);border-bottom:1px solid var(--brd);display:flex;justify-content:space-between;align-items:flex-start}
.heat-info{display:flex;flex-direction:column;gap:2px}
.heat-num{font-family:var(--ff);font-size:14px;color:var(--ink3);letter-spacing:1px}
.heat-wod{font-family:var(--ff);font-size:20px;color:#fff;letter-spacing:1px}
.heat-cat{font-size:11px;color:var(--ink2);font-weight:700}
.heat-status{padding:4px 8px;border-radius:6px;font-size:9px;font-weight:900;letter-spacing:1px;text-transform:uppercase;background:rgba(6,214,160,.12);color:#06D6A0}

.results-list{padding:8px 0}
.result-row{display:grid;grid-template-columns:32px 1fr auto;gap:12px;align-items:center;padding:8px 16px;border-bottom:1px solid rgba(255,255,255,.03)}
.result-row:last-child{border-bottom:none}
.res-rank{font-family:var(--ff);font-size:18px;text-align:center;color:var(--ink3)}
.res-rank.p1{color:#FFD700}.res-rank.p2{color:#C0C0C0}.res-rank.p3{color:#CD7F32}
.res-name{font-weight:700;font-size:14px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res-score{font-family:var(--fm);font-size:13px;font-weight:700;color:var(--ink2)}

.empty-state{padding:60px 20px;text-align:center;color:var(--ink3)}
.empty-icon{font-size:48px;margin-bottom:16px;opacity:.3}

/* LOADING */
.loader{display:flex;justify-content:center;padding:40px}
.spinner{width:30px;height:30px;border:3px solid rgba(255,255,255,.1);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').catch(function(){});}</script>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <div class="brand-k">F</div>
    <div class="brand-title">HISTORY</div>
  </div>
  <div class="nav-links">
    <span id="history-stamp" style="font-size:12px;color:rgba(255,255,255,.45);margin-right:4px;align-self:center"></span>
    <button id="history-refresh" class="nav-btn" onclick="loadHistory()" style="cursor:pointer;background:none;font-family:inherit">↻ Actualiser</button>
    <a href="live.html" class="nav-btn">← Live</a>
  </div>
</div>

<div id="filters-container" class="filters">
  <div class="filter-chip active" onclick="setFilter('all')">TOUS</div>
</div>

<div class="shell">
  <div id="content">
    <div class="loader"><div class="spinner"></div></div>
  </div>
</div>

<script>
firebase.initializeApp({databaseURL:FIREBASE_DB_URL});
var db=firebase.database();

var HEATS = {};
var SCORES = {};
var CURRENT_FILTER = 'all';

// Utils
function escH(s){ if(!s)return ''; return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function fmt(s){ if(!s||s<0)return '--:--'; var m=Math.floor(s/60),se=s%60; return m+':'+(se<10?'0':'')+se; }

function getScoreDisplay(sc, wod) {
  if(!sc || !sc.judgeOk) return '—';
  var t = String(wod.wodFormat || wod.type || '').toLowerCase();
  var sf = String(wod.scoreFinale || wod.scoreType || '').toLowerCase();
  var jm = String(wod.judgeMode || '').toLowerCase();
  
  if(jm==='maxload'||sf==='load'||t==='maxload') return (sc.load||0)+' kg';
  if(sf==='dist') return (sc.dist||sc.distance||0)+' m';
  if(t==='fortime'||sf==='time') return sc.finalTime > 0 ? fmt(sc.finalTime) : '—';
  return (sc.reps||0)+' reps';
}

function getScoreValue(sc, wod) {
  if(!sc || !sc.judgeOk) return -1;
  var t = String(wod.wodFormat || wod.type || '').toLowerCase();
  var sf = String(wod.scoreFinale || wod.scoreType || '').toLowerCase();
  
  if(t==='fortime'||sf==='time') return sc.finalTime > 0 ? -sc.finalTime : -999999;
  return parseInt(sc.reps) || parseFloat(sc.load) || parseFloat(sc.dist) || 0;
}

function setFilter(f) {
  CURRENT_FILTER = f;
  document.querySelectorAll('.filter-chip').forEach(el => {
    el.classList.toggle('active', el.textContent === f || (f==='all' && el.textContent==='TOUS'));
  });
  render();
}

function render() {
  var content = document.getElementById('content');
  var filteredHeats = Object.keys(HEATS)
    .map(id => ({id: id, ...HEATS[id]}))
    .filter(h => h.status === 'done' || h.status === 'timecap');
  
  // Extraire les catégories pour les filtres
  var cats = [...new Set(filteredHeats.map(h => h.catName))].filter(Boolean).sort();
  var filtersHtml = '<div class="filter-chip '+(CURRENT_FILTER==='all'?'active':'')+'" onclick="setFilter(\'all\')">TOUS</div>';
  cats.forEach(c => {
    filtersHtml += '<div class="filter-chip '+(CURRENT_FILTER===c?'active':'')+'" onclick="setFilter(\''+c+'\')">'+c+'</div>';
  });
  document.getElementById('filters-container').innerHTML = filtersHtml;

  if (CURRENT_FILTER !== 'all') {
    filteredHeats = filteredHeats.filter(h => h.catName === CURRENT_FILTER);
  }

  // Trier par WOD puis par numéro de heat
  filteredHeats.sort((a, b) => {
    var wA = (a.wodInfo||{}).nom || '';
    var wB = (b.wodInfo||{}).nom || '';
    if(wA !== wB) return wA.localeCompare(wB);
    return (parseInt(a.catHeatNum)||0) - (parseInt(b.catHeatNum)||0);
  });

  if (filteredHeats.length === 0) {
    content.innerHTML = '<div class="empty-state"><div class="empty-icon">📂</div><p>Aucun résultat disponible pour le moment.</p></div>';
    return;
  }

  var html = '';
  var currentWod = '';
  
  filteredHeats.forEach(h => {
    var wodNom = (h.wodInfo||{}).nom || 'WOD';
    if (wodNom !== currentWod) {
      if (currentWod !== '') html += '</div>';
      currentWod = wodNom;
      html += '<div class="section-title">' + escH(currentWod) + '</div>';
      html += '<div class="history-grid">';
    }

    var entries = [];
    var lanes = h.lanes || {};
    Object.keys(lanes).forEach(ln => {
      var lane = lanes[ln];
      if(!lane || !lane.teamName) return;
      var sc = (h.scores || {})[ln] || SCORES[h.id + '_' + ln] || {};
      entries.push({
        name: lane.teamName,
        score: getScoreDisplay(sc, h.wodInfo || {}),
        val: getScoreValue(sc, h.wodInfo || {})
      });
    });

    entries.sort((a, b) => b.val - a.val);

    html += '<div class="heat-card">' +
      '<div class="heat-header">' +
        '<div class="heat-info">' +
          '<div class="heat-num">HEAT ' + (h.catHeatNum || h.id.replace(/\D/g,'')) + '</div>' +
          '<div class="heat-cat">' + escH(h.catName || '') + '</div>' +
        '</div>' +
        '<div class="heat-status">TERMINÉ</div>' +
      '</div>' +
      '<div class="results-list">';
    
    entries.forEach((e, i) => {
      var rankCls = i === 0 ? 'p1' : i === 1 ? 'p2' : i === 2 ? 'p3' : '';
      html += '<div class="result-row">' +
        '<div class="res-rank ' + rankCls + '">' + (i + 1) + '</div>' +
        '<div class="res-name">' + escH(e.name) + '</div>' +
        '<div class="res-score">' + e.score + '</div>' +
      '</div>';
    });

    html += '</div></div>';
  });

  html += '</div>';
  content.innerHTML = html;
}

// Data loading — child_changed au lieu de on('value') pour éviter de re-télécharger
// tout Firebase à chaque modification
var _renderTm = null;
function scheduleRender(){ clearTimeout(_renderTm); _renderTm = setTimeout(render, 120); }

function indexScore(k, sc){
  if(!sc) return;
  SCORES[k] = sc;
  if(sc.heatNum != null && sc.laneNum != null) SCORES[sc.heatNum + '_' + sc.laneNum] = sc;
}

// ★ ÉCONOMIE DE DONNÉES (page consultée par QR sur BEAUCOUP de téléphones) :
//   On garde l'écoute incrémentale (les deltas sont petits : ~1 Ko par score, bien
//   moins qu'un rechargement complet du nœud heats qui pèse ~257 Ko). MAIS on COUPE
//   les écouteurs quand l'onglet passe en arrière-plan (téléphone en poche / en veille),
//   et on resynchronise au retour. Un QR laissé ouvert sans être regardé ne consomme
//   alors plus rien. Le bouton « Actualiser » force une resync à la demande.
var _histAttached = false;
function _histAttach(){
  if(_histAttached) return; _histAttached = true;
  db.ref('heats').on('child_changed', _hOnHeat);
  db.ref('heats').on('child_added',   _hOnHeatAdd);
  db.ref('heats').on('child_removed', _hOnHeatDel);
  db.ref('scores').on('child_changed', _hOnScore);
  db.ref('scores').on('child_added',   _hOnScoreAdd);
  db.ref('scores').on('child_removed', _hOnScoreDel);
}
function _histDetach(){
  if(!_histAttached) return; _histAttached = false;
  try{ db.ref('heats').off(); db.ref('scores').off(); }catch(e){}
}
function _hOnHeat(s){ HEATS[s.key]=s.val(); scheduleRender(); _histStamp(); }
function _hOnHeatAdd(s){ if(!HEATS[s.key]){ HEATS[s.key]=s.val(); scheduleRender(); } }
function _hOnHeatDel(s){ delete HEATS[s.key]; scheduleRender(); }
function _hOnScore(s){ indexScore(s.key, s.val()); scheduleRender(); _histStamp(); }
function _hOnScoreAdd(s){ if(!SCORES[s.key]){ indexScore(s.key, s.val()); scheduleRender(); } }
function _hOnScoreDel(s){ delete SCORES[s.key]; scheduleRender(); }
function _histStamp(){
  var stamp = document.getElementById('history-stamp');
  if(stamp){ try{ stamp.textContent = 'Màj ' + new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}); }catch(e){} }
}
/* ──────────────────────────────────────────────────────────────────────────
   ★★ CACHE VERSIONNÉ (calqué EXACTEMENT sur classement.html, lignes ~1576-1716).
   history.html n'affiche QUE les heats terminés → il n'a besoin que du nœud léger
   "classementLite" (heats allégés + scores + version "v"), PAS des gros nœuds
   "heats" (~257 Ko) et "scores". On lit D'ABORD "classementLite/v" seul (quelques
   octets) : si v == version en cache localStorage ET cache non-vide → on sert le
   cache (0 Ko sur le gros nœud). Sinon → on lit "classementLite" complet une fois,
   on l'applique, on réécrit le cache {v, lite}.
   FILETS (jamais d'écran vide) : "classementLite/v" absent, OU "classementLite"
   vide/absent, OU lecture en échec → repli sur l'ANCIEN comportement (_loadHistoryLegacy :
   lecture heats + scores complets + écoute incrémentale). Ne JAMAIS cacher un résultat vide.
   ────────────────────────────────────────────────────────────────────────── */
var _HIST_CACHE_KEY = 'boxcrew_history_cache_v1';
function _histReadCache(){
  try{ var raw = localStorage.getItem(_HIST_CACHE_KEY); return raw ? JSON.parse(raw) : null; }catch(e){ return null; }
}
function _histWriteCache(v, lite){
  // ★ NE JAMAIS cacher un résultat vide (sinon on resservirait du vide en boucle).
  if(!lite || !lite.heats || !Object.keys(lite.heats).length) return;
  try{ localStorage.setItem(_HIST_CACHE_KEY, JSON.stringify({v:v, lite:lite})); }catch(e){}
}
function _histCacheHasData(c){ return !!(c && c.lite && c.lite.heats && Object.keys(c.lite.heats).length>0); }

// ★★ Applique un objet "lite" (venu du gros nœud OU du cache) : remplit HEATS, ré-indexe
//    les scores embarqués (même indexScore que les listeners), rafraîchit l'affichage.
//    Ne ré-attache PAS les écouteurs des gros nœuds (économie de bande passante : la
//    resync passe par le version-check, comme sur classement.html).
function _applyHistLite(lite){
  _histDetach();                       // coupe toute écoute "heats/scores" résiduelle
  HEATS = lite.heats || {};
  SCORES = {};
  var sc = lite.scores || {};
  Object.keys(sc).forEach(function(k){ indexScore(k, sc[k]); });
  render();
  _histStamp();
}

// ★★ Lecture COMPLÈTE du nœud léger "classementLite" (une seule fois), puis réécriture
//    du cache. Repli sûr si le nœud léger est absent/vide (vieille compét, admin pas à
//    jour) → ancien comportement heats+scores.
function _loadHistFull(_v){
  var btn = document.getElementById('history-refresh');
  db.ref('classementLite').once('value').then(function(snap){
    var lite = snap.val();
    if(lite && lite.heats && Object.keys(lite.heats).length){
      _applyHistLite(lite);
      var v = (lite.v!=null) ? lite.v : _v;
      if(v!=null) _histWriteCache(v, {heats:lite.heats, scores:lite.scores||{}});
      if(btn){ btn.disabled = false; btn.textContent = '↻ Actualiser'; }
    } else {
      // Nœud léger absent/vide → repli complet (lecture heats + scores).
      _loadHistoryLegacy();
    }
  }).catch(function(){
    // ★ ANTI-PSCHITT : lecture du gros nœud échouée → on sert le cache s'il existe,
    //   sinon repli complet "heats+scores". Jamais figé.
    var c = _histReadCache();
    if(_histCacheHasData(c)){ _applyHistLite(c.lite); if(btn){ btn.disabled = false; btn.textContent = '↻ Actualiser'; } }
    else { _loadHistoryLegacy(); }
  });
}

// ★★ CHARGEMENT VERSIONNÉ (cache-aware). Lit d'abord SEULEMENT "classementLite/v"
//    (quelques octets). Si v == cache.v ET cache valide → sert le cache (0 Ko sur le
//    gros nœud). Sinon → lecture complète + réécriture cache. Filets partout → jamais vide.
function _loadHistVersioned(){
  var btn = document.getElementById('history-refresh');
  if(btn){ btn.disabled = true; btn.textContent = '⏳...'; }
  _histDetach();
  db.ref('classementLite/v').once('value').then(function(vs){
    var v = vs.val();
    var c = _histReadCache();
    if(v==null){
      // Pas de champ v (vieil admin) : on ne peut pas comparer → cache si dispo, sinon complet.
      if(_histCacheHasData(c)){ _applyHistLite(c.lite); if(btn){ btn.disabled = false; btn.textContent = '↻ Actualiser'; } }
      else { _loadHistFull(null); }
      return;
    }
    // Version inchangée ET cache valide → on sert le cache, PAS de gros nœud (0 Ko).
    if(_histCacheHasData(c) && String(c.v)===String(v)){
      _applyHistLite(c.lite);
      if(btn){ btn.disabled = false; btn.textContent = '↻ Actualiser'; }
      return;
    }
    // Version changée / pas de cache / cache vide → lecture complète + réécriture cache.
    _loadHistFull(v);
  }).catch(function(){
    // ★ Lecture de la version échouée (hors ligne au boot) : cache si dispo, sinon
    //   lecture complète (qui a ses propres filets, dont le repli heats+scores).
    var c = _histReadCache();
    if(_histCacheHasData(c)){ _applyHistLite(c.lite); if(btn){ btn.disabled = false; btn.textContent = '↻ Actualiser'; } }
    else { _loadHistFull(null); }
  });
}

// ★ FILET DE SÉCURITÉ (ancien comportement) : lecture COMPLÈTE heats + scores + écoute
//   incrémentale si la page est visible. Utilisé UNIQUEMENT quand le nœud léger
//   "classementLite" est indisponible (absent/vide/en échec).
function _loadHistoryLegacy(){
  var btn = document.getElementById('history-refresh');
  if(btn){ btn.disabled = true; btn.textContent = '⏳...'; }
  _histDetach();
  db.ref('heats').once('value').then(function(snap){
    HEATS = snap.val() || {};
    return db.ref('scores').once('value');
  }).then(function(snap){
    var raw = snap.val() || {};
    SCORES = {};
    Object.keys(raw).forEach(function(k){ indexScore(k, raw[k]); });
    render();
    _histStamp();
    if(!document.hidden) _histAttach();   // n'écouter que si l'onglet est visible
    if(btn){ btn.disabled = false; btn.textContent = '↻ Actualiser'; }
  }).catch(function(){
    // ★ ANTI-PSCHITT : même si la relecture échoue, on ré-attache les écouteurs si la
    //   page est visible (sinon l'historique resterait figé jusqu'à un tap manuel).
    if(!document.hidden) _histAttach();
    if(btn){ btn.disabled = false; btn.textContent = '↻ Réessayer'; }
  });
}

// ★ Point d'entrée public UNIQUE (bouton « Actualiser », chargement initial, resync).
//   Passe DÉSORMAIS par le chargement versionné → ne re-télécharge le gros nœud QUE si
//   la version a changé (sinon quelques octets + cache). Exposé en global pour le bouton.
function loadHistory(){ _loadHistVersioned(); }
window.loadHistory = loadHistory;

loadHistory();

// Couper l'écoute quand l'onglet est caché, resynchroniser (versionné) au retour.
document.addEventListener('visibilitychange', function(){
  if(document.hidden){ _histDetach(); }
  else { loadHistory(); }   // resync versionnée au retour (quelques octets si inchangé)
});

// ★ ANTI-PSCHITT : resynchroniser une fois à chaque reconnexion Firebase (page visible).
var _histWasConn = true;
try{
  db.ref('.info/connected').on('value', function(s){
    var up = s.val()===true;
    if(up && !_histWasConn && !document.hidden){ loadHistory(); }
    _histWasConn = up;
  });
}catch(e){}

</script>
</body>
</html>
