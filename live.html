  //   Bug : un inter-heat resté marqué actif=true dans Firebase masquait le For Time
  //   en cours (« le for time n'est plus affiché, ça switch sur l'interheat »).
  //   Si le heat courant tourne vraiment (status live + chrono démarré), on ignore l'IH.
  var _heatLiveEnCours = h && h.status==='live' && (h.startTimestamp>0 || (HEATS[hid]&&HEATS[hid].startTimestamp>0));
  if(ih&&ih.active&&ih.target>(now()-4000) && !_heatLiveEnCours){
    var k='ih:'+ih.target;if(_ivKey[z]===k)return;
    stopClock(z);_ivKey[z]=k;
    var coup=(ih.ihType||'')==='coupure';
    _iv[z]=setInterval(function(){
      var raw=Math.ceil((ih.target-now())/1000);
      if(raw>0){
        applyC(z,fmt(raw),coup?'coup':'ih',coup?'✂️ COUPURE':'⏳ INTER-HEAT','clr-ih');
      } else {
        applyC(z,'GO !','hot','🚀 DÉPART','clr-run');
        if(raw<=-1){setHold(z,'GO !','🚀 DÉPART','hot','clr-run',150);stopClock(z);IH[String(z)]={active:false};scheduleRender();}
      }
    },100);return;
  }
  if(applyHold(z)) return;
  if(!h){var k='none-'+z;if(_ivKey[z]===k)return;stopClock(z);_ivKey[z]=k;applyC(z,'--:--','idle','⌛ EN ATTENTE','');return;}
  var wantId=hid+'|'+h.status;
  if(h.status==='done'||h.status==='timecap'){
    if(_ivKey[z]===wantId)return;stopClock(z);_ivKey[z]=wantId;
    var cap=wodCapSec(w);
    var ts=h.startTimestamp||(HEATS[hid]&&HEATS[hid].startTimestamp)||0;
    var elapsed=ts>0?Math.max(0,Math.round((now()-ts)/1000)):cap||0;
    // Sur AMRAP (descendant), heat fini = temps écoulé → afficher 0:00 (cohérent avec la fin du chrono)
    // Sur fortime, afficher le temps écoulé jusqu'à la fin (= cap si timecap, ou temps réel sinon)
    var sf=(w.scoreType||w.scoreFinale||'').toLowerCase();
    var typ=String(w.wodFormat||w.type||'amrap').toLowerCase();
    var isFortime=typ==='fortime'||sf==='time';
    var displayVal;
    if(isFortime){
      displayVal=ts>0?fmt(Math.min(elapsed,cap||elapsed)):'--:--';
    } else {
      // AMRAP/Rounds : on était en descente vers 0 → rester à 0
      displayVal=cap>0?'0:00':(ts>0?fmt(elapsed):'--:--');
    }
    var isDone=h.status==='done';
    applyC(z,displayVal,isDone?'fin':'hot',isDone?'🏁 TERMINÉ':'🔴 TIMECAP',isDone?'clr-ok':'');
    return;
  }
  var frame=getLiveChronoFrame(z,hid,h,w);
  var ts=frame&&frame.ts?frame.ts:0;
  if(!ts){
    // ── Heat live sans timestamp (race Firebase) : polling auto-guérison ──
    if(h.status==='live'){
      var k='wait-ts-'+hid;
      if(_ivKey[z]===k)return; // polling déjà en cours
      stopClock(z);_ivKey[z]=k;
      // Garder l'affichage en cours (0:00 si rien) plutôt que flash "--:--"
      applyC(z,'0:00','run','⏱ CHRONO','clr-run');
      // Polling : refetcher le startTimestamp toutes les 250ms jusqu'à 10s
      var _wAttempts=0;
      _iv[z]=setInterval(function(){
        _wAttempts++;
        var ts2=(HEATS[hid]&&HEATS[hid].startTimestamp)||0;
        if(ts2>0){
          // Timestamp arrivé : démarrer direct le chrono sans rebuild DOM
          stopClock(z);
          _ivKey[z]=null;
          startClock(z,hid,HEATS[hid]||h,w);
        } else if(_wAttempts>=40){
          // 10s sans timestamp : refetch Firebase direct
          stopClock(z);_ivKey[z]=null;
          if(db) db.ref('heats/'+hid).once('value').then(function(snap){
            var fresh=snap.val();
            if(fresh&&fresh.startTimestamp){
              HEATS[hid]=Object.assign({},HEATS[hid]||{},fresh);
              startClock(z,hid,HEATS[hid],w);
            } else {
              applyC(z,'0:00','run','⏱ CHRONO','clr-run');
            }
          });
        }
      },250);
      return;
    }
    if(applyHold(z)) return;
    var k='nots-'+hid;
    if(_ivKey[z]===k)return;
    stopClock(z);_ivKey[z]=k;
    // Afficher le cap du WOD (temps prévu) plutôt que 0:00 — évite le flash
    var _capDisplay=w?fmt(wodCapSec(w)):'--:--';
    if(!_capDisplay||_capDisplay==='0:00') _capDisplay='--:--';
    applyC(z,_capDisplay,h.status==='pre'?'warn':'idle',h.status==='pre'?'🔔 PRÊT':'⌛ EN ATTENTE','');
    return;
  }
  if(_ivKey[z]===wantId){var _f2=getLiveChronoFrame(z,hid,h,w);if(_f2){applyC(z,_f2.value,_f2.vcls,_f2.lbl||null,_f2.bcls);}return;}stopClock(z);_ivKey[z]=wantId;
  applyC(z,null,null,h.status==='pre'?'🔔 PRÊT':'⏱ CHRONO','clr-run');
  var _last=-1;
  // Appliquer immédiatement (évite le flash "0:00" au rebuild DOM)
  (function(){var _f0=getLiveChronoFrame(z,hid,h,w);if(_f0)applyC(z,_f0.value,_f0.vcls,_f0.lbl||null,_f0.bcls);})();
  _iv[z]=setInterval(function(){
    // Utilise now() = Date.now()+serverOffset pour se synchroniser avec TK (qui écrit serverNow())
    var fresh=HEATS[hid]||h;
    var currentFrame=getLiveChronoFrame(z,hid,fresh,w);
    if(!currentFrame) return;
    if(currentFrame.elapsed===_last)return;_last=currentFrame.elapsed;
    applyC(z,currentFrame.value,currentFrame.vcls,currentFrame.lbl||null,currentFrame.bcls);
    if((fresh.status||'')==='timecap'){stopClock(z);}
  },100);
}

// ════ CLASSEMENT GÉNÉRAL ════
function getLeaders(){
  // Utiliser classement/ Firebase si disponible (pushé par index.html)
  if(CLASSEMENT&&Object.keys(CLASSEMENT).length){
    var leaders={};
    Object.keys(CLASSEMENT).forEach(function(catKey){
      var cat=CLASSEMENT[catKey];
      if(!cat||!cat.teams||!cat.teams.length) return;
      var top=cat.teams[0]; // déjà trié par rank
      // On a besoin du catId — on le retrouve depuis HEATS
      Object.keys(HEATS).forEach(function(hid){
        var h=HEATS[hid];
        if(!h) return;
        var cname=h.catName||h.catNom||'';
        var zoneNum=parseInt(h.catZone!=null?h.catZone:h.zone,10)||1;
        var ckey=(cname+'__z'+zoneNum).replace(/[^a-zA-Z0-9_-]/g,'_');
        if(ckey===catKey&&top&&top.name) leaders[String(h.catId||'')]=top.name;
      });
    });
    if(Object.keys(leaders).length) return leaders;
  }
  // Fallback : calcul local
  var pts={},p1={};
  var pts={},p1={};
  Object.keys(HEATS).forEach(function(hid){
    var h=HEATS[hid];if(!h||!h.catId||!(h.status==='done'||h.status==='timecap'))return;
    var cid=String(h.catId),w=h.wodInfo||{};
    var sf=(w.scoreType||w.scoreFinale||'').toLowerCase();
    var isT=(w.wodFormat||'').toLowerCase()==='fortime'||sf==='time';
    var grp=[];
    Object.keys(h.slots||h.lanes||{}).forEach(function(ln){
      var l=(h.slots||h.lanes)[ln];if(!l||!l.teamName)return;
      var sc=getSc(hid,h,ln);
      if(!(sc.judgeOk===true||sc.judgeOk===1||sc.judgeOk==='true'))return;
      grp.push({t:l.teamName,v:isT?(sc.finalTime>0?-sc.finalTime:0):parseInt(sc.reps)||0});
    });
    grp.sort(function(a,b){return b.v-a.v;});var pp=1;
    grp.forEach(function(e,i){
      if(i>0&&e.v!==grp[i-1].v)pp=i+1;
      if(!pts[cid])pts[cid]={};pts[cid][e.t]=(pts[cid][e.t]||0)+pp;
      if(pp===1){if(!p1[cid])p1[cid]={};p1[cid][e.t]=(p1[cid][e.t]||0)+1;}
    });
  });
  var leaders={};
  Object.keys(pts).forEach(function(cid){
    var arr=Object.keys(pts[cid]).map(function(t){return{t:t,p:pts[cid][t],p1:p1[cid]&&p1[cid][t]||0};});
    arr.sort(function(a,b){return a.p!==b.p?a.p-b.p:b.p1-a.p1;});
    if(arr.length)leaders[cid]=arr[0].t;
  });
  return leaders;
}


function adaptedQtyForMove(m,catId){
  if(!m)return 0;
  if(catId&&m.qtyParCat&&m.qtyParCat[catId]!=null&&m.qtyParCat[catId]!=='') return parseInt(m.qtyParCat[catId],10)||0;
  return parseInt(m.qty||m.ergoTarget||0,10)||0;
}
function getMoveLoad(m,catId){
  if(!m)return 0;

  if(catId&&m.poids&&typeof m.poids==='object') raw=m.poids[catId]||'';
  else if(typeof m.poids==='string'||typeof m.poids==='number') raw=m.poids;
  return parseFloat(String(raw).replace(',', '.'))||0;
}
function movementDifficulty(m,catId){
  if(!m)return 1;
  var name=String(m.nom||m.name||'').toLowerCase();
  var diff=1;
  [
    ['wall walk',0.16],['rope climb',0.18],['muscle up',0.20],['bar muscle',0.20],['ring muscle',0.22],
    ['handstand',0.17],['snatch',0.14],['clean',0.12],['thruster',0.14],['burpee',0.11],['devil press',0.18],
    ['box jump',0.08],['pistol',0.12],['toes to bar',0.11],['pull up',0.09],['double under',0.05],
    ['row',0.07],['ski',0.08],['bike',0.09],['run',0.06],['farmer',0.10],['lunge',0.08]
  ].forEach(function(pair){ if(name.indexOf(pair[0])!==-1) diff+=pair[1]; });
  var load=getMoveLoad(m,catId);
  if(load>=120)diff+=0.24; else if(load>=100)diff+=0.18; else if(load>=80)diff+=0.14; else if(load>=60)diff+=0.10; else if(load>=40)diff+=0.06;
  var qty=adaptedQtyForMove(m,catId);
  if(qty>=50)diff+=0.12; else if(qty>=35)diff+=0.08; else if(qty>=20)diff+=0.05; else if(qty>=10)diff+=0.02;
  return Math.min(2.2,Math.max(1,diff));
}
// ★ MOUVEMENT À PALIERS (rameur / ergo compté au clic).
//   Le juge tape N clics (facile), mais le PUBLIC doit lire les vrais MÈTRES.
//   Config chef : quota de clics = adaptedQtyForMove (adaptable par catégorie, déjà géré),
//   `pas` = mètres/clic — adaptable par catégorie via `pasParCat[catId]` (repli sur `pas`).
//   Un mouvement est "à paliers" dès que son pas (cat ou global) est >0.
//   Ex RX : 10 clics × 250 = 2500 m · Femmes : 10 clics × 225 = 2250 m (ou 9 clics).
function movePas(m,catId){
  if(!m) return 0;
  var pc=m.pasParCat&&catId!=null?m.pasParCat[catId]:null;
  var p=parseFloat(pc);
  if(!(p>0)) p=parseFloat(m.pas||m.step||m.metresParClic)||0; // repli global
  return p>0?p:0;
}
function movePasUnit(m){ return (m&&(m.pasUnit||m.ergoUnit))||'m'; }
// Total en mètres (quota de clics × pas). ex 10 clics × 250 = 2500m
function movePasTotal(m,q,catId){ var p=movePas(m,catId); return p>0?(q*p)+' '+movePasUnit(m):null; }
// Progression « fait/total » en mètres. ex 3 clics → « 750/2500 m »
function movePasProg(m,cr,q,catId){ var p=movePas(m,catId); if(p<=0)return null; return (cr*p)+'/'+(q*p)+' '+movePasUnit(m); }
function progressInfoForWod(w,sc,catId){
  var moves=(w&&w.mouvements)||[];
  var idx=parseInt((sc&&sc.curMoveIdx)||0,10)||0;
  var moveReps=parseInt((sc&&sc.moveReps)||0,10)||0;
  var total=0, doneBefore=0, currentQty=0, currentMove=null;
  moves.forEach(function(m,mi){
    var q=adaptedQtyForMove(m,catId);
    total+=q;
    if(mi<idx) doneBefore+=q;
    if(mi===idx){currentQty=q;currentMove=m;}
  });
  var liveRepsVal=parseInt((sc&&sc.reps)||0,10)||0;
  var done=Math.max(liveRepsVal,doneBefore+moveReps);
  if(total>0) done=Math.min(done,total);
  // Fallback : si pas de mouvements définis, utiliser reps bruts
  // L'ETA ne peut pas calculer un "total" mais peut quand même afficher une cadence
  if(total===0 && liveRepsVal>0){
    done=liveRepsVal;
    // Estimer total depuis capSec et cadence (pour AMRAP seulement)
    var isAmrap=(w&&(w.wodFormat||'').toLowerCase()==='amrap');
    if(!isAmrap) total=0; // ForTime sans mouvements : pas d'ETA possible
  }
  return {total:total,done:done,idx:idx,moveReps:moveReps,currentQty:currentQty,currentMove:currentMove,moves:moves};
}
function getEtaTrackKey(row,h){

function updateEtaMemory(row,h,prog,elapsed){
  var sc=row&&row.sc||{};
  var lane=(row&&row.ln)||'';
  var hid=(h&&h._id)||'';
  var key=hid+'_'+lane;
  if(!ETA_MEM[key]) ETA_MEM[key]={samples:[],lastMoveIdx:null,lastReps:0,lastTs:0,transitionPenalty:0};
  var mem=ETA_MEM[key];

  var idx=parseInt(prog.idx||0,10)||0;
  if(mem.lastMoveIdx!==null && idx!==mem.lastMoveIdx) mem.transitionPenalty=Math.min(12,(mem.transitionPenalty||0)+2.4);
  if(mem.lastTs && ts>mem.lastTs && reps<mem.lastReps){ mem.samples=[]; }
  if(!mem.samples.length || ts!==mem.lastTs || reps!==mem.lastReps || idx!==mem.lastMoveIdx){
    mem.samples.push({ts:ts,reps:reps,idx:idx,elapsed:elapsed});
    if(mem.samples.length>18) mem.samples=mem.samples.slice(-18);

  if(mem.transitionPenalty>0) mem.transitionPenalty=Math.max(0,mem.transitionPenalty-0.08);

function rateFromSamples(samples, seconds){

}
function clamp(n,min,max){ return Math.max(min,Math.min(max,n)); }
function fmtDelta(s){ return '±'+fmt(Math.max(0,Math.round(s||0))); }

// ── Régression linéaire sur les échantillons (reps = a*elapsed + b) ──
// Retourne {rate, r2} : taux instantané et coefficient de détermination (qualité du fit)
function linReg(samples){
  var n=samples.length;
  if(n<2) return {rate:0,r2:0};
  var sx=0,sy=0,sxy=0,sxx=0,syy=0;
  for(var i=0;i<n;i++){
    var x=samples[i].elapsed, y=samples[i].reps;
    sx+=x; sy+=y; sxy+=x*y; sxx+=x*x; syy+=y*y;
  }
  var denom=n*sxx-sx*sx;
  if(Math.abs(denom)<0.001) return {rate:0,r2:0};
  var a=(n*sxy-sx*sy)/denom; // pente = reps/sec
  // R² pour mesurer la qualité du fit
  var yMean=sy/n, ssTot=0, ssRes=0, b=(sy-a*sx)/n;
  for(var i=0;i<n;i++){
    var yHat=a*samples[i].elapsed+b;
    ssRes+=Math.pow(samples[i].reps-yHat,2);
    ssTot+=Math.pow(samples[i].reps-yMean,2);
  }
  var r2=ssTot>0?Math.max(0,1-ssRes/ssTot):0;
  return {rate:Math.max(0,a), r2:r2};
}

// Modèle de fatigue exponentielle (gardé pour compatibilité)
function fatigueAdjust(baseRate, elapsed, cap, diff, pctDone){
  if(cap<=0||baseRate<=0) return baseRate;
  var k=clamp(0.20 + (diff-1)*0.25, 0.15, 0.65);
  var tNorm=clamp(elapsed/cap, 0, 1);
  var tRem=clamp(1-tNorm, 0.01, 1);
  var integral=(Math.exp(-k*tNorm)-Math.exp(-k))/(k*tRem);
  var rateAtNow=baseRate*Math.exp(-k*tNorm);
  var rateMeanFuture=rateAtNow>0?rateAtNow*integral:baseRate*integral;
  return Math.max(0, rateMeanFuture);
}

// Taux normatif reps/sec par mouvement (CrossFit niveau intermédiaire)
var _MOV_NORMS = {
  'air squat':0.62,'squat':0.55,
  'push up':0.48,'push-up':0.48,
  'pull up':0.32,'pull-up':0.32,'chest-to-bar':0.25,'c2b':0.25,
  'kb swing':0.52,'kettlebell':0.48,
  'box jump':0.37,'box jump over':0.32,
  'burpee':0.22,'burpee over':0.18,'devil press':0.18,
  'wall ball':0.42,'thruster':0.26,
  'power snatch':0.22,'snatch':0.20,
  'power clean':0.25,'clean':0.23,'hang power clean':0.27,
  'deadlift':0.37,
  'toes to bar':0.32,'toes-to-bar':0.32,'t2b':0.32,
  'double under':1.30,'double-under':1.30,
  'wall walk':0.08,
  'bar muscle':0.18,'muscle up':0.15,'ring muscle':0.12,
  'handstand push':0.20,'hspu':0.20,
  'pistol':0.25,
  'row':0.55,'ski':0.55,'bike':0.65,'run':0.42,
  'back squat':0.30,'front squat':0.28,
  'farmer':0.45,'lunge':0.40,
  'sit up':0.55,'sit-up':0.55
};

function normRateForMove(m, catId){
  if(!m) return 0.35;
  var name = String(m.nom||m.name||'').toLowerCase();
  var rate = 0.35; // défaut
  Object.keys(_MOV_NORMS).forEach(function(k){
    if(name.indexOf(k) !== -1) rate = Math.max(rate, _MOV_NORMS[k]);
  });
  // Ajuster selon la charge
  var load = getMoveLoad ? getMoveLoad(m, catId) : 0;
  if(load >= 100) rate *= 0.62;
  else if(load >= 80) rate *= 0.72;
  else if(load >= 60) rate *= 0.82;
  else if(load >= 40) rate *= 0.91;
  return rate;
}

// Construire un tableau de taux par mouvement (norme + mesures réelles)
function buildMovRates(moves, mem, sc, catId){
  var rates = {};
  if(!moves||!moves.length) return rates;
  // Initialiser avec les normes
  moves.forEach(function(m, mi){ rates[mi] = normRateForMove(m, catId); });
  // Affiner avec les échantillons réels
  var samples = mem.samples||[];
  if(samples.length < 2) return rates;
  for(var i=1; i<samples.length; i++){
    var s0=samples[i-1], s1=samples[i];
    var dt=(s1.ts-s0.ts)/1000;
    var dr=s1.reps-s0.reps;
    var idx=s0.idx;
    if(dt>0.3 && dr>=0 && idx < moves.length){
      var measured = dr/dt;
      // Poids de la mesure réelle : augmente avec le nombre d'échantillons
      var w = clamp(0.15 + (i/samples.length)*0.65, 0.15, 0.85);
      rates[idx] = rates[idx]*(1-w) + measured*w;
    }
  }
  return rates;
}

// Simulation du temps restant en projetant mouvement par mouvement
function simulateAmrap(moves, curMoveIdx, curMoveReps, movRates, timeLeft, cap, elapsed, catId){
  if(timeLeft<=0 || !moves||!moves.length) return 0;
  var projReps=0;
  var t=0;
  var mi=curMoveIdx;
  var miReps=curMoveReps;
  var tNorm=elapsed/Math.max(1,cap);
  var maxIter=500; // sécurité
  var iter=0;
  while(t < timeLeft && iter < maxIter){
    iter++;
    var mIdx=mi % moves.length;
    var move=moves[mIdx];
    if(!move){ mi++; continue; }
    var qty=adaptedQtyForMove(move,catId);
    if(qty<=0){ mi++; miReps=0; continue; }
    // Taux de base pour ce mouvement
    var baseR = movRates[mIdx] || normRateForMove(move,catId);
    // Fatigue exponentielle globale
    var k=0.28;
    var fatigue=Math.exp(-k*(tNorm + t/Math.max(1,cap)));
    var rate = baseR * fatigue;
    if(rate <= 0.01) break;
    var repsLeft = qty - miReps;
    if(repsLeft <= 0){ mi++; miReps=0; continue; }
    var timeNeeded = repsLeft/rate;
    if(t + timeNeeded > timeLeft){
      // Temps écoulé pendant ce mouvement partiel
      projReps += Math.floor((timeLeft-t)*rate);
      t=timeLeft;
    } else {
      projReps += repsLeft;
      t += timeNeeded;
      mi++;
      miReps=0;
    }
  }
  return projReps;
}

// Simulation ForTime : estimer le temps de fin
function simulateForTime(moves, curMoveIdx, curMoveReps, movRates, cap, elapsed, catId){
  var t=0;
  var mi=curMoveIdx;
  var miReps=curMoveReps;
  var tNorm=elapsed/Math.max(1,cap);
  var maxIter=500;
  var iter=0;
  while(iter < maxIter){
    iter++;
    if(mi >= moves.length) break; // fini !
    var move=moves[mi];
    if(!move){ mi++; continue; }
    var qty=adaptedQtyForMove(move,catId);
    if(qty<=0){ mi++; miReps=0; continue; }
    var baseR=movRates[mi] || normRateForMove(move,catId);
    var k=0.22;
    var fatigue=Math.exp(-k*(tNorm + t/Math.max(1,cap)));
    var rate=baseR*fatigue;
    if(rate<=0.01) return cap+60; // cap dépassé
    var repsLeft=qty-miReps;
    if(repsLeft<=0){ mi++; miReps=0; continue; }
    t += repsLeft/rate;
    mi++;
    miReps=0;
  }
  return elapsed + t;
}

function etaInfoForRow(row,w,h,catId){
  var sc=row&&row.sc||{};
  if(!h||h.status!=='live'||!h.startTimestamp||sc.judgeOk) return null;
  var fmtName=String((w.wodFormat||w.type||'').toLowerCase());
  var sf=String((w.scoreType||w.scoreFinale||'').toLowerCase());
  var jm=String((w.judgeMode||'').toLowerCase());
  var isFortime=fmtName==='fortime'||sf==='time'||(w.scoreFields&&w.scoreFields.indexOf&&w.scoreFields.indexOf('time')>=0)||(w.type&&w.type.toLowerCase()==='fortime');
  var isMaxload=fmtName==='maxload'||jm==='maxload'||sf==='load';
  var isErgo=fmtName==='ergo'||jm==='ergo'||sf==='dist';
  var isRounds=fmtName==='rounds'||(fmtName===''&&parseInt(w.rounds||1)>1);
  if(isMaxload) return {text:'LOAD LIVE',cls:'eta'};

  var elapsed=Math.max(1,Math.round((now()-h.startTimestamp)/1000));
  var cap=wodCapSec(w);
  var timeLeft=Math.max(0,cap-elapsed);
  var moves=(w&&w.mouvements)||[];
  var totalReps=parseInt(sc.reps||0,10)||0;
  var curMoveIdx=parseInt(sc.curMoveIdx||0,10)||0;
  var curMoveReps=parseInt(sc.moveReps||0,10)||0;

  var prog=progressInfoForWod(w,sc,catId);
  var mem=updateEtaMemory(row,h,prog,elapsed);
  var movRates=buildMovRates(moves,mem,sc,catId);
  var diff=movementDifficulty(prog.currentMove,catId);

  // ── ERGO ──
  if(isErgo){
    var dist=parseFloat(sc.dist||sc.distance||sc.ergoVal||sc.reps||0)||0;
    if(elapsed<3||dist<=0) return null;
    var ergoRate=dist/elapsed;
    var adjErgo=fatigueAdjust(ergoRate,elapsed,cap,diff,0);
    var proj=cap>0?Math.round(dist+adjErgo*timeLeft):Math.round(dist);
    return {text:'PROJ '+proj+(w.scoreFinaleUnit||' m'),cls:(cap>0&&elapsed/cap>0.8)?'eta warn':'eta'};
  }

  // ── FOR TIME ──
  if(isFortime){
    var totalUnits=prog.total||0;
    var doneUnits=prog.done||0;
    if(totalUnits<=0) return null;
    // Dès la 1ère rep : simulation
    var etaSec;
    if(doneUnits<=0){
      // Pas encore de reps : estimer depuis norme globale
      var normRate=moves.length>0?moves.reduce(function(s,m){return s+normRateForMove(m,catId)*adaptedQtyForMove(m,catId);},0)/Math.max(1,moves.reduce(function(s,m){return s+adaptedQtyForMove(m,catId);},0)):0.35;
      etaSec=normRate>0?elapsed+Math.round(totalUnits/normRate):cap;
    } else {
      etaSec=elapsed+Math.round(simulateForTime(moves,curMoveIdx,curMoveReps,movRates,cap,elapsed,catId)-elapsed);
      etaSec=Math.max(elapsed+1,etaSec);
    }
    if(cap>0){
      var margin=cap-etaSec;
      var cls=margin>=20?'eta ok':margin>=0?'eta warn':'eta err';
      var text=margin>=0?'FIN ~'+fmt(etaSec):'TC +'+fmt(Math.abs(margin));
      return {text:text,cls:cls};
    }
    return {text:'ETA '+fmt(etaSec),cls:'eta'};
  }

  // ── AMRAP / ROUNDS ──
  if(cap>0){
    // Dès la 1ère rep
    var projReps;
    if(totalReps<=0){
      // Pas encore de reps : estimer depuis norme pure
      if(moves.length>0){
        projReps=Math.round(simulateAmrap(moves,0,0,movRates,cap,0,cap,catId));
      } else {
        return null;
      }
      return {text:'~'+projReps+' max',cls:'eta'};
    }
    // Simulation depuis position actuelle
    var simProj=simulateAmrap(moves,curMoveIdx,curMoveReps,movRates,timeLeft,cap,elapsed,catId);
    projReps=totalReps+simProj;
    if(projReps<=0) return null;
    // Confiance basée sur le nb de samples
    var nSamples=mem.samples.length;
    var rateMin=(totalReps/elapsed)*60;
    if(nSamples<3){
      // Peu de données : afficher rythme actuel + projection norme
      return {text:rateMin.toFixed(1)+'/min · ~'+projReps,cls:'eta'};
    }
    // Données suffisantes : projection précise
    var err=Math.max(1,Math.round((1-Math.min(0.9,0.5+nSamples*0.05))*projReps*0.06));
    return {text:'~'+projReps+' reps',cls:'eta'};
  }

  // Pas de cap : afficher rythme
  if(totalReps>0){
    var rm=(totalReps/elapsed)*60;
    return {text:rm.toFixed(1)+'/min',cls:'eta'};
  }
  return null;
}

function compareScores(a,b,w){
  // ★ DEATH BY (classement dynamique) : équipes encore EN COURSE en haut, HORS COURSE
  //   en BAS — PRIORITAIRE sur TOUT, y compris le statut « validé ». (Bug chef : une
  //   équipe hors course est marquée validée/ok, et le tri « validé en haut » ci-dessous
  //   la faisait remonter tout en haut. On tranche donc AVANT.)
  if(String((w&&w.wodFormat)||'').toLowerCase()==='deathby'){
    var _aOut=!!(a.sc&&a.sc.dbOut), _bOut=!!(b.sc&&b.sc.dbOut);
    if(_aOut!==_bOut) return _aOut?1:-1;
    // ★ DEATH BY (demande chef) : classement UNIQUEMENT sur le NOMBRE DE REPS total.
    //   Plus de reps = devant. À égalité, l'ordre de lane départage (stable). On tranche
    //   ICI (return) pour ne PAS retomber sur le tri par charge (scoreType=load).
    var _adr=parseInt((a.sc&&a.sc.reps)||0,10)||0;
    var _bdr=parseInt((b.sc&&b.sc.reps)||0,10)||0;
    if(_bdr!==_adr) return _bdr-_adr;
    var _adl=parseInt(String(a.ln).replace(/\D/g,''))||0;
    var _bdl=parseInt(String(b.ln).replace(/\D/g,''))||0;
    return _adl-_bdl;
  }
  // ★ SKI+SNATCH : PLUS de mise « hors course ». Une équipe qui ne boucle pas ses
  //   7 snatch n'est PAS éliminée (demande chef) — elle continue les tours, elle marque
  //   juste 0 en distance sur CE tour (géré côté juge : distance annulée). Le classement
  //   se fait donc uniquement sur la distance cumulée, comme n'importe quel WOD ergo.
  //   (Le flag ssOut n'est plus posé nulle part ; ce bloc de tri est retiré.)
  // ★ CLEAN LADDER v2 (classement) : EN COURSE en HAUT, ÉLIMINÉS en BAS (demande chef),
  //   puis au sein de chaque groupe : le PLUS LOURD devant (cumul kg = load).
  //   Départage stable pour éviter que les ex æquo « sautent » pendant que ça avance :
  //   1) en course avant éliminé · 2) cumul kg décroissant ·
  //   3) entre deux en course à cumul égal, le PLUS AVANCÉ (station puis barres vertes).
  if(String((w&&w.wodFormat)||'').toLowerCase()==='cleanladder'){
    var _aElim=!!(a.sc&&a.sc.clOut), _bElim=!!(b.sc&&b.sc.clOut);
    if(_aElim!==_bElim) return _aElim?1:-1; // 1) en course avant éliminé (éliminé tout en bas)
    var _akg2=parseFloat((a.sc&&(a.sc.clLoad!=null?a.sc.clLoad:a.sc.load))||0)||0;
    var _bkg2=parseFloat((b.sc&&(b.sc.clLoad!=null?b.sc.clLoad:b.sc.load))||0)||0;
    if(_bkg2!==_akg2) return _bkg2-_akg2; // 2) plus lourd devant
    if(!_aElim && !_bElim){
      // 3) avancement : station courante, puis barres vertes sur la station en cours
      // ★ DÉPARTAGE (règle chef) : à cumul kg ÉGAL → nombre TOTAL de barres validées
      //   (toutes stations confondues). Plus de barres vertes = devant.
      function _clProg(sc){
        var bc=sc&&sc.barresCL; if(!bc) return 0;
        var g=0;
        for(var k in bc){ var o=bc[k]; var arr=o&&o.barres; if(arr){ for(var i=0;i<arr.length;i++) if(arr[i]===1) g++; } }
        return g;
      }
      var _ap=_clProg(a.sc), _bp=_clProg(b.sc);
      if(_bp!==_ap) return _bp-_ap;
    }
    // 4) deux éliminés à cumul égal (ou tout égal) → égalité, on laisse passer au tri suivant
  }
  if(a.ok&&!b.ok)return -1;
  if(!a.ok&&b.ok)return 1;
  var av=scoreVal(a.sc,w),bv=scoreVal(b.sc,w);
  if(bv!==av) return bv-av;
  // ★ CLASSEMENT DYNAMIQUE dès la 1re rep (demande chef) : tant que PERSONNE n'a validé
  //   (course en cours), à score ÉGAL on départage par la PROGRESSION en direct (reps faites),
  //   pour que la ligne bouge sur TOUS les formats (for time, amrap, rounds…). Le for time
  //   renvoie déjà les reps via scoreVal pendant la course ; ce filet couvre les égalités.
  //   EXCLU de l'EMOM ski+snatch : là c'est la DISTANCE qui classe, jamais le nb de snatch.
  if(!a.ok && !b.ok && String((w&&w.wodFormat)||'').toLowerCase()!=='emom'){
    var _lrA=liveReps(a.sc), _lrB=liveReps(b.sc);
    if(_lrB!==_lrA) return _lrB-_lrA;
  }
  // ★ CLASSEMENT DYNAMIQUE SUR LE MOUVEMENT (demande chef) : sur un WOD scoré en
  //   distance/cals, à distance ÉGALE, l'équipe qui a fait PLUS de reps du mouvement
  //   (ex : snatch) passe devant. Ainsi pendant le round — avant que la distance du
  //   tour soit saisie — c'est le nombre de snatch qui départage, et le classement
  //   bouge à chaque rep. 1 snatch d'avance = devant.
  var _cjm=((w&&w.judgeMode)||'').toLowerCase();
  var _csf=((w&&(w.scoreType||w.scoreFinale))||'').toLowerCase();
  var _cfmt=String((w&&w.wodFormat)||'').toLowerCase();
  // ★ Départage par reps À DISTANCE ÉGALE : réservé aux WOD ergo CUMULÉS où les reps
  //   s'accumulent (AMRAP Steph : shuttle/SU avant le bike) → le live bouge dès la 1re rep.
  //   EXCLU du ski+snatch (EMOM) : là le snatch n'est qu'un « gate » par tour (7 max),
  //   le classement se fait UNIQUEMENT à la distance (demande chef : « pas le nb de snatch »).
  if((_cjm==='ergo'||_csf==='dist'||_csf==='cal') && _cfmt!=='emom'){
    var _ar=a.ok ? (parseInt((a.sc&&a.sc.reps)||0,10)||0) : (parseInt((a.sc&&(a.sc.roundReps!=null?a.sc.roundReps:a.sc.reps))||0,10)||0);
    var _br=b.ok ? (parseInt((b.sc&&b.sc.reps)||0,10)||0) : (parseInt((b.sc&&(b.sc.roundReps!=null?b.sc.roundReps:b.sc.reps))||0,10)||0);
    if(_br!==_ar) return _br-_ar;
  }
  // ★ Multi-TB : comparer chaque TB dans l'ordre (plus petit = plus rapide = meilleur)
  var aTbs=tbArr(a.sc), bTbs=tbArr(b.sc);
  var maxLen=Math.max(aTbs.length,bTbs.length);
  for(var ti=0;ti<maxLen;ti++){
    var at=aTbs[ti]||0, bt=bTbs[ti]||0;
    if(at>0&&bt>0&&at!==bt) return at-bt; // plus petit = plus rapide = devant
    if(at>0&&bt===0) return -1; // a a un TB, b n'en a pas → a devant
    if(at===0&&bt>0) return 1;
  }
  // Tri stable par lane en dernier recours
  var al=parseInt(String(a.ln).replace(/\D/g,''))||0;
  var bl=parseInt(String(b.ln).replace(/\D/g,''))||0;
  return al-bl;
}
function rankHeatEntries(hid,h,w){
  var lanes=h.slots||h.lanes||{},rows=[];
  Object.keys(lanes).forEach(function(ln){
    var l=lanes[ln];
    var team=l&&(l.teamName||l.team);
    if(!team)return;
    var sc=getSc(hid,h,ln)||{};
    rows.push({ln:ln,team:team,sc:sc,ok:!!sc.judgeOk,
      isGuest:!!l.isGuest,
      guestCatName:l.teamCatName||'',
      guestCatColor:l.teamCatColor||'#888'
    });
  });
  rows.sort(function(a,b){return compareScores(a,b,w);});
  // ★ Regroupement par catégorie : équipes de la catégorie du heat d'abord,
  //   puis les invités regroupés par leur catégorie d'origine. Tri par score DANS chaque groupe.
  var hostCat=(h&&(h.catName||h.catNom))||'';
  function grpKey(r){ return (r.isGuest && r.guestCatName) ? r.guestCatName : hostCat; }
  var groups={}, order=[];
  rows.forEach(function(r){
    var k=grpKey(r);
    if(!groups[k]){ groups[k]=[]; order.push(k); }
    groups[k].push(r);
  });
  // la catégorie hôte toujours en premier, les invités ensuite (ordre d'apparition)
  order.sort(function(a,b){ if(a===hostCat)return -1; if(b===hostCat)return 1; return 0; });
  var out=[];
  order.forEach(function(k){
    groups[k].forEach(function(r,idx){
      r._catGroup=k;
      r._catColor=(r.isGuest && r.guestCatColor)?r.guestCatColor:(rows._hostColor||'');
      r._groupFirst=(idx===0);
      r._isGuestGroup=(k!==hostCat);
      out.push(r);
    });
  });
  out._hasGroups=(order.length>1); // séparateurs seulement s'il y a plusieurs catégories
  return out;
}
function rankWodEntries(zone,h,w){
  var catId=String(h.catId||''),wodName=String((w&&w.nom)||'');
  var rows=[];
  Object.keys(HEATS).forEach(function(hid){
    var hx=HEATS[hid];

function gapText(row,lead,w,st){

  var jm=(w.judgeMode||'').toLowerCase();

        var _dbM0=(w.mouvements&&w.mouvements[0])||(w.toursPerso&&w.toursPerso[0]&&w.toursPerso[0].mouvements&&w.toursPerso[0].mouvements[0])||null;
        _dbStart=(_dbM0&&(parseInt(_dbM0.qty,10)||parseInt(_dbM0.q,10)))||1;
      }
      var _dbInc=parseInt(w.dbIncPerRound||0,10)||0;
      var _dbObj=_dbStart+_dbInc*(_dbCurL-1); if(_dbObj<1)_dbObj=1;
      var _dbDone=parseInt((sc&&sc.roundReps)||0,10)||0;
      s=_dbDone+'/'+_dbObj+' REP';
    }
    // ★ CLEAN LADDER v2 : le score = cumul kg, EN BOUT DE LIGNE UNIQUEMENT LES KG
    //   (demande chef). Plus de « · St. Y/Z » : la station est déjà visible dans les barres,
    //   et le n° de tour est à côté du chrono principal.
    if(w && String(w.wodFormat||'').toLowerCase()==='cleanladder'){
      var _cumul=(sc&&(sc.clLoad!=null?sc.clLoad:(sc.load||0)))||0;
      var _bc=(sc&&sc.barresCL)||null;
      if(sc&&sc.clOut){
        s='🛑 '+_cumul+' kg';
      } else if(_bc && _bc.bonusOpen){
        s='🏆 '+_cumul+' kg';
      } else if(!val){
        s='💪 '+_cumul+' kg';
      } else {
        s='🏆 '+_cumul+' kg';
      }
      // ★ ROULANT (live) : une équipe pas encore entrée reste CACHÉE, et n'apparaît que
      //   ~30 s avant son top d'entrée, avec un décompte. Lecture seule sur le chrono.
      //   clRolling peut manquer dans le wodInfo figé du heat → secours via WD[id].
      var _wRoll=!!(w && (w.clRolling || (w.id && typeof WD!=='undefined' && WD[w.id] && WD[w.id].clRolling)));
      if(_wRoll && !(sc&&sc.clOut)){
        var _ivR=(parseInt(w.workMin||0,10)||0)+(parseInt(w.restMin||0,10)||0); if(_ivR<1)_ivR=90;
        var _elR=(h&&h.startTimestamp)?Math.max(0,Math.floor((now()-h.startTimestamp)/1000)):0;
        var _entR=parseInt(String(e.ln).replace(/\D/g,''),10)||1;
        var _untilR=((_entR-1)*_ivR)-_elR;             // secondes avant l'entrée de l'équipe
        if(_untilR>20){ return ''; }                    // trop tôt → cachée (apparaît 20 s avant)
        // ★ DÉCOMPTE DE DÉPART pour le speaker — PALIERS 20/15/10/5/GO (pas seconde par
        //   seconde → aucune saccade, lisible au rétro, cadence d'annonce parfaite).
        //   À GO l'équipe entre sur son top et bascule sur son suivi normal (cumul kg).
        if(_untilR>0){
          var _pal = _untilR>15 ? 20 : _untilR>10 ? 15 : _untilR>5 ? 10 : 5;
          s = '⏱️ ENTRE DANS '+_pal;
        } else if(_untilR> -1){
          s = '🟢 GO !';                                 // GO bref (~1 s) puis bascule direct sur le cumul kg
        }
      }
    }
    var repLead=liveReps(lead.sc),repMe=liveReps(sc);
    // Badge gap : LEADER pour le 1er, écart pour les autres
    var repDiff=repLead-repMe;
    var repGap='',gapCls='lead';
    if(i===0){
      // ★ LEADER : afficher SON SCORE CHIFFRÉ en bout de ligne (demande chef) — le NOMBRE
      //   de reps / cals / kg / distance selon le WOD, JAMAIS le mot « LEADER ». Pour tous
      //   les WODs et tous les heats. Si score à 0, on n'affiche rien (pas de mot parasite).
      var _sfL=(w.scoreType||w.scoreFinale||'').toLowerCase(), _jmL=(w.judgeMode||'').toLowerCase();
      if(_sfL==='dist'){
        var _ld=parseFloat((lead.sc&&(lead.sc.dist||lead.sc.distance||lead.sc.ergoVal))||0)||0;
        var _duL='m';
        try{
          var _mvsL=(w.mouvements||[]);
          var _dmL=_mvsL.filter(function(mm){return mm && !mm.ergoFree && mm.ergoUnit;})[0]
                 || _mvsL.filter(function(mm){return mm && mm.ergoUnit && String(mm.ergoUnit).toLowerCase()!=='cal';})[0];
          if(_dmL && _dmL.ergoUnit) _duL=_dmL.ergoUnit;
        }catch(e){}
        repGap=_ld>0?(_ld+' '+String(_duL).toUpperCase()):'';
      } else if(_sfL==='cal'){
        var _lc=parseFloat((lead.sc&&(lead.sc.dist||lead.sc.ergoVal||lead.sc.distance))||0)||0;
        repGap=_lc>0?(_lc+' CAL'):'';
      } else if(_jmL==='maxload'||_sfL==='load'){
        var _lkg=parseFloat((lead.sc&&(lead.sc.clLoad!=null?lead.sc.clLoad:lead.sc.load))||0)||0;
        repGap=_lkg>0?(_lkg+' KG'):'';
      } else if((w.wodFormat||'').toLowerCase()==='fortime'||_sfL==='time'){
        var _lt=(lead.sc&&lead.sc.finalTime)||0;
        repGap=_lt>0?fmt(_lt):'';
      } else {
        var _lr=liveReps(lead.sc)||0;
        repGap=_lr>0?(_lr+' REPS'):'';
      }
      gapCls='lead';
    } else {
      // Calculer le delta avec scoreVal (scores validés ou live)
      var leadVal = lead.ok ? scoreVal(lead.sc,w) : repLead;
      var meVal   = e.ok   ? scoreVal(e.sc,w)    : repMe;
      var isFortime=(w.wodFormat||'').toLowerCase()==='fortime'||(w.scoreType||w.scoreFinale||'').toLowerCase()==='time';
      var isLoad  =(w.judgeMode||'').toLowerCase()==='maxload'||(w.scoreType||w.scoreFinale||'').toLowerCase()==='load';
      var isErgo  =(w.judgeMode||'').toLowerCase()==='ergo'||(w.scoreType||w.scoreFinale||'').toLowerCase()==='dist'||(w.scoreType||w.scoreFinale||'').toLowerCase()==='cal';
      if(isFortime){
        // ForTime : valeur négative (plus petit = plus rapide) — delta = moi - leader (positif = plus lent)
        var tDiff = meVal - leadVal; // si meVal plus négatif = plus rapide = devant
        if(leadVal===0&&meVal===0){ repGap=''; }
        else if(tDiff===0){ repGap='='; gapCls='lead'; }
        else if(tDiff<0){ repGap='+'+fmt(Math.abs(tDiff))+' av.'; gapCls='lead'; }
        else { repGap='+ '+fmt(tDiff); gapCls='gap'; }
      } else if(isLoad){
        var lDiff=leadVal-meVal;
        if(lDiff<=0){ repGap=leadVal>0?'=':''; gapCls='lead'; }
        else { repGap='- '+lDiff+' kg'; gapCls='gap'; }
      } else if(isErgo){
        // ★ Écart en DISTANCE en direct (dist/ergoVal), pas en reps.
        var _lgv=parseFloat((lead.sc&&(lead.sc.dist||lead.sc.ergoVal||lead.sc.distance))||0)||0;
        var _mgv=parseFloat((sc.dist||sc.ergoVal||sc.distance))||0;
        var eDiff=_lgv-_mgv;
        var _egu=((w.scoreType||w.scoreFinale||'').toLowerCase()==='cal')?'cal':'m';
        var _fmtErg=(w.wodFormat||'').toLowerCase();
        if(eDiff>0){
          // ★ Retard sur le 1er = UNIQUEMENT la métrique (cal/m). Plus de « - X snatch »
          //   (demande chef : « juste le nombre de cal/mètre de retard, pas le nb de snatch »).
          repGap='- '+Math.round(eDiff)+' '+_egu; gapCls='gap';
        } else {
          // ★ Égalité de distance :
          //   - AMRAP ergo cumulé (shuttle/SU avant le bike) → départage par reps EN DIRECT
          //     pour que la ligne bouge dès la 1re rep, avant même le bike.
          //   - Ski+snatch (EMOM) → distance SEULE, jamais de reps affichées.
          if(_fmtErg!=='emom'){
            var _lr=parseInt((lead.sc&&(lead.sc.ok?lead.sc.reps:lead.sc.roundReps))||0,10)||0;
            var _mr=parseInt((sc.ok?sc.reps:sc.roundReps)||0,10)||0;
            var _rd=_lr-_mr;
            if(_rd>0){ repGap='- '+_rd+' rep'+(_rd>1?'s':''); gapCls='gap'; }
            else { repGap=(_lgv>0||_lr>0)?'=':''; gapCls='lead'; }
          } else {
            repGap=_lgv>0?'=':''; gapCls='lead';
          }
        }
      } else {
        // AMRAP / reps
        var rDiff=leadVal-meVal;
        if(rDiff<=0){ repGap=leadVal>0?'=':''; gapCls='lead'; }
        else { repGap='- '+rDiff+' rep'+(rDiff>1?'s':''); gapCls='gap'; }
      }
    }
    var eta=etaInfoForRow(e,w,h,catId);
    var ci=parseInt(sc.curMoveIdx)||0,cr=parseInt(sc.moveReps)||0;
    var chipsHtml='';
    // ★ CLEAN LADDER v2 : barres visuelles (station en cours ⏳/✅/❌) + pastilles de progression.
    if(String(w.wodFormat||'').toLowerCase()==='cleanladder' && sc && sc.barresCL){
      chipsHtml=cl2LiveBars(sc.barresCL, sc.clOut, val);
    } else
    if(showLiveChips&&st==='live'&&!val&&(w.mouvements||[]).length&&String(w.wodFormat||'').toLowerCase()!=='cleanladder'&&String(w.wodFormat||'').toLowerCase()!=='deathby'){
      chipsHtml='<div class="chips">'+(w.mouvements||[]).map(function(m,mi){
        var q=adaptedQtyForMove(m,catId);
        // ★ BIKE / ERGO À CIBLE FIXE (bug chef WOD 6 : « affiche 10 au lieu de 22 ») : un
        //   mouvement ergo non-libre a une CIBLE dans ergoTarget (ex 22 cal), pas dans qty
        //   (qty=10 traînait). On affiche et on compte vers la cible + l'unité.
        var _isErgoTgt=(m.type==='ergo')&&!m.ergoFree&&(parseInt(m.ergoTarget,10)||0)>0;
        if(_isErgoTgt) q=parseInt(m.ergoTarget,10)||q;
        // ★ Mouvement à paliers (rameur) : le chip montre les MÈTRES réels, pas les clics.
        var _pasTot=movePasTotal(m,q,catId);
        var _qLabel=_pasTot?(' '+_pasTot):(m.ergoFree?' MAX':(_isErgoTgt?(' '+q+(m.ergoUnit?' '+m.ergoUnit:'')):(q?' ×'+q:'')));
        var cl='chip',lb=esc(m.nom||'')+_qLabel;
      if(m.tour>0&&(mi===0||((w.mouvements||[])[mi-1]||{}).tour!==m.tour)) lb='T'+m.tour+'· '+lb;
        var _pasP=movePasProg(m,cr||0,q,catId);
        // ★ PASTILLE VERTE (demande chef) : un mouvement compté qui atteint sa cible passe au
        //   VERT (✓), même s'il est encore le mouvement « actif ». Ex : snatch 7/7, worm fait,
        //   bike 22/22. Les mouvements MAX (ergoFree, sans cible) restent en cours tant qu'on rame.
        var _complet=(!m.ergoFree && q>0 && (cr||0)>=q);
        if(mi<ci){cl+=' d';lb='✓ '+lb;}
        else if(mi===ci && _complet){cl+=' d';lb='✓ '+lb;}
        else if(mi===ci){cl+=' a';lb='▶ '+lb+(_pasP?' ('+_pasP+')':((!m.ergoFree&&q>0)?' ('+(cr||0)+'/'+q+')':''));}
        return '<span class="'+cl+'">'+lb+'</span>';
      }).join('')+'</div>';
    }
    var isCatLeader=catLeader&&e.team&&e.team===catLeader;
    // ── Carte public : propre et lisible ──
    // LIGNE 1 : rang | nom d'équipe          | score (reps en cours) à droite
    // LIGNE 2 :       | badge gap/leader+ETA  |
    // LIGNE 3 :       | chips mouvements       |
    // ★ Plus de badge texte « LEADER » : le 1er est déjà clairement marqué par le cadre
    //   vert (.tc.lead) + sa bordure. Évite le doublon cadre vert + « LEADER » + couronne.
    var gapBadge='';
    // ★ ETA supprimé de l'affichage
    // ★ Médailles UNIQUEMENT quand le heat est terminé (classement figé).
    //   Pendant live/pre/timecap : classement dynamique → on garde un chiffre lisible.
    var _isFinal = (st==='done');
    var _rkBadge = _isFinal ? (MEDALS[i]||String(i+1)) : String(i+1);
    return _catSep+'<div class="tc'+(i<3?' r'+(i+1):'')+(val?' ok':'')+(i===0?' lead':'')+'">'
      +'<div class="tm">'
        +'<div class="rk'+(i<3?' r'+(i+1):'')+(_isFinal?' final':' dyn')+'">'+_rkBadge+'</div>'
        +'<div class="tcol">'
          +'<div class="tn">'+esc(e.team)+((isCatLeader&&i>0)?'<span class="crown">&#x1F451;</span>':'')+'</div>'
          +(gapBadge?'<div class="tmeta">'+gapBadge+'</div>':'')
        +'</div>'  
        +'<div style="flex-shrink:0;text-align:right;min-width:80px">'
          +'<div class="tsc '+(val?'vl':st==='live'?'lv':'nd')+'">'+(s||'&mdash;')+'</div>'
          +_roundHtml
          +(function(){
            var tbs=tbArr(sc);
            if(!tbs.length) return '';
            var tbStr=tbs.map(function(t,i){return (tbs.length>1?'TB'+(i+1)+' ':'')+fmt(t);}).join(' · ');
            return '<div style="font-size:.55em;color:#FF8A00;font-family:var(--fm);font-weight:900;letter-spacing:.5px;margin-top:2px;line-height:1;text-shadow:0 0 8px rgba(255,138,0,.4)">🎯 '+tbStr+'</div>';
          })()
          +((i>0&&repGap&&gapCls==='gap')?'<div style="font-size:1.18em;color:rgba(255,140,0,.98);font-family:var(--fm);text-align:right;font-weight:900;margin-top:3px;letter-spacing:.5px">'+repGap+'</div>':(i===0&&repGap?'<div style="font-size:1.05em;color:#4ADE80;font-family:var(--fm);text-align:right;font-weight:900;margin-top:3px;letter-spacing:.5px;text-shadow:0 0 8px rgba(74,222,128,.4)">'+repGap+'</div>':''))
        +'</div>'
      +'</div>'
      +chipsHtml
      +attemptsRowHtml(sc, w)
      +'</div>';
  }).join('');
}

// ════ RENDER ZONE ════
function renderZone(zone){
  var root=document.getElementById('z'+zone);if(!root)return;

  var data=getHeat(zone);
  var _preIhHeat=data; // ★ FIX #6 : heat courant AVANT réassignation getNext (celui qui vient de tourner)
  var ih=IH[String(zone)],ihOn=ih&&ih.active&&ih.target>(now()-4000);

  // Heat terminé dont on veut afficher les résultats dans la teams-band
  // ★ Calculé TOUJOURS (pas seulement pendant un IH) pour basculer instantanément
  // en mode résultats dès qu'un heat passe en done/timecap, SANS attendre de validation juge.
  var doneData=null;
  var bestDoneId=null, bestDoneTs=-1, bestDoneN=-1;
  Object.keys(HEATS).forEach(function(hid){
    var hx=HEATS[hid]; if(!hx) return;
    if((parseInt(hx.catZone!=null?hx.catZone:hx.zone)||1)!==zone) return;
    if(hx.status!=='done'&&hx.status!=='timecap') return;
    // ★ FIX SÉQUENCE RÉSULTATS : le heat « qui vient de finir » = celui dont le
    //   startTimestamp est le PLUS RÉCENT (ordre de passage réel), et NON le plus
    //   grand id. Les ids suivent l'ordre de CRÉATION des catégories : une catégorie
    //   créée avant mais jouée après a des ids plus petits, donc l'ancien tri par id
    //   ressortait éternellement les résultats d'une catégorie déjà passée (id plus
    //   grand) → « résultats d'une catégorie qui ne passe pas » + tout qui se mélange.
    //   startTimestamp = quand le heat a réellement démarré → toujours le bon.
    var ts=parseInt(hx.startTimestamp||0,10)||0;
    var n=parseInt(String(hid).replace(/\D/g,''))||0;
    if(ts>bestDoneTs || (ts===bestDoneTs && n>bestDoneN)){
      bestDoneTs=ts; bestDoneN=n; bestDoneId=hid;
    }
  });
  if(bestDoneId) doneData={id:bestDoneId,h:HEATS[bestDoneId]};

  if(ihOn){
    // data = prochain heat à afficher (pending/pre)
    var nd=getNext(zone);
    if(nd) data=nd;
    else if(doneData) data=doneData; // fallback si pas de prochain
  } else if(doneData && !data){
    // ★ Pas d'IH mais un heat est done → afficher direct le classement du heat done,
    // pas besoin d'attendre les juges, pas besoin d'IH.
    data=doneData;
  }

  if(!data){
    // Détecter fin J1 : tous les heats J1 done ET des heats J2 existent non démarrés
    var _j1Heats=Object.values(HEATS).filter(function(h){return (parseInt(h.catJour||h.jour||1)===1)&&(parseInt(h.catZone!=null?h.catZone:h.zone)||1)===zone;});
    var _j2Heats=Object.values(HEATS).filter(function(h){return (parseInt(h.catJour||h.jour||1)===2)&&(parseInt(h.catZone!=null?h.catZone:h.zone)||1)===zone;});
    var _j1AllDone=_j1Heats.length>0&&_j1Heats.every(function(h){return h.status==='done'||h.status==='timecap';});
    var _j2HasPending=_j2Heats.some(function(h){return h.status==='pending'||h.status==='pre';});
    var _showEndJ1=_j1AllDone&&_j2HasPending;

    if(_dh[zone]!==(_showEndJ1?'endj1':'none')){
      clearTeamIv(zone);
      _dh[zone]=_showEndJ1?'endj1':'none';_ds[zone]=null;
      if(_showEndJ1){
        root.innerHTML=''
          +'<div class="z-bar z'+zone+'"></div>'
          +'<div class="wod-hdr"><div class="wod-meta">'
            +'<span class="tag z'+zone+'">ZONE '+zone+'</span>'
            +'<span class="tag" style="background:#FF8F00;color:#fff">FIN JOUR 1</span>'
          +'</div><div class="wod-nom">🌙 À demain pour le Jour 2 !</div></div>'
          +'<div class="zone-body">'
            +'<div class="zone-idle"><div class="idle-z" style="font-size:3em">🌙</div><div class="idle-lb">JOUR 2 DEMAIN</div></div>'
          +'</div>';
      } else {
        root.innerHTML=''
          +'<div class="z-bar z'+zone+'"></div>'
          +'<div class="wod-hdr"><div class="wod-meta">'
            +'<span class="tag z'+zone+'">ZONE '+zone+'</span>'
            +'<span class="tag pending">EN ATTENTE</span>'
          +'</div><div class="wod-nom" style="opacity:.15">— — —</div></div>'
          +'<div class="zone-body">'
/* chrono zone supprimé */
            +'<div class="zone-idle"><div class="idle-z">Z'+zone+'</div><div class="idle-lb">EN ATTENTE</div></div>'
          +'</div>';
      }
    }
    startClock(zone,null,null,{});
    return;
  }

  var h=data.h,hid=data.id,w=h.wodInfo||{};
  h._id=hid;
  var st=h.status||'pending',catId=String(h.catId||'');

  var dKey=hid+'|'+st+(ihOn?'|ih':'');

  // Anti-rebuild : si DOM déjà construit pour ce heat/état
  if(_dh[zone]===dKey){
    if(!ihOn){
      // Hors IH : juste refresh les scores
      var tb=document.getElementById('tband-'+zone);
      var hFull=Object.assign({},h,{startTimestamp:h.startTimestamp||(HEATS[hid]&&HEATS[hid].startTimestamp)||0});
      if(tb) tb.innerHTML=renderRankCards(
        rankHeatEntries(hid,h,w),w,st,st==='live'||st==='pre',hFull,catId,catLeader
      );
    }
    // Pendant IH : ne rien toucher, le _teamIv gère le tband
    startClock(zone,hid,h,w);
    return;
  }
  clearTeamIv(zone);
  _dh[zone]=dKey;_ds[zone]=st;

  var moves=w.mouvements||[];
  var movDefs=moves.map(function(m){
    var q=(catId&&m.qtyParCat&&m.qtyParCat[catId]!=null&&m.qtyParCat[catId]!=='')?parseInt(m.qtyParCat[catId])||0:parseInt(m.qty||m.ergoTarget||0)||0;
    var pw=(catId&&m.poids&&typeof m.poids==='object'&&m.poids[catId])?m.poids[catId]:(typeof m.poids==='string'?m.poids:'');
    return{nom:m.nom||'',q:q,poids:pw,qui:m.qui||'',comment:m.comment||'',note:m.note||'',tour:parseInt(m.tour||0,10)||0,ergoFree:!!m.ergoFree,ergoUnit:m.ergoUnit||''};
  });
  var QLBLS={'A':'A','B':'B','A+B':'A+B','relay':'Relais','both':'x2'};
  var CLBLS={'synchro':'sync','solo':'solo','share':'libre','relay':'relais','alt':'alt'};
  var movsHtml=movDefs.map(function(m,_i){
    var _tb=(m.tour>0&&(_i===0||(movDefs[_i-1]||{}).tour!==m.tour))?'<span style="background:rgba(255,209,102,.16);color:#FFD166;border:1px solid rgba(255,209,102,.4);border-radius:4px;padding:0 5px;font-size:10px;font-weight:900;letter-spacing:.5px;display:inline-flex;align-items:center;flex-shrink:0;margin-right:4px">T'+m.tour+'</span>':'';
    var tags='';
    if(m.qui) tags+='<span style="background:rgba(45,156,255,.2);color:#93C5FD;border-radius:3px;padding:0 5px;font-size:10px;font-weight:700;margin-left:3px">'+(QLBLS[m.qui]||esc(m.qui))+'</span>';
    if(m.comment) tags+='<span style="background:rgba(5,150,105,.18);color:#6EE7B7;border-radius:3px;padding:0 5px;font-size:10px;margin-left:2px">'+(CLBLS[m.comment]||esc(m.comment))+'</span>';
    return '<div class="mov">'+_tb+'<span class="mov-q">'+(m.ergoFree?'MAX':'×'+m.q)+'</span><span class="mov-n">'+esc(m.nom)+'</span>'+(m.poids?'<span class="mov-p">'+esc(m.poids)+'</span>':'')+tags+'</div>';
  }).join('');
  var ST={'live':'LIVE','timecap':'TIMECAP','pre':'PRÊT','done':'TERMINÉ','pending':'ATTENTE'};
  var catLeaders=getLeaders();
  var catLeader=catLeaders[catId]||null;

  // Pour la teams-band : pendant l'IH (ou quand rien ne tourne encore) on affiche
  // les résultats du heat fini. MAIS dès qu'un heat TOURNE réellement (live/timecap)
  // hors IH, on affiche CE heat — sinon les équipes du heat qui vient de finir
  // « bavent » sur le premier rendu du heat suivant (symptôme chef : « l'équipe qui
  // vient de passer s'affiche dans le prochain heat »). doneData ne doit gagner que
  // pendant l'inter-heat ou tant qu'aucun heat n'est en cours.
  var _curRunning = data && data.h && (data.h.status==='live'||data.h.status==='timecap') && !ihOn;
  var _preIhOk = _preIhHeat && _preIhHeat.h && _preIhHeat.h.status!=='pending' && _preIhHeat.h.status!=='pre';
  var displayData = _curRunning ? data : (doneData || (_preIhOk ? _preIhHeat : data));
  var dh=displayData.h,dhid=displayData.id,dw=dh.wodInfo||{};
  var displayCatId=String(dh.catId||'');
  var displayCatLeader=catLeaders[displayCatId]||null;
  var heatRows=rankHeatEntries(dhid,dh,dw);
  var displaySt=dh.status||'pending';
  // Enrichir dh avec startTimestamp pour que etaInfoForRow fonctionne
  var dhFull=Object.assign({},dh,{startTimestamp:dh.startTimestamp||(HEATS[dhid]&&HEATS[dhid].startTimestamp)||0});

  // ★ HARMONISATION : pendant l'IH, le header doit suivre la teams-band.
  //   Au montage, on affiche le header du heat AFFICHÉ (displayData = heat fini si dispo).
  //   La fonction startTeamBandIH() pilotera ensuite la transition heat→wod→preview
  //   en réécrivant ce header_id à chaque changement de phase.
  var _hdrH  = ihOn ? dh   : h;
  var _hdrW  = ihOn ? dw   : w;
  var _hdrSt = ihOn ? displaySt : st;
  var _hdrMovsHtml = movsHtml; // par défaut on garde les mouvements du heat courant
  if(ihOn){
    // Reconstruire movsHtml pour le heat affiché (heat fini)
    var _hdrMoves=(_hdrW.mouvements||[]).map(function(m){
      var q=(displayCatId&&m.qtyParCat&&m.qtyParCat[displayCatId]!=null&&m.qtyParCat[displayCatId]!=='')?parseInt(m.qtyParCat[displayCatId])||0:parseInt(m.qty||m.ergoTarget||0)||0;
      var pw=(displayCatId&&m.poids&&typeof m.poids==='object'&&m.poids[displayCatId])?m.poids[displayCatId]:(typeof m.poids==='string'?m.poids:'');
      return{nom:m.nom||'',q:q,poids:pw,qui:m.qui||'',comment:m.comment||'',tour:parseInt(m.tour||0,10)||0,ergoFree:!!m.ergoFree,ergoUnit:m.ergoUnit||''};
    });
    _hdrMovsHtml = _hdrMoves.map(function(m,_i){
      var _tb=(m.tour>0&&(_i===0||(_hdrMoves[_i-1]||{}).tour!==m.tour))?'<span style="background:rgba(255,209,102,.16);color:#FFD166;border:1px solid rgba(255,209,102,.4);border-radius:4px;padding:0 5px;font-size:10px;font-weight:900;letter-spacing:.5px;display:inline-flex;align-items:center;flex-shrink:0;margin-right:4px">T'+m.tour+'</span>':'';
      var tags='';
      if(m.qui) tags+='<span style="background:rgba(45,156,255,.2);color:#93C5FD;border-radius:3px;padding:0 5px;font-size:10px;font-weight:700;margin-left:3px">'+(QLBLS[m.qui]||esc(m.qui))+'</span>';
      if(m.comment) tags+='<span style="background:rgba(5,150,105,.18);color:#6EE7B7;border-radius:3px;padding:0 5px;font-size:10px;margin-left:2px">'+(CLBLS[m.comment]||esc(m.comment))+'</span>';
      return '<div class="mov">'+_tb+'<span class="mov-q">'+(m.ergoFree?'MAX':'×'+m.q)+'</span><span class="mov-n">'+esc(m.nom)+'</span>'+(m.poids?'<span class="mov-p">'+esc(m.poids)+'</span>':'')+tags+'</div>';
    }).join('');
  }

  root.innerHTML=''
    +'<div class="z-bar z'+zone+'"></div>'
    +'<div class="wod-hdr" id="whdr-'+zone+'">'
      +'<div class="wod-meta">'
        +'<span class="tag z'+zone+'">ZONE '+zone+'</span>'
        +'<span class="tag ht">HEAT '+(_hdrH.catHeatNum||_hdrH.globalNum||'—')+'</span>'
        +'<span class="tag '+_hdrSt+'">'+(ST[_hdrSt]||'—')+'</span>'
        +(ihOn?'<span class="tag ih">⏳ ENTRE HEATS</span>':'')
      +'</div>'
      +'<div class="wod-title-row">'
        +'<div class="wod-nom">'+esc(_hdrW.nom||'—')+'</div>'
        +'<div class="wod-cat">'+esc(_hdrH.catName||'')+'</div>'
      +'</div>'
      +(_hdrMovsHtml?'<div class="mov-row">'+_hdrMovsHtml+'</div>':'')
    +'</div>'
    +'<div class="zone-body">'
      +'<div class="zone-chrono chrono-band" id="cb-z'+zone+'"><div class="chrono-lbl" id="cl-z'+zone+'">⌛ EN ATTENTE</div><div class="chrono-mid"><div class="chrono-val idle" id="cv-z'+zone+'">--:--</div><div class="chrono-round" id="cr-z'+zone+'" style="display:none"></div></div></div>'
      +'<div class="teams-band" id="tband-'+zone+'">'
        +renderRankCards(heatRows,dw,displaySt,displaySt==='live'||displaySt==='pre',dhFull,displayCatId,displayCatLeader)
      +'</div>'
    +'</div>';

  startClock(zone,hid,h,w);

  // ★ FIX FLASH « PROCHAIN HEAT » : ne démarrer la séquence résultats→preview QUE si le
  //   heat fini est réellement connu (doneData = statut done/timecap). Si l'inter-heat
  //   s'active avant que Firebase ait basculé le heat en done, on garde l'affichage
  //   courant et on attend le prochain render — supprime le flash preview d'~1s.
  if(ihOn&&ih.target>now()&&doneData){
    startTeamBandIH(zone,ih.target,dhid,dh,dw,displayCatId,displayCatLeader);
  }
}

// ════ TEAMS BAND IH PREVIEW ════
function clearTeamIv(z){clearInterval(_teamIv[z]);_teamIv[z]=null;}

// Déclenche l'affichage résultats/IH pour une zone dès la fin d'un heat
// Retry jusqu'à 10s si system/interheat pas encore actif dans Firebase
function _triggerIHDisplay(zone, hid, h){
  var _attempts = 0;
  function tryDisplay(){
    var ih = IH[String(zone)];
    var ihActive = ih && ih.active && ih.target > now();
    if(ihActive){
      // IH actif : lancer directement
      _dh[zone] = null; // forcer rebuild DOM
      scheduleRender();
      return;
    }
    // IH pas encore arrivé : attendre un peu, mais plus nerveux pour le live
    if(_attempts < 16){
      _attempts++;
      setTimeout(tryDisplay, 250);
    } else {
      // Fallback : afficher quand même les résultats sans IH
      var w = h.wodInfo||{};
      var catId = String(h.catId||'');
      var catLeaders = getLeaders();
      var catLeader = catLeaders[catId]||null;
      var tb = document.getElementById('tband-'+zone);
      if(tb){
        var heatRows = rankHeatEntries(hid, h, w);
        var isLast = isLastCategoryHeat(h);
        tb.innerHTML = '<div class="p-title">🏁 '+esc(w.nom||'WOD')+'</div>'
        +'<div class="p-sub">'+esc(h.catName||'')+' · Heat '+(h.catHeatNum||'—')+' / '+(h.nbHeatsTotal||'—')+'</div>'
        + renderRankCards(heatRows, w, h.status||'done', false, h, catId, catLeader);
        if(isLast){
          setTimeout(function(){
            if(tb) tb.innerHTML = renderWodHtml(h);
          }, 3000);
        }
      }
    }
  }
  // Petite attente pour laisser remonter les scores, sans ralentir visuellement
  setTimeout(tryDisplay, 250);
}

function startTeamBandIH(zone,ihTarget,doneHid,doneH,doneW,catId,catLeader){
  clearTeamIv(zone);
  var el=document.getElementById('tband-'+zone);
  if(!el) return;

  var ih=IH[String(zone)]||{};
  var totalSec=parseInt(ih.seconds||0,10)||Math.max(8,Math.round((ihTarget-now())/1000));
  var isLast=isLastCategoryHeat(doneH);
  // ★ Répartition des phases :
  //   - Heat normal : résultats heat (~35%) → preview prochain heat (~65%)
  //   - DERNIER heat de la catégorie : résultats (~25%) → classement général figé (~30%) → preview (~45%)
  //   Le classement général ne s'affiche QUE sur le dernier heat car entre 2 heats
  //   intermédiaires les scores changent (équipes qui zigzaguent → confusion public).
  var reserveSec=Math.max(4,Math.min(6,Math.round(totalSec*0.08)));
  var workSec=Math.max(4,totalSec-reserveSec);
  // ★ CHEF (partie 1) : résultats laissés en PAUSE ~20 s pour être bien lus. Se réduit
  //   automatiquement si l'inter-heat est court (sinon plus de place pour annoncer le
  //   prochain heat). Puis preview du prochain heat jusqu'au départ (avec décompte).
  var heatSec=isLast?Math.max(6,Math.min(20,Math.round(workSec*0.35))):Math.max(6,Math.min(20,Math.round(workSec*0.45)));
  var wodSec =isLast?Math.max(5,Math.min(14,Math.round(workSec*0.26))):0;

  // ★ FIX #3 (classement général zappé) + #4 (résultat sauté avant coupure) :
  //   PLANNING PERSISTANT par heat terminé. scheduleRender rappelle cette fonction
  //   souvent ; avant, chaque ré-entrée recalculait la phase et collapsait 'wod'
  //   (classement général) → 'preview', ce qui le faisait disparaître. Désormais on
  //   calcule les timestamps de transition UNE fois par heat fini, on les réutilise,
  //   et la phase est DÉDUITE du temps courant (jamais en arrière, jamais collapsée).
  if(!startTeamBandIH._sched) startTeamBandIH._sched={};
  var _sc=startTeamBandIH._sched[zone];
  var heatEnd, wodEnd, previewStart;
  if(_sc && _sc.hid===doneHid){
    heatEnd=_sc.heatEnd; wodEnd=_sc.wodEnd; previewStart=_sc.previewStart;
  } else {
    heatEnd=now()+heatSec*1000;
    wodEnd=isLast?(heatEnd+wodSec*1000):null;
    previewStart=ihTarget-reserveSec*1000;
    // La preview ne doit jamais démarrer avant la fin du résultat/classement.
    if(wodEnd){ if(previewStart<wodEnd) previewStart=wodEnd; }
    else { if(previewStart<heatEnd) previewStart=heatEnd; }
    // ★ CHEF : COUPURE → ne PAS annoncer le prochain heat avant la coupure, uniquement
    //   avant la REPRISE. On garde les résultats (couverts par la page sponsors) pendant
    //   toute la coupure ; « PROCHAIN HEAT » n'apparaît que dans les derniers 15%
    //   (aligné sur la fenêtre sponsors → handoff propre vers le prochain heat).
    if((ih.ihType||'')==='coupure'){
      previewStart=ihTarget-Math.max(8000,Math.round(totalSec*1000*0.15));
      // ★ FIX #4 (classement général sauté avant une COUPURE) : sur le DERNIER heat de la
      //   catégorie, on affiche quand même le classement général (résultats → classement
      //   général → sponsors pendant le reste de la coupure). Une coupure dure assez
      //   longtemps (souvent 10 min) pour le montrer avant la page « Merci ».
      //   Heat non-dernier : pas de classement général (scores intermédiaires trompeurs).
      if(isLast){
        heatEnd=now()+heatSec*1000;
        wodEnd=heatEnd+wodSec*1000;
        if(wodEnd>previewStart) wodEnd=previewStart; // borne : jamais après le handoff sponsors
        if(heatEnd>wodEnd) heatEnd=wodEnd;
      } else {
        heatEnd=previewStart; wodEnd=null;
      }
    }
    startTeamBandIH._sched[zone]={hid:doneHid,heatEnd:heatEnd,wodEnd:wodEnd,previewStart:previewStart};
  }
  // ★ WOD amrapsteph : si ce heat a attendu la saisie et qu'elle vient d'arriver (sur une
  //   ré-entrée déclenchée par Firebase), on (re)cale ici la fenêtre de lecture du résultat,
  //   bornée par previewStart. Sans ça, le heatEnd d'origine (déjà écoulé) ferait sauter le
  //   classement directement en preview. Le départ du prochain heat (previewStart) ne bouge pas.
  var _scw=startTeamBandIH._sched[zone];
  if(_scw && _scw.hid===doneHid && _scw.waited && !_scw.windowSet
     && !_heatResultsShouldWait(doneHid, HEATS[doneHid]||doneH)){
    heatEnd=Math.min(now()+heatSec*1000, previewStart);
    wodEnd=(isLast && wodSec>=3)?Math.min(heatEnd+wodSec*1000, previewStart):null;
    _scw.windowSet=true; _scw.heatEnd=heatEnd; _scw.wodEnd=wodEnd;
  }
  // Phase initiale déduite du planning (jamais rejouée en arrière car le temps avance).
  var _t0=now();
  var phase=(_t0<heatEnd)?'heat':((wodEnd&&_t0<wodEnd)?'wod':'preview'); // 'heat'|'wod'|'preview'
  // ★ WOD amrapsteph non saisi : on force la phase « heat » (bandeau d'attente) même si le
  //   chrono de lecture est déjà écoulé — on n'affiche jamais de classement avant la saisie.
  //   Sauf si on a déjà atteint le moment d'annoncer le prochain heat (départ à l'heure).
  if(_heatResultsShouldWait(doneHid, HEATS[doneHid]||doneH) && _t0<previewStart){ phase='heat'; }
  function _setPhase(p){ phase=p; renderPhase(); }

  // ★ HARMONISATION HEADER : on synchronise le wod-hdr de la zone avec la phase
  //   en cours pour qu'on ne voie JAMAIS à l'écran le WOD précédent ET le
  //   prochain en même temps. Le header devient le miroir de la teams-band.
  function _renderMovsFor(w, _catId){
    var moves=(w&&w.mouvements)||[];
    return moves.map(function(m,_i){
      var _tb=(m.tour>0&&(_i===0||(moves[_i-1]||{}).tour!==m.tour))?'<span style="background:rgba(255,209,102,.16);color:#FFD166;border:1px solid rgba(255,209,102,.4);border-radius:4px;padding:0 5px;font-size:10px;font-weight:900;letter-spacing:.5px;display:inline-flex;align-items:center;flex-shrink:0;margin-right:4px">T'+m.tour+'</span>':'';
      var q=(_catId&&m.qtyParCat&&m.qtyParCat[_catId]!=null&&m.qtyParCat[_catId]!=='')?parseInt(m.qtyParCat[_catId])||0:parseInt(m.qty||m.ergoTarget||0)||0;
      var pw=(_catId&&m.poids&&typeof m.poids==='object'&&m.poids[_catId])?m.poids[_catId]:(typeof m.poids==='string'?m.poids:'');
      var qLbl=m.qui||'', cLbl=m.comment||'';
      var tags='';
      if(qLbl) tags+='<span style="background:rgba(45,156,255,.2);color:#93C5FD;border-radius:3px;padding:0 5px;font-size:10px;font-weight:700;margin-left:3px">'+esc(qLbl)+'</span>';
      if(cLbl) tags+='<span style="background:rgba(5,150,105,.18);color:#6EE7B7;border-radius:3px;padding:0 5px;font-size:10px;margin-left:2px">'+esc(cLbl)+'</span>';
      return '<div class="mov">'+_tb+'<span class="mov-q">'+(m.ergoFree?'MAX':'×'+q)+'</span><span class="mov-n">'+esc(m.nom||'')+'</span>'+(pw?'<span class="mov-p">'+esc(pw)+'</span>':'')+tags+'</div>';
    }).join('');
  }
  function syncHeader(mode){
    var hdr=document.getElementById('whdr-'+zone);
    if(!hdr) return;
    var H, W, _cat, _stTag, _stLbl, _isNext=false;
    if(mode==='next'){
      var nd=getNext(zone);
      if(!nd){
        // Pas de prochain heat → on garde le header du heat terminé en mode "FIN"
        H=doneH; W=doneW; _cat=String(doneH.catId||''); _stTag='done'; _stLbl='FIN';
      } else {
        H=nd.h; W=H.wodInfo||{}; _cat=String(H.catId||''); _stTag='pre'; _stLbl='PROCHAIN'; _isNext=true;
      }
    } else {
      // mode 'done' (heat ou wod) : on reste sur le heat fini
      H=doneH; W=doneW; _cat=String(doneH.catId||''); _stTag='done'; _stLbl=(mode==='wod'?'CLASSEMENT GÉNÉRAL':'TERMINÉ');
    }
    var _mvs=_renderMovsFor(W,_cat);
    // ★ ANTI-CLIGNOTEMENT : syncHeader est appelé à chaque tick (500ms) pendant
    //   la preview. On ne touche au DOM QUE si le contenu a réellement changé,
    //   sinon le header se réécrit en boucle (et relance ses transitions CSS).
    var _newKey=(_isNext?'next':'done')+'|'+(H.catHeatNum||H.globalNum||'')+'|'+_stLbl+'|'+(W.nom||'')+'|'+(H.catName||'')+'|'+_mvs;
    if(syncHeader._lastKey && syncHeader._lastKey[zone]===_newKey) return;
    if(!syncHeader._lastKey) syncHeader._lastKey={};
    syncHeader._lastKey[zone]=_newKey;
    hdr.className='wod-hdr'+(_isNext?' is-next':' is-done');
    hdr.innerHTML=''
      +'<div class="wod-meta">'
        +'<span class="tag z'+zone+'">ZONE '+zone+'</span>'
        +'<span class="tag ht">HEAT '+(H.catHeatNum||H.globalNum||'—')+'</span>'
        +'<span class="tag '+_stTag+'">'+esc(_stLbl)+'</span>'
        +'<span class="tag ih">⏳ ENTRE HEATS</span>'
      +'</div>'
      +'<div class="wod-title-row">'
        +'<div class="wod-nom">'+esc(W.nom||'—')+'</div>'
        +'<div class="wod-cat">'+esc(H.catName||'')+'</div>'
      +'</div>'
      +(_mvs?'<div class="mov-row">'+_mvs+'</div>':'');
  }

  function renderPhase(){
    var el2=document.getElementById('tband-'+zone);
    if(!el2) return;
    // ★ DOUBLON CHRONO (demande chef) : pendant la preview « PROCHAIN HEAT » (bloc avec le
    //   nom + son compteur), on MASQUE le gros chrono INTER-HEAT du haut — le public suit le
    //   bloc nommé, plus parlant. Il reste visible en phase résultats/classement. Il est
    //   reconstruit visible dès que renderZone repasse (départ du heat suivant).
    var _cb=document.getElementById('cb-z'+zone);
    if(_cb) _cb.style.display=(phase==='preview')?'none':'';
    if(phase==='heat'){
      // ★ FIX SÉQUENCE RÉSULTATS (bug chef) : ne JAMAIS afficher en « résultats » un
      //   heat qui n'est pas réellement TERMINÉ. Si le heat pointé est en fait le
      //   prochain (pending/pre — cas de latence où le heat fini n'est pas encore passé
      //   en 'done'), on saute directement à la preview au lieu de montrer « les
      //   résultats du heat suivant ».
      // ★ FIX FLASH PROCHAIN HEAT (bug chef) : on n'entre dans cette phase QUE parce que
      //   la séquence a démarré sur un heat réellement fini (gate doneData en amont). Le
      //   statut Firebase peut avoir un léger lag (pas encore 'done') → avant, on sautait
      //   en preview = FLASH « prochain heat » en début de séquence. On affiche donc les
      //   résultats du heat pointé (doneHid) sans sauter, tant qu'il n'est pas 'pending'/'pre'
      //   (= un vrai prochain heat, cas à éviter). Plus de flash.
      var _dhSt=(HEATS[doneHid]&&HEATS[doneHid].status)||(doneH&&doneH.status)||'';
      if(_dhSt==='pending' || _dhSt==='pre'){ _setPhase('preview'); return; }
      // ★ WOD amrapsteph (ex « Bike N Run ») : le juge saisit les cals du bike en fin de WOD.
      //   Tant que TOUT le heat n'est pas saisi, on N'AFFICHE PAS le classement de résultat
      //   (il serait faux/incomplet). On reste sur la vue du heat avec un bandeau d'attente,
      //   et on laisse au juge le temps de saisir (il a les minutes d'inter-heat). Dès que
      //   la saisie est complète, la transition laisse place au classement (phase normale).
      if(_heatResultsShouldWait(doneHid, HEATS[doneHid]||doneH)){
        syncHeader('done');
        var _waitRows=rankHeatEntries(doneHid,HEATS[doneHid]||doneH,doneW);
        el2.innerHTML=''
          +'<div class="p-title">🏁 '+esc(doneW.nom||'WOD')+(doneH.catName?(' · '+esc(doneH.catName)):'')+'</div>'
          +'<div class="score-wait">⏳ SCORES EN COURS DE VALIDATION</div>'
          +renderRankCards(_waitRows,doneW,'live',true,HEATS[doneHid]||doneH,catId,catLeader);
        return;
      }
      syncHeader('done');
      var heatRows=rankHeatEntries(doneHid,HEATS[doneHid]||doneH,doneW);
      // ★ VISUEL HEAT FINI — plus de gros logo tournant qui écrase la colonne.
      //   Résultats propres en cartes (renderRankCards INCHANGÉ → le rendu des
      //   mouvements/avancement ne change pas). Le compte à rebours inter-heat
      //   est déjà affiché en haut par le bandeau chrono de la zone.
      el2.innerHTML=''
        +'<div class="p-title">🏁 RÉSULTATS'+(doneH.catName?(' · '+esc(doneH.catName)):'')+'</div>'
        +'<div class="p-sub">'+esc(doneW.nom||'WOD')
        +' · Heat '+(doneH.catHeatNum||'—')+' / '+(doneH.nbHeatsTotal||'—')+'</div>'
        +renderRankCards(heatRows,doneW,'done',false,HEATS[doneHid]||doneH,catId,catLeader);
    } else if(phase==='wod'){
      syncHeader('wod');
      el2.innerHTML=renderWodHtml(doneH);
    } else {
      syncHeader('next');
      // preview prochain heat
      var nd=getNext(zone);
      if(!nd){
        el2.innerHTML='<div style="font-family:var(--ff);font-size:clamp(20px,3vw,36px);letter-spacing:2px;color:var(--ink3);text-align:center;padding:20px">FIN DE CATÉGORIE</div>';
        return;
      }
      var remP=Math.max(0,Math.ceil((ihTarget-now())/1000));
      var cdTxt=p2(Math.floor(remP/60))+':'+p2(remP%60);
      // ★ Le compte à rebours vit DANS le bloc « PROCHAIN HEAT » (avec le nom) — c'est
      //   l'affichage principal pour le public. Le gros chrono du haut est masqué pendant
      //   cette phase (voir renderPhase) pour ne pas faire doublon.
      // ★ ANTI-CLIGNOTEMENT : si le bloc existe déjà, on met seulement à jour le compteur.
      var existingCd=document.getElementById('prev-cd-'+zone);
      if(existingCd){
        existingCd.textContent=cdTxt;
        // ★ décompte 30 s avant départ → rouge pulsé
        if(remP<=30) existingCd.classList.add('imminent'); else existingCd.classList.remove('imminent');
        return;
      }
      // Premier rendu de la preview : on construit tout une seule fois
      var slots=nd.h.slots||nd.h.lanes||{};
      var laneKeys=Object.keys(slots).sort(function(a,b){return parseInt(a)-parseInt(b);})
        .filter(function(ln){var l=slots[ln];return l&&l.teamName;});
      var _nW=nd.h.wodInfo||{};
      var _nWod=esc(_nW.nom||'');
      var _nCat=esc(nd.h.catName||'');
      var _wodSub=(_nWod||_nCat)?('<div class="np-wod">'+[_nWod,_nCat].filter(Boolean).join(' · ')+'</div>'):'';
      el2.innerHTML='<div class="np-hdr">'
          +'<div class="np-hdr-lbl">⚡ PROCHAIN HEAT</div>'
          +'<div class="np-cd'+(remP<=30?' imminent':'')+'" id="prev-cd-'+zone+'">'+cdTxt+'</div>'
          +_wodSub
        +'</div>'
        +laneKeys.map(function(ln){
          var l=slots[ln];
          var laneNum=String(ln).replace(/\D/g,'')||ln;
          return '<div class="np-team">'
            +'<div class="np-lane">L'+laneNum+'</div>'
            +'<div class="np-nm">'+esc(l.teamName)+'</div>'
          +'</div>';
        }).join('');
    }
  }

  // Phase initiale : résultats heat
  renderPhase();

  // Planifier les transitions (heatEnd/wodEnd/previewStart : planning persistant calculé plus haut)

  _teamIv[zone]=setInterval(function(){
    var el2=document.getElementById('tband-'+zone);
    if(!el2){clearTeamIv(zone);return;}
    var t=now();
    var rem=Math.max(0,Math.ceil((ihTarget-t)/1000));
    if(rem<=0){clearTeamIv(zone);scheduleRender();return;}

    // ★ WOD amrapsteph : on affiche le classement de résultat UNIQUEMENT quand les juges ont
    //   validé. IMPORTANT : l'heure de départ du prochain heat NE BOUGE PAS (ihTarget /
    //   previewStart restent fixes). Donc :
    //   • Tant que la saisie n'est pas complète → on reste en phase « heat » (bandeau
    //     d'attente + cartes live), SANS toucher aux timestamps. Si on atteint previewStart
    //     avant la saisie, on annonce quand même le prochain heat (il doit partir à l'heure).
    //   • Dès que la saisie est complète → le résultat a droit à sa fenêtre de lecture, mais
    //     BORNÉE par previewStart (jamais après). Si la saisie arrive tard, le résultat
    //     s'affiche moins longtemps, mais le heat suivant part quand même à l'heure prévue.
    if(phase==='heat'){
      var _scL=startTeamBandIH._sched[zone]||{};
      var _waiting=_heatResultsShouldWait(doneHid, HEATS[doneHid]||doneH);
      if(_waiting){
        _scL.waited=true;           // on mémorise qu'on a attendu (pour caler la lecture après)
        renderPhase();              // garde le bandeau + les cartes vivantes
        if(t>=previewStart){ _setPhase('preview'); } // le prochain heat part à l'heure
        return;
      }
      // La saisie vient d'arriver APRÈS une attente : caler la fenêtre de lecture du résultat,
      //   bornée par previewStart (jamais après → départ du prochain heat inchangé). Une fois.
      if(_scL.hid===doneHid && _scL.waited && !_scL.windowSet){
        heatEnd=Math.min(t+heatSec*1000, previewStart);
        wodEnd=(isLast && wodSec>=3)?Math.min(heatEnd+wodSec*1000, previewStart):null;
        _scL.windowSet=true; _scL.heatEnd=heatEnd; _scL.wodEnd=wodEnd;
        renderPhase(); // affiche le classement tout de suite (la saisie vient d'arriver)
      }
    }

    // Transitions de phase
    if(phase==='heat' && t>=heatEnd){
      // Phase wod (classement général) seulement sur le DERNIER heat de la catégorie
      if(isLast && wodSec>=3){_setPhase('wod');}
      else if(t>=previewStart){_setPhase('preview');}
    } else if(phase==='wod' && wodEnd && t>=wodEnd){
      _setPhase('preview');
    } else if(phase!=='preview' && t>=previewStart){
      _setPhase('preview');
    } else if(phase==='preview'){
      // Re-render preview pour mettre à jour le countdown
      renderPhase();
    }
  },500);
}
