<script>if('serviceWorker' in navigator){
  navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).then(function(reg){ setInterval(function(){ reg.update().catch(function(){}); }, 60000); }).catch(function(){});
  // ★ Auto-reload silencieux quand une nouvelle version est déployée.
  //   On évite de recharger en plein chrono actif (pour ne pas couper
  //   l'affichage public en plein heat). On attend qu'aucune zone ne soit
  //   en train de décompter.
  var _swReloaded=false;
  function _liveSafeToReload(){
    try{
      // Si une IH est active ou un heat tourne, on attend.
      if(typeof IH!=='undefined' && IH){
        if((IH['1']&&IH['1'].active)||(IH['2']&&IH['2'].active)) return false;
      }
      // Pas de signal clair de heat live accessible globalement → on autorise.
      return true;
    }catch(e){ return true; }
  }
  navigator.serviceWorker.addEventListener('message', function(ev){
    if(ev.data && ev.data.type==='SW_UPDATED' && !_swReloaded){
      _swReloaded=true;
      var _try=function(){
        if(_liveSafeToReload()){ setTimeout(function(){ location.reload(); }, 800); }
        else { setTimeout(_try, 5000); }
      };
      _try();
    }
  });
}</script>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@700;900&family=JetBrains+Mono:wght@700;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --tb:44px;
  --bg:#07090f;--ink:#EAEEF5;--ink2:#8899B4;--ink3:#2A3A52;
  --ok:#00E5A0;--err:#FF3055;--warn:#FFB020;--gold:#FFD166;
  --blue:#2D9CFF;--purple:#9B5DE5;
  --ff:'Bebas Neue',sans-serif;
  --fc:'Barlow Condensed',sans-serif;
  --fm:'JetBrains Mono',monospace;
}
/* ★ OPTION FOND BLANC : activée via body.light (bouton ☀️). Redéfinit les
   variables de couleur pour un affichage clair lisible sur vidéoprojecteur. */
body.light{
  --bg:#FFFFFF;--ink:#0E1726;--ink2:#5A6B82;--ink3:#C2CEDD;
  --ok:#00A06E;--err:#D32036;--warn:#B7791F;--gold:#C99700;
  --blue:#1F6FD6;--purple:#7A45C2;
}
body.light .topbar{background:#F3F6FA!important;border-bottom:1px solid rgba(0,0,0,.10)}
body.light .pod-overlay{background:rgba(255,255,255,.97)!important}
body.light .mov{background:rgba(0,0,0,.04)!important;border-color:rgba(0,0,0,.10)!important}
body.light .zone-body{background:#FFFFFF!important}
body.light .zone-idle{background:#F7F9FC!important}
body.light #morning-cd{background:#FFFFFF!important}
body.light .chrono-band{background:#F7F9FC!important}
body.light .rank-card,body.light .rc{background:#F7F9FC!important;border-color:rgba(0,0,0,.08)!important}
body.light .live-msg-banner{color:#0E1726!important}
html{height:100%;overflow:hidden}
body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--fc);display:flex;flex-direction:column}
.topbar{
  height:var(--tb);min-height:var(--tb);flex-shrink:0;
  display:flex;align-items:center;gap:10px;padding:0 14px;
  background:rgba(5,7,12,.99);border-bottom:1px solid rgba(255,255,255,.08);z-index:20
}
.brand{display:flex;align-items:center;gap:7px}
.brand-ico{width:26px;height:26px;border-radius:5px;background:linear-gradient(135deg,#FF5722,#FF8A00);
  display:flex;align-items:center;justify-content:center;font-family:var(--ff);font-size:16px;color:#fff}
.brand-lbl{font-family:var(--ff);font-size:18px;letter-spacing:3px;color:#fff}
.live-badge{display:flex;align-items:center;gap:4px;padding:3px 9px;border-radius:4px;
  background:rgba(255,48,85,.12);border:1px solid rgba(255,48,85,.4);
  font-family:var(--ff);font-size:10px;letter-spacing:2px;color:#FF3055}
.live-badge::before{content:'';width:5px;height:5px;border-radius:50%;background:#FF3055;animation:blk 1.2s infinite}
.live-msg-banner{
  position:fixed;top:var(--tb);left:0;right:0;z-index:250;display:none;
  padding:14px 22px;background:linear-gradient(135deg,rgba(45,156,255,.96),rgba(21,101,192,.96));
  border-bottom:1px solid rgba(255,255,255,.18);box-shadow:0 8px 28px rgba(0,0,0,.35);
  color:#fff;font-family:var(--ff);font-size:clamp(18px,2.2vw,34px);letter-spacing:2px;text-align:center
}
.live-msg-banner.show{display:block;animation:sp 1.8s infinite}
.vsw{display:flex;gap:3px;margin-left:auto}
.vbtn{padding:4px 11px;border-radius:4px;border:1px solid rgba(255,255,255,.1);
  background:transparent;color:var(--ink2);font-family:var(--ff);font-size:11px;letter-spacing:1px;cursor:pointer;transition:.13s}
.vbtn.on{background:#2D9CFF;color:#fff;border-color:#2D9CFF}
.vbtn:hover:not(.on){background:rgba(255,255,255,.06)}
#clk{font-family:var(--fm);font-size:11px;color:var(--ink3);margin-left:6px}

/* Fullscreen : masquer topbar, shell plein écran */
:fullscreen .topbar,:-webkit-full-screen .topbar,:-moz-full-screen .topbar{display:none!important}
:fullscreen .shell,:-webkit-full-screen .shell,:-moz-full-screen .shell{
  height:100vh!important;grid-template-rows:auto 1fr!important
}

.shell{width:100%;height:calc(100vh - var(--tb));display:grid;
  grid-template-columns:1fr 1fr;
  grid-template-rows:1fr;
  overflow:hidden}
/* Zones — deux colonnes, chacune avec SON chrono en haut (indépendant) */
#z2{grid-column:1;grid-row:1;min-height:0;overflow:hidden}
#z1{grid-column:2;grid-row:1;min-height:0;overflow:hidden}
.shell.solo{grid-template-rows:1fr!important}
.shell.solo #z2{grid-column:1/3;grid-row:1}
.shell.solo #z1{grid-column:1/3;grid-row:1}
.shell.solo #z2,.shell.solo #z1{grid-row:1!important}
.shell.solo .zone-col.hidden{display:none}
.zone-col{display:flex;flex-direction:column;min-height:0;overflow:hidden;position:relative}
.zone-col.hidden{display:none}
.zone-col:first-child{border-right:2px solid rgba(255,255,255,.07)}
.z-bar{height:4px;flex-shrink:0}
.z-bar.z1{background:linear-gradient(90deg,#2D9CFF 0%,transparent 100%)}
.z-bar.z2{background:linear-gradient(90deg,#00C87A 0%,transparent 100%)}

/* WOD header compact */
.wod-hdr{flex-shrink:0;padding:5px 14px 4px;background:rgba(10,15,24,.97);border-bottom:1px solid rgba(255,255,255,.06)}
.wod-meta{display:flex;align-items:center;gap:5px;margin-bottom:2px;flex-wrap:wrap}
.tag{padding:2px 8px;border-radius:3px;font-family:var(--ff);font-size:clamp(9px,0.9vw,13px);letter-spacing:2px}
.tag.z1{background:rgba(45,156,255,.15);border:1px solid rgba(45,156,255,.4);color:#2D9CFF}
.tag.z2{background:rgba(0,200,122,.12);border:1px solid rgba(0,200,122,.35);color:#00C87A}
.tag.ht{background:rgba(255,255,255,.06);color:var(--ink2)}
.tag.live{background:rgba(255,48,85,.12);border:1px solid rgba(255,48,85,.4);color:#FF3055;animation:sp 2s infinite}
.tag.timecap{background:rgba(255,176,32,.1);border:1px solid rgba(255,176,32,.35);color:var(--warn)}
.tag.pre{background:rgba(255,176,32,.1);border:1px solid rgba(255,176,32,.35);color:var(--warn)}
.tag.done,.tag.pending{background:rgba(255,255,255,.05);color:var(--ink3)}
.tag.ih{background:rgba(45,156,255,.1);border:1px solid rgba(45,156,255,.25);color:#2D9CFF;margin-left:auto}
.wod-title-row{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.wod-nom{font-family:var(--ff);font-size:clamp(22px,3.5vw,58px);line-height:1;letter-spacing:2px;color:#fff;text-transform:uppercase}
.wod-cat{font-family:var(--fc);font-weight:700;font-size:clamp(11px,1.4vw,20px);letter-spacing:.8px;color:var(--ink2)}
.mov-row{display:flex;gap:3px;flex-wrap:nowrap;overflow:hidden;margin-top:2px}
.mov-more{background:rgba(155,93,229,.18)!important;border-color:rgba(155,93,229,.4)!important}
.mov-more .mov-q{color:#C9A0FF!important}
.mov{display:inline-flex;align-items:baseline;gap:4px;padding:2px 9px;border-radius:3px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);white-space:nowrap}
.mov-q{font-family:var(--fm);font-size:clamp(15px,1.7vw,24px);font-weight:900;color:#fff}
.mov-n{font-family:var(--ff);font-size:clamp(15px,1.7vw,24px);letter-spacing:.4px;color:var(--ink2)}
.mov-p{font-size:clamp(10px,1vw,13px);color:#9B5DE5;font-weight:700}

/* Zone body : chrono haut, équipes bas */
.zone-body{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden;background:rgba(7,9,15,.92)}
/* Chrono individuel par zone */
/* chronos par zone supprimés — un seul chrono partagé en haut */
.zone-chrono{flex-shrink:0}
.zone-chrono .chrono-lbl{font-size:clamp(10px,1.1vw,18px);letter-spacing:4px;margin-bottom:1px}
.zone-chrono .chrono-val{font-size:clamp(42px,6.5vw,120px);letter-spacing:-2px}
/* TOUR X/7 affiché À CÔTÉ du gros chrono (EMOM) */
.zone-chrono .chrono-mid{display:flex;align-items:baseline;justify-content:center;gap:clamp(8px,1.4vw,22px);width:100%}
.zone-chrono .chrono-round{font-family:var(--fm);font-weight:900;font-size:clamp(15px,2vw,38px);letter-spacing:1px;color:#4ADE80;text-shadow:0 0 12px rgba(74,222,128,.45);white-space:nowrap;line-height:1}
/* Animations SOBRES travail / repos (respiration lente, agréable sur la durée) */
@keyframes chronoWork{0%,100%{opacity:1}50%{opacity:.82}}
@keyframes chronoRest{0%,100%{opacity:1}50%{opacity:.68}}
.zone-chrono.ph-work{animation:chronoWork 2s ease-in-out infinite}
.zone-chrono.ph-rest{animation:chronoRest 3.4s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.zone-chrono.ph-work,.zone-chrono.ph-rest{animation:none}}

/* Chrono — GRAND, halo lumineux dynamique selon état */
.chrono-band{
  flex-shrink:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:6px 8px 4px;background:rgba(4,7,13,.99);
  border-bottom:2px solid rgba(255,255,255,.06);position:relative;overflow:hidden
}
.chrono-band::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent 0%,rgba(255,255,255,.08) 50%,transparent 100%);
  transition:background .4s}
.chrono-band::after{content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse 60% 90% at 50% 50%,rgba(255,255,255,.05) 0%,transparent 70%);
  pointer-events:none;transition:background .4s}
.chrono-band.clr-run::before{background:linear-gradient(90deg,transparent 0%,#FFB020 50%,transparent 100%)}
.chrono-band.clr-run::after{background:radial-gradient(ellipse 60% 90% at 50% 50%,rgba(255,176,32,.20) 0%,rgba(255,176,32,.04) 45%,transparent 75%)}
.chrono-band.clr-hot::before{background:linear-gradient(90deg,transparent 0%,#FF3055 50%,transparent 100%)}
.chrono-band.clr-hot::after{background:radial-gradient(ellipse 60% 90% at 50% 50%,rgba(255,48,85,.22) 0%,rgba(255,48,85,.04) 45%,transparent 75%)}
.chrono-band.clr-ok::before{background:linear-gradient(90deg,transparent 0%,#00E5A0 50%,transparent 100%)}
.chrono-band.clr-ok::after{background:radial-gradient(ellipse 60% 90% at 50% 50%,rgba(0,229,160,.18) 0%,rgba(0,229,160,.04) 45%,transparent 75%)}
.chrono-band.clr-ih::before{background:linear-gradient(90deg,transparent 0%,#2D9CFF 50%,transparent 100%)}
.chrono-band.clr-ih::after{background:radial-gradient(ellipse 60% 90% at 50% 50%,rgba(45,156,255,.20) 0%,rgba(45,156,255,.04) 45%,transparent 75%)}
.chrono-lbl{font-family:var(--ff);font-size:clamp(11px,1.4vw,24px);letter-spacing:5px;color:var(--ink3);margin-bottom:0;position:relative;z-index:1;transition:color .3s,text-shadow .3s}
.chrono-band.clr-run .chrono-lbl{color:#FFB020;text-shadow:0 0 14px rgba(255,176,32,.5)}
.chrono-band.clr-hot .chrono-lbl{color:#FF3055;text-shadow:0 0 14px rgba(255,48,85,.5)}
.chrono-band.clr-ok .chrono-lbl{color:#00E5A0;text-shadow:0 0 14px rgba(0,229,160,.5)}
.chrono-band.clr-ih .chrono-lbl{color:#2D9CFF;text-shadow:0 0 14px rgba(45,156,255,.5)}
/* ★ Grand écran : 17vw = ~163px/col sur 1920px, cap à 420px pour 4K+ */
.chrono-val{font-family:var(--fm);font-weight:900;font-size:clamp(80px,17vw,420px);
  font-variant-numeric:tabular-nums;font-feature-settings:'tnum' 1;
  letter-spacing:-6px;line-height:1;color:#fff;position:relative;z-index:1;transition:filter .3s}
.chrono-val.run{color:#FFB020;filter:drop-shadow(0 0 32px rgba(255,176,32,.55))}
.chrono-val.hot{color:#FF3055;filter:drop-shadow(0 0 36px rgba(255,48,85,.65));animation:hf 1s infinite}
.chrono-val.warn{color:var(--warn);filter:drop-shadow(0 0 30px rgba(255,176,32,.45))}
.chrono-val.ih{color:#2D9CFF;filter:drop-shadow(0 0 32px rgba(45,156,255,.55))}
.chrono-val.coup{color:var(--warn);filter:drop-shadow(0 0 30px rgba(255,176,32,.5))}
.chrono-val.fin{color:#00E5A0;filter:drop-shadow(0 0 30px rgba(0,229,160,.5))}
.chrono-val.idle{color:var(--ink3)}

/* Teams band */
.attempts{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px;padding-top:6px;border-top:1px solid rgba(255,255,255,.06);align-items:center}
.att-lbl{font-size:.5em;font-weight:900;letter-spacing:1px;color:#5a6a80;text-transform:uppercase;margin-right:2px}
.att{font-family:var(--fm);font-size:.85em;font-weight:700;padding:1px 7px;border-radius:5px;letter-spacing:.5px;white-space:nowrap}
.att.ok{background:rgba(0,229,160,.12);color:#00E5A0;border:1px solid rgba(0,229,160,.3)}
.att.best{background:rgba(0,229,160,.22);color:#00E5A0;border:1px solid #00E5A0}
.att.fail{background:rgba(255,59,92,.1);color:#FF5A6E;border:1px solid rgba(255,59,92,.28);text-decoration:line-through;text-decoration-thickness:2px}
.livecat-sep{display:flex;align-items:center;gap:10px;margin:4px 0 8px}
.livecat-lbl{font-family:var(--fm,sans-serif);font-size:clamp(13px,1.6vw,20px);font-weight:700;letter-spacing:1.5px;text-transform:uppercase;display:flex;align-items:center;gap:7px;white-space:nowrap}
.livecat-dot{width:11px;height:11px;border-radius:50%;flex-shrink:0;display:inline-block}
.livecat-line{flex:1;height:2px;border-radius:2px}
.teams-band{flex:1;min-height:0;overflow-y:auto;padding:6px 10px 8px;display:flex;flex-direction:column;gap:4px}
.teams-band::-webkit-scrollbar{width:3px}
.teams-band::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:99px}

/* Preview prochain heat — halo stable, fini le clignotement */
.preview-hdr{flex-shrink:0;padding:14px 18px;
  background:linear-gradient(135deg,rgba(45,156,255,.12) 0%,rgba(45,156,255,.03) 100%);
  border:2px solid rgba(45,156,255,.4);border-radius:10px;
  margin-bottom:6px;font-family:var(--ff);font-size:clamp(20px,2.8vw,42px);
  letter-spacing:5px;color:#fff;text-align:center;
  box-shadow:0 0 30px rgba(45,156,255,.15),inset 0 0 20px rgba(45,156,255,.04);
  text-shadow:0 0 18px rgba(45,156,255,.5)}

/* Cartes équipes */
.tc{flex-shrink:0;padding:6px 12px;border-radius:8px;
  border:1px solid rgba(255,255,255,.07);background:rgba(12,18,30,.9);transition:border-color .3s,background .3s}
.tc.ok{border-color:rgba(0,229,160,.25);background:rgba(0,229,160,.05)}
.tm{display:flex;align-items:center;gap:12px}
.tcol{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.tmeta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:4px}
.rk{font-family:var(--ff);font-size:clamp(22px,3vw,52px);line-height:1;min-width:40px;text-align:center;color:var(--gold)}
.rk.r1{color:#FFD700}.rk.r2{color:#C0C0C0}.rk.r3{color:#CD7F32}
.tn{font-family:var(--ff);font-size:clamp(18px,2.8vw,46px);letter-spacing:.5px;color:#fff;
  flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tsc{font-family:var(--fm);font-size:clamp(14px,2.2vw,36px);font-weight:900;text-align:right;flex-shrink:0}
.tsc.lv{color:#FFB020}.tsc.vl{color:#00E5A0}.tsc.nd{color:var(--ink3)}
.crown{display:inline-block;font-size:clamp(20px,2.6vw,38px);margin-left:6px;vertical-align:middle;
  filter:drop-shadow(0 0 8px rgba(255,209,102,.6))}
.mini{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:4px;
  font-family:var(--fm);font-size:clamp(12px,1.4vw,20px);font-weight:700;
  border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.03);color:var(--ink2)}
.mini.gap{color:#FFB020;border-color:rgba(255,176,32,.22);background:rgba(255,176,32,.08)}
.mini.lead{color:#00E5A0;border-color:rgba(0,229,160,.22);background:rgba(0,229,160,.08)}
.mini.eta{color:#7FB8E0;border-color:rgba(77,166,255,.22);background:rgba(77,166,255,.08)}
.mini.eta.ok{color:#00E5A0;border-color:rgba(0,229,160,.22);background:rgba(0,229,160,.08)}
.mini.eta.warn{color:#FFB020;border-color:rgba(255,176,32,.22);background:rgba(255,176,32,.08)}
.mini.eta.err{color:#FF3055;border-color:rgba(255,48,85,.22);background:rgba(255,48,85,.08)}
.pbar{display:none}
.chips{display:flex;gap:3px;flex-wrap:wrap;margin-top:5px}
.chip{padding:3px 8px;border-radius:4px;font-size:clamp(10px,1.2vw,16px);font-family:var(--fm);font-weight:700;
  border:1px solid rgba(255,255,255,.07);background:rgba(255,255,255,.03);color:var(--ink3);transition:all .2s}
.chip.d{background:rgba(0,229,160,.08);border-color:rgba(0,229,160,.25);color:#00E5A0}
.chip.a{background:rgba(255,176,32,.08);border-color:rgba(255,176,32,.25);color:#FFB020}
.fs-btn{white-space:nowrap}
.zone-idle{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(7,9,15,.9)}
.idle-z{font-family:var(--ff);font-size:clamp(60px,10vw,160px);letter-spacing:8px;color:rgba(255,255,255,.04)}
.idle-lb{font-family:var(--ff);font-size:clamp(12px,1.5vw,22px);letter-spacing:4px;color:var(--ink3)}
/* ★ Logo tournant IH */
@keyframes spin3D{
  0%   { transform:rotateY(0deg)   scale(1);    }
  25%  { transform:rotateY(90deg)  scale(1.06); }
  50%  { transform:rotateY(180deg) scale(1.12); }
  75%  { transform:rotateY(270deg) scale(1.06); }
  100% { transform:rotateY(360deg) scale(1);    }
}
@keyframes logoGlow{
  0%,100%{ filter:drop-shadow(0 0 18px rgba(255,140,50,.55)) drop-shadow(0 0 44px rgba(255,90,20,.28)); }
  50%    { filter:drop-shadow(0 0 38px rgba(255,210,80,.95)) drop-shadow(0 0 80px rgba(255,130,40,.60)); }
}
.logo-spin{
  /* animation retirée — logo fixe */
}
  transform-style:preserve-3d;
  display:inline-block;
}
.pod-overlay{display:none;position:absolute;inset:0;z-index:200;background:rgba(5,7,12,.97);
  overflow-y:auto;padding:22px;flex-direction:column;gap:10px;align-items:stretch}
.pod-overlay.on{display:flex}
#morning-cd{display:none;position:fixed;inset:0;z-index:300;
  background:rgba(5,7,12,.97);flex-direction:column;align-items:center;justify-content:center;gap:16px}
#morning-cd.on{display:flex}
.mcd-lbl{font-family:var(--ff);font-size:clamp(14px,2vw,26px);letter-spacing:6px;color:var(--ink2)}
.mcd-val{font-family:var(--fm);font-weight:900;font-size:clamp(80px,20vw,300px);
  letter-spacing:-4px;line-height:1;color:#fff;transition:color .3s}
.mcd-val.warn{color:#FFB020}.mcd-val.hot{color:#FF3055;animation:hf 1s infinite}.mcd-val.go{color:#00E5A0}
.mcd-sub{font-family:var(--ff);font-size:clamp(12px,1.5vw,20px);letter-spacing:3px;color:var(--ink3)}

/* ════════════════════════════════════════════════════════════════════
   ✦ CLASSEMENT GÉNÉRAL — version colorée (moins triste)
   ════════════════════════════════════════════════════════════════════ */
/* Titre dégradé animé or → orange → bleu */
.gen-title{
  background:linear-gradient(90deg,#FFD166,#FF8A00,#FF5722,#FFD166);
  background-size:200% auto;
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  animation:gen-shine 5s linear infinite;
  text-shadow:none;filter:drop-shadow(0 0 22px rgba(255,138,0,.35))
}
@keyframes gen-shine{0%{background-position:0% center}100%{background-position:200% center}}
.gen-sub{color:#9DD4FF;letter-spacing:4px;text-shadow:0 0 14px rgba(45,156,255,.3)}

/* Lignes du classement général : fond plus vivant + accent coloré par rang */
.gen-row{
  border-left-width:5px;
  background:linear-gradient(90deg,rgba(45,156,255,.06) 0%,rgba(155,93,229,.03) 55%,rgba(255,255,255,.01) 100%)
}
/* Or / Argent / Bronze gardent leur couleur (définie par .r1/.r2/.r3 plus haut),
   mais on enrichit le fond pour plus de punch */
.gen-row.r1{
  background:linear-gradient(90deg,rgba(255,209,102,.22) 0%,rgba(255,138,0,.06) 60%,transparent 100%);
  box-shadow:0 0 26px rgba(255,209,102,.16),inset 0 0 0 1px rgba(255,209,102,.10)
}
.gen-row.r2{
  background:linear-gradient(90deg,rgba(196,203,216,.18) 0%,rgba(196,203,216,.04) 60%,transparent 100%)
}
.gen-row.r3{
  background:linear-gradient(90deg,rgba(205,127,50,.18) 0%,rgba(205,127,50,.04) 60%,transparent 100%)
}
/* Rangs 4+ : accent bleu/violet alterné au lieu du gris terne */
.gen-row:not(.r1):not(.r2):not(.r3):nth-of-type(odd){border-left-color:#2D9CFF}
.gen-row:not(.r1):not(.r2):not(.r3):nth-of-type(even){border-left-color:#9B5DE5}
.gen-row:not(.r1):not(.r2):not(.r3) .p-rk{color:#5BB6FF}
/* Points : pastille colorée pour le top 3 */
.gen-row.r1 .p-pts{color:#FFD166;text-shadow:0 0 14px rgba(255,209,102,.5)}
.gen-row.r2 .p-pts{color:#E2E8F2}
.gen-row.r3 .p-pts{color:#F0A862}
.gen-row .p-nm{color:#F2F6FC}

/* ═══════════════════════════════════════════════════════════════════════
   ✦  EFFET WAHOU PUBLIC  — animations purement décoratives, aucune logique
   ═══════════════════════════════════════════════════════════════════════ */

/* 1. Entrée des cartes équipes
   ★ DÉSACTIVÉ pendant le live : la teams-band est rerendue à chaque rep
     poussée par Firebase. L'animation d'entrée se relançait donc à chaque
     update, créant un flash continu. On garde uniquement pour les écrans
     statiques (preview du prochain heat, résultats figés). */
@keyframes wow-card-in{
  0%  {opacity:0;transform:translateY(14px) scale(.985);filter:blur(4px)}
  60% {opacity:1;filter:blur(0)}
  100%{opacity:1;transform:translateY(0) scale(1);filter:blur(0)}
}
/* ON N'ANIME PAS les cartes pendant le live (statut 'live', 'pre', 'timecap')
   pour éviter le flash à chaque rep. L'animation reste disponible si tu
   veux la réactiver ailleurs via la classe .anim-in. */
.teams-band .tc.anim-in{animation:wow-card-in .55s cubic-bezier(.2,.85,.2,1.05) both}

/* 2. Glow respirant du leader (1er du classement dynamique) -----------
   ★ GPU-friendly : on utilise un ::before en opacity au lieu d'animer
     box-shadow (qui force un repaint à chaque frame). Le chrono reste
     fluide même sur device modeste. */
.tc.lead{
  position:relative;
  border-color:rgba(0,229,160,.55) !important;
  background:linear-gradient(90deg,rgba(0,229,160,.10),rgba(0,229,160,.02) 70%) !important;
  box-shadow:0 0 0 1px rgba(0,229,160,.30),0 0 22px rgba(0,229,160,.18)
}
.tc.lead::before{
  content:'';position:absolute;inset:-2px;border-radius:9px;pointer-events:none;
  box-shadow:0 0 0 1px rgba(0,229,160,.55),0 0 44px rgba(0,229,160,.45);
  opacity:0;
  animation:wow-leader-pulse 2.6s ease-in-out infinite
}
@keyframes wow-leader-pulse{
  0%,100%{opacity:0}
  50%    {opacity:1}
}
/* Barre dorée scintillante en pied de carte leader */
.tc.lead::after{
  content:'';position:absolute;left:8%;right:8%;bottom:-1px;height:2px;
  background:linear-gradient(90deg,transparent,rgba(255,209,102,.0) 10%,#FFD166 50%,rgba(255,209,102,0) 90%,transparent);
  filter:drop-shadow(0 0 6px rgba(255,209,102,.7));
  animation:wow-leader-sweep 3.2s ease-in-out infinite;
  pointer-events:none
}
@keyframes wow-leader-sweep{
  0%,100%{opacity:.3;transform:scaleX(.85)}
  50%    {opacity:1;transform:scaleX(1)}
}

/* 3. Médailles podium (heat done) : sweep doré --------------------------*/
.rk.final{position:relative;display:inline-block}
.rk.final::before{
  content:'';position:absolute;inset:-6px -10px;border-radius:50%;
  background:radial-gradient(circle at 50% 50%,rgba(255,209,102,.35),transparent 70%);
  filter:blur(6px);z-index:-1;
  animation:wow-medal-glow 2.2s ease-in-out infinite
}
@keyframes wow-medal-glow{
  0%,100%{opacity:.55;transform:scale(.92)}
  50%    {opacity:1;transform:scale(1.06)}
}
.rk.final.r1{text-shadow:0 0 12px rgba(255,215,0,.7),0 0 24px rgba(255,176,32,.45)}
.rk.final.r2{text-shadow:0 0 10px rgba(220,225,235,.55),0 0 20px rgba(192,192,192,.35)}
.rk.final.r3{text-shadow:0 0 10px rgba(255,138,0,.5),0 0 18px rgba(205,127,50,.35)}

/* 4. Rang dynamique (live) : badge propre, sans paillette ------------- */
.rk.dyn{
  font-family:var(--fm) !important;font-weight:900;
  font-size:clamp(20px,2.6vw,42px);
  background:linear-gradient(135deg,rgba(255,255,255,.08),rgba(255,255,255,.02));
  border:1px solid rgba(255,255,255,.10);
  border-radius:8px;padding:2px 0;min-width:42px;
}
.rk.dyn.r1{color:#00E5A0;border-color:rgba(0,229,160,.45);background:linear-gradient(135deg,rgba(0,229,160,.18),rgba(0,229,160,.04))}
.rk.dyn.r2{color:#FFD166;border-color:rgba(255,209,102,.35);background:linear-gradient(135deg,rgba(255,209,102,.14),rgba(255,209,102,.03))}
.rk.dyn.r3{color:#FFB020;border-color:rgba(255,176,32,.30);background:linear-gradient(135deg,rgba(255,176,32,.12),rgba(255,176,32,.03))}

/* 5. Transition phase header — léger fondu quand le header est réécrit  */
.wod-hdr{transition:background .5s ease,border-color .5s ease}
@keyframes wow-hdr-flash{
  0%  {background:rgba(45,156,255,.18)}
  100%{background:rgba(10,15,24,.97)}
}
.wod-hdr.is-next{animation:wow-hdr-flash .9s ease-out 1;border-bottom-color:rgba(45,156,255,.35) !important}
/* Titre WOD du prochain heat : juste une teinte bleutée stable, pas de shimmer */
.wod-hdr.is-next .wod-nom{color:#9DD4FF;text-shadow:0 0 12px rgba(45,156,255,.35)}
.wod-hdr.is-done .wod-nom{color:#fff}

/* 6. Cartes "prochain heat" : entrée latérale stylée ------------------- */
@keyframes wow-next-slide{
  0%  {opacity:0;transform:translateX(-22px)}
  100%{opacity:1;transform:translateX(0)}
}
.tc.next-team{animation:wow-next-slide .5s cubic-bezier(.2,.85,.2,1.05) both}
.tc.next-team:nth-child(2){animation-delay:.06s}
.tc.next-team:nth-child(3){animation-delay:.12s}
.tc.next-team:nth-child(4){animation-delay:.18s}
.tc.next-team:nth-child(5){animation-delay:.24s}
.tc.next-team:nth-child(6){animation-delay:.30s}

/* 7. Preview header (PROCHAIN HEAT en grand) : halo stable, pas de pulse */
.preview-hdr{box-shadow:0 0 30px rgba(45,156,255,.20),inset 0 0 22px rgba(45,156,255,.06)}

/* 8. Fond ambient subtil de la zone-body : aurore très lente -----------*/
.zone-body{position:relative;overflow:hidden}
.zone-body::before{
  content:'';position:absolute;inset:-20% -20% -20% -20%;z-index:0;pointer-events:none;
  background:
    radial-gradient(40% 30% at 20% 20%,rgba(255,87,34,.07),transparent 60%),
    radial-gradient(35% 28% at 80% 10%,rgba(45,156,255,.06),transparent 60%),
    radial-gradient(45% 35% at 50% 100%,rgba(155,93,229,.05),transparent 65%);

  animation:wow-aurora 22s ease-in-out infinite alternate;
  filter:blur(20px);
}
@keyframes wow-aurora{
  0%  {transform:translate(0,0) scale(1)}
  100%{transform:translate(2%,1%) scale(1.05)}
}
.zone-body > *{position:relative;z-index:1}

/* 9. Score "live" (non validé) : style stable, pas de pulse
   ★ Le pulse opacity se réinitialisait à chaque rerender Firebase (à chaque
     +REP), ce qui produisait un flash erratique. On garde juste la couleur. */
.tsc.lv{position:relative}

/* 10. Score validé : pas d'animation à chaque rep — juste un style stable
   ★ Avant : la carte flashait en vert à chaque +REP poussé par Firebase, ce
     qui faisait clignoter en permanence pendant un heat actif. Maintenant on
     garde juste le style "ok" (fond vert subtil) sans animation déclenchée. */
.tc.ok{
  /* Le style ok est déjà défini plus haut via background:rgba(0,229,160,.05) etc.
     On NEUTRALISE ici l'animation héritée de .teams-band .tc (.55s d'entrée)
     pour éviter qu'à chaque rerender (qui se produit à chaque rep), la carte
     se ré-anime. La carte garde son style stable. */
  animation:none !important
}

/* 11. Réduction des animations pour les utilisateurs sensibles --------- */
@media (prefers-reduced-motion:reduce){
  .teams-band .tc,.tc.next-team,.tc.lead,.rk.final::before,
  .preview-hdr,.tsc.lv,.wod-hdr.is-next .wod-nom,.zone-body::before,.tc.ok{
    animation:none !important
  }
  .tc.lead{box-shadow:0 0 0 1px rgba(0,229,160,.4)}
}
</style>
</head>

function p2(n){return n<10?'0'+n:String(n);}
function fmt(s){s=Math.max(0,Math.floor(s||0));return Math.floor(s/60)+':'+p2(s%60);}
// Chrono fluide : centièmes durant les 10 dernières secondes d'un countdown
function fmtPrecise(secFloat, showCenti){
  if(!isFinite(secFloat) || secFloat==null) return '--:--';
  var s = Math.max(0, secFloat);
  if(showCenti && s < 10){
    var whole = Math.floor(s);
    var cent = Math.floor((s - whole) * 100);
    if(cent<10) cent='0'+cent;
    return whole + '.' + cent;
  }
  var si = Math.floor(s);
  return Math.floor(si/60) + ':' + p2(si%60);
}
function esc(s){return s?String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'):''}
function scoreStr(sc,w){
  if(!sc)return '0';
  var sf=(w.scoreFinale||w.scoreType||'').toLowerCase(),jm=(w.judgeMode||'').toLowerCase();
  var isT=(w.wodFormat||'').toLowerCase()==='fortime'||sf==='time';
  if(jm==='maxload'||sf==='load') return (sc.load||0)+' kg';
  if(jm==='ergo'||sf==='dist'||sf==='cal') return (parseFloat(sc.dist||sc.ergoVal||sc.distance)||0)+(sf==='cal'?' cal':(' '+(sc.ergoUnit||'m')));
  if(isT){                                     // ★ CAP + reps : le public voit le travail accompli
    if(sc.finalTime>0) return fmt(sc.finalTime);
    var _r=parseInt(sc.reps||0,10)||0;
    return _r>0 ? 'CAP · '+_r+' reps' : 'CAP';
  }
  return (sc.reps||0)+' reps';
}
function scoreVal(sc,w){
  if(!sc)return 0;
  var sf=(w.scoreFinale||w.scoreType||'').toLowerCase(),jm=(w.judgeMode||'').toLowerCase();
  var isT=(w.wodFormat||'').toLowerCase()==='fortime'||sf==='time';
  if(jm==='maxload'||sf==='load') return parseFloat(sc.load)||0;
  if(jm==='ergo'||sf==='dist'||sf==='cal') return parseFloat(sc.dist||sc.ergoVal||sc.distance)||0;
  if(isT) return sc.finalTime>0?(1000000-sc.finalTime):(parseInt(sc.reps)||0);
  return parseInt(sc.reps)||0;
}
function getSc(hid,h,ln){
  var hS=(HEATS[hid]&&HEATS[hid].scores)||h.scores||{};
  var lnS=String(ln), lnI=parseInt(ln)||0;
  // Chercher dans HEATS scores d'abord
  var sc=hS[lnS]||hS[lnI]||hS[ln]||null;
  if(sc) return sc;
  // Chercher dans SCORES avec le hid exact (string)
  sc=SCORES[hid+'_'+lnS]||SCORES[hid+'_'+lnI]||null;
  if(sc) return sc;
  // Fallback numérique
  var n=parseInt(String(hid).replace(/\D/g,''))||0;
  return SCORES[n+'_'+lnS]||SCORES[n+'_'+lnI]||{};
}

// ════ HEAT ACTIF ════
function getHeat(zone){
  var zs=ZSYNC['z'+zone]||ZSYNC[String(zone)]||null;
  if(zs){
    // Priorité : currentHeatId si heat encore actif (live/pre/timecap)
    // Si done → ignorer ZSYNC et laisser le fallback trouver le prochain
    var pref=[zs.currentHeatId,zs.displayHeatId,zs.selectedHeatId].filter(Boolean);
    for(var i=0;i<pref.length;i++){
      var ph=HEATS[pref[i]];
      if(!ph) continue;
      var phz=(parseInt(ph.catZone!=null?ph.catZone:ph.zone)||1);
      if(phz!==zone) continue;
      var phs=ph.status||'pending';
      // Ne pas rester bloqué sur un heat done — passer au fallback
      if(phs==='done') continue;
      return{id:pref[i],h:ph};
    }
    // nextHeatId depuis ZSYNC si le heat courant est done
    if(zs.nextHeatId && HEATS[zs.nextHeatId]){
      var nh=HEATS[zs.nextHeatId];
      var nhz=(parseInt(nh.catZone!=null?nh.catZone:nh.zone)||1);
      if(nhz===zone) return{id:zs.nextHeatId,h:nh};
    }
  }
  // Fallback : trouver le meilleur heat par statut puis par numéro (le plus petit = le prochain)
  var best=null,bp=99,bn=999999;
  var P={live:0,timecap:1,pre:2,pending:3,done:9};
  Object.keys(HEATS).forEach(function(hid){
    var h=HEATS[hid];if(!h)return;
    if((parseInt(h.catZone!=null?h.catZone:h.zone)||1)!==zone)return;
    var p=P[h.status]!=null?P[h.status]:99;
    var n=parseInt(String(hid).replace(/\D/g,''))||0;
    // Priorité statut, puis le plus petit numéro (prochain dans l'ordre)
    if(p<bp||(p===bp&&n<bn)){bp=p;bn=n;best=hid;}
  });
  return best?{id:best,h:HEATS[best]}:null;
}
function getNext(zone){
  var zs=ZSYNC['z'+zone]||null;
  if(zs&&zs.nextHeatId&&HEATS[zs.nextHeatId]){
    var _zn=HEATS[zs.nextHeatId];
    // ★ N'accepter le pointeur ZSYNC que s'il désigne un heat réellement À VENIR.
    //   Un nextHeatId momentanément périmé (latence Firebase) pointant sur un heat
    //   déjà fini/en cours ferait afficher « l'équipe qui vient de passer » dans la
    //   preview du prochain heat. On vérifie donc statut ET zone avant de le suivre.
    var _znz=(parseInt(_zn.catZone!=null?_zn.catZone:_zn.zone)||1);
    if((_zn.status==='pending'||_zn.status==='pre')&&_znz===zone){
      return{id:zs.nextHeatId,h:_zn};
    }
  }
  var best=null,bn=0;
  Object.keys(HEATS).forEach(function(hid){
    var h=HEATS[hid];if(!h)return;
    if((parseInt(h.catZone!=null?h.catZone:h.zone)||1)!==zone)return;
    if(h.status!=='pending'&&h.status!=='pre')return;
    var n=parseInt(String(hid).replace(/\D/g,''))||0;
    if(n>bn){bn=n;best=hid;}
  });
  return best?{id:best,h:HEATS[best]}:null;
}

// ════ CAP — identique à tk9delta.wodCapSec ════
function wodCapSec(w){
  w=w||{};
  // Merger avec WD (wods/ Firebase) si duree absent
  var wid=w.id!=null?String(w.id):'';
  if(wid&&WD[wid]){
    var lv=WD[wid];
    if(!(parseInt(w.duree||0,10)>0)&&lv.duree>0) w=Object.assign({},w,{duree:lv.duree,capSec:lv.capSec||lv.duree,capMinutes:lv.capMinutes||0,workMin:lv.workMin||0});
  }
  // ★ FIX EMOM 1 TOUR (comme le juge) : cap EMOM = durée d'un tour × nb tours (+ repos).
  //   Ne pas se fier à duree (peut valoir 1 tour au lieu de 7) → chrono s'arrêtait tôt.
  var _fmtC=String(w.wodFormat||w.format||'').toLowerCase();
  if(_fmtC==='emom'||_fmtC==='interval'||_fmtC==='tabata'){
    var _wk=parseInt(w.workMin||w.emomWork||60,10)||60;
    var _rst=parseInt(w.restMin||w.emomRest||0,10)||0;
    var _nbT=parseInt(w.rounds||w.toursCount||w.emomRounds||0,10)||0;
    if(_nbT<=0 && Array.isArray(w.toursPerso)) _nbT=w.toursPerso.length;
    if(_nbT<=0) _nbT=1;
    return (_wk+_rst)*_nbT;
  }
  var sec=parseInt(w.duree||w.capSec||w.capSeconds||w.durationSec||0,10)||0;
  if(sec>0)return sec;
  var cm=parseInt(w.capMinutes||0,10)||0;
  if(cm>0)return cm*60;
  var wv=parseInt(w.workMin||0,10)||0;
  if(wv>0)return wv>300?wv:wv*60;
  return 0;
}
function mergeLiveWodConfig(h,w){
  w=w||{};
  var wodId=w.id!=null?String(w.id):(h&&h.wodId!=null?String(h.wodId):'');
  if(wodId&&WD[wodId]){
    var live=WD[wodId];
    w=Object.assign({},w);
    if(live.duree>0) w.duree=live.duree;
    if(live.capSec>0) w.capSec=live.capSec;
    if(live.capMinutes>0) w.capMinutes=live.capMinutes;
    if(live.workMin>0) w.workMin=live.workMin;
    if(live.wodFormat) w.wodFormat=live.wodFormat;
    if(live.type) w.type=live.type;
    if(live.scoreFinale) w.scoreFinale=live.scoreFinale;
    if(live.scoreType) w.scoreType=live.scoreType;
    if(live.rounds>0) w.rounds=live.rounds;
    if(live.pauseEntreToursActive!=null) w.pauseEntreToursActive=live.pauseEntreToursActive;
    if(live.pauseEntreToursSec>0) w.pauseEntreToursSec=live.pauseEntreToursSec;
  }
  return w;
}
function getZoneSyncStartTs(zone,hid){
  var zs=ZSYNC['z'+zone]||ZSYNC[String(zone)]||null;
  if(!zs||!zs.startTimestamp) return 0;
  var matches=[
    zs.displayHeatId,
    zs.currentHeatId,
    zs.selectedHeatId,
    zs.nextHeatId
  ].filter(Boolean);
  return matches.indexOf(hid)>=0 ? zs.startTimestamp : 0;
}

  w=mergeLiveWodConfig(h,w);

    return null;
  }
  // ★ FLUIDE : on garde elapsed en flottant pour les centièmes
  var elapsedF=Math.max(0,(now()-ts)/1000);
  var elapsed=Math.floor(elapsedF);
  // ★ FIX SYNC LIVE/TK : pour aligner exactement l'affichage entier avec le TK,
  // on calcule le temps restant à partir de `elapsed` (entier) et non `elapsedF`.
  // Sinon Math.floor(cap - elapsedF) = cap - ceil(elapsedF) → 1s d'avance permanente.
  // Le TK fait `cap - floor(elapsedF)` ; on s'aligne sur cette convention.
  var totalRounds=parseInt(w.rounds||1,10)||1;
  var hasPause=!!w.pauseEntreToursActive&&totalRounds>1;
  var pauseSec=parseInt(w.pauseEntreToursSec||0,10)||0;
  // ★ FIX EMOM DÉCOUPAGE LIVE : un EMOM se découpe TOUJOURS par tour (avec le travail
  //   et le repos de chaque tour), même sans pause entre tours. Sans ça, le live
  //   affichait un décompte global (ex 6:45) au lieu de "R2/7 · minute qui tourne".
  var _isEmomLive=(type==='emom'||type==='interval'||type==='tabata');
  var _emWork=parseInt(w.workMin||w.emomWork||60,10)||60;
  var _emRest=parseInt(w.restMin||w.emomRest||0,10)||0;
  // ★ FIX CHRONO FOR TIME (même fix que le TK) : ne découper le chrono en
  //   tours que si une pause entre tours est configurée. Un For Time « 9 min,
  //   5 tours » est UN seul chrono de 9 min, pas 5 blocs de 1min48.
  if((hasPause||_isEmomLive)&&totalRounds>1&&cap>0){
    // EMOM : travail + repos par tour. Sinon (For Time avec pause) : découpe uniforme.
    var workSec=_isEmomLive?_emWork:Math.max(1,Math.round(cap/totalRounds));
    var _thisPause=_isEmomLive?_emRest:(hasPause?pauseSec:0);
    var cycleSec=workSec+_thisPause;
    var cycleElapsed=elapsed%cycleSec;          // ★ entier (aligné TK)
    var isInPause=_thisPause>0&&cycleElapsed>=workSec;
    var remInPhase=isInPause?(cycleSec-cycleElapsed):(workSec-cycleElapsed);
    if(remInPhase<0) remInPhase=0;
    var curRound=Math.min(totalRounds,Math.floor(elapsed/cycleSec)+1);
    // ★ FIN d'un EMOM = tous les tours accomplis, REPOS du dernier tour inclus.
    //   EMOM → tours×cycle (le dernier repos passe avant l'inter-heat) ;
    //   intervalles à pause classique → (tours−1)×cycle+travail (inchangé).
    var _emTotal=_isEmomLive?(totalRounds*cycleSec):((totalRounds-1)*cycleSec+workSec);
    return {
      ts:ts,
      cap:cap,
      elapsed:elapsed,
      isFortime:isFortime,
      ended:(_emTotal>0 && elapsed>=_emTotal),
      value:fmtPrecise(remInPhase, false),
      lbl:(isInPause?'💤 REPOS':'⚙️ TRAVAIL'),
      round:curRound+'/'+totalRounds,
      phase:isInPause?'rest':'work',
      vcls:isInPause?'ih':(remInPhase<=10?'hot':remInPhase<=30?'warn':'run'),
      bcls:isInPause?'clr-ih':(remInPhase<=10?'clr-hot':'clr-run')
    };
  }
  if(isFortime){
    // ★ FOR TIME = chrono MONTANT (le temps EST le score), aligné sur le TK.
    //   Gros chiffre = temps écoulé qui monte ; le cap passe dans le label
    //   ("⏱ CAP 9:00") pour rester lisible sans surcharger le grand chiffre.
    //   Rouge dans la dernière minute. `ended` déclenche le passage à FIN.
    var remFt=cap>0?Math.max(0,cap-elapsed):0;
    var endedFt=(cap>0&&elapsed>=cap);
    var hotFt=cap>0&&remFt<=60;   // dernière minute → rouge
    return {
      ts:ts,
      cap:cap,
      elapsed:elapsed,
      isFortime:true,
      ended:endedFt,
      value:fmtPrecise(elapsed, false),
      lbl: cap>0 ? ('⏱ CAP '+fmt(cap)) : '⏱ FOR TIME',
      vcls:hotFt?'hot':'run',
      bcls:hotFt?'clr-hot':'clr-run'
    };
  }
  var rem=cap>0?Math.max(0,cap-elapsed):elapsed;  // ★ entier (aligné TK)
  return {
    ts:ts,
    cap:cap,
    elapsed:elapsed,
    isFortime:false,
    value: cap>0 ? fmtPrecise(rem, false) : fmt(elapsed),
    vcls:(cap>0&&rem<=30)?'hot':(cap>0&&rem<=60)?'warn':'run',
    bcls:(cap>0&&rem<=30)?'clr-hot':'clr-run'
  };
}
// ════ CHRONO — jamais vide ════
function stopClock(z){if(_iv[z]){clearInterval(_iv[z]);_iv[z]=null;}_ivKey[z]=null;}
function setHold(z,txt,lbl,vcls,bcls,ms){
  _hold[z]={txt:txt,lbl:lbl,vcls:vcls,bcls:bcls,until:now()+(ms||400)};
}
function applyHold(z){
  var h=_hold[z];
  if(!h) return false;
  if(h.until<=now()){ _hold[z]=null; return false; }
  applyC(z,h.txt,h.vcls,h.lbl,h.bcls);
  return true;
}
// ════ CHRONO PARTAGÉ — piloté directement par les données TK ════
// Un seul intervalle dédié lit CD, IH, startTimestamp de Z1 (fallback Z2).
// applyC() des zones ne touche plus au DOM du chrono central.

var _scIv=null; // intervalle unique du chrono partagé

function getZoneClockState(zone){
  var cd=CD[String(zone)];
  var ih=IH[String(zone)];
  var d=getHeat(zone);

  // 1. Countdown départ
  if(cd&&cd.active&&cd.target>now()){
    var rem=Math.max(0,Math.ceil((cd.target-now())/1000));
    return{val:rem>0?String(rem):'GO !',vcls:rem<=3?'hot':rem<=5?'warn':'run',lbl:'🔔 DÉPART',bcls:'clr-run'};
  }

  // 2. Inter-heat / coupure — indépendant par zone
  if(ih&&ih.active&&ih.target>now()){
    var raw=Math.ceil((ih.target-now())/1000);
    var coup=(ih.ihType||'')==='coupure';
    if(raw>0) return{val:fmt(raw),vcls:coup?'coup':'ih',lbl:coup?'✂️ COUPURE':'⏳ INTER-HEAT',bcls:'clr-ih'};
  }

  // 3. Heat actif
  if(!d) return{val:'--:--',vcls:'idle',lbl:'⌛ EN ATTENTE',bcls:''};
  var h=d.h,hid=d.id,w=h.wodInfo||{};
  var st=h.status||'pending';
  var frame=getLiveChronoFrame(zone,hid,h,w);

  // ★ FIX FLASH DÉMARRAGE : en 'pre', afficher la valeur de DÉPART selon le
  //   format (et non le temps total). Ainsi le passage 'pre'→'live' est continu,
  //   plus de flash du total (pause comprise) au lancement.
  //   For Time → 0:00 (montant) · EMOM → 1ère minute · AMRAP → total (il décompte de là).
  if(st==='pre'){
    var _wPre=h.wodInfo||{};
    var _capPre=wodCapSec(_wPre);
    var _fmtPre=String(_wPre.wodFormat||_wPre.type||'').toLowerCase();
    var _sfPre=String(_wPre.scoreFinale||_wPre.scoreType||'').toLowerCase();
    var _valPre;
    if(_fmtPre==='emom'||_fmtPre==='interval'||_fmtPre==='tabata'){
      var _wkPre=parseInt(_wPre.workMin||_wPre.emomWork||60,10)||60;
      _valPre=fmt(_wkPre);                       // première minute de travail
    } else if(_fmtPre==='fortime'||_sfPre==='time'){
      _valPre='0:00';                            // For Time part de 0 (montant)
    } else {
      _valPre=_capPre>0?fmt(_capPre):'0:00';     // AMRAP : décompte depuis le total
    }
    return{val:_valPre,vcls:'warn',lbl:'🔔 PRÊT',bcls:''};
  }

  // ★ FIX FLUIDITÉ ZÉRO PAUSE — Helper : si on est en fin de heat (chrono à 0:00
  // ou status timecap/done) et qu'un IH/coupure est attendu, calculer son
  // décompte LOCALEMENT à partir du startTimestamp + cap + delay. Ça évite que
  // live affiche "0:00 TIMECAP" puis "0:00 TERMINÉ" en attendant que l'IH
  // Firebase arrive (ce qui prend 1-3s et est la VRAIE cause du 0:00 figé).
  function _localIhFrame(){
    var w2=h.wodInfo||{};
    // Merger avec la config live (au cas où interHeat aurait été modifié dans WD)
    try{ w2=mergeLiveWodConfig(h,w2); }catch(e){}
    var capL=wodCapSec(w2);
    var ihL=parseInt(w2.interHeat,10)||0;
    var cpL=parseInt(w2.coupureApres,10)||0;
    // ★ FIX FLASH COUPURE : la VRAIE règle du TK est « coupure UNIQUEMENT si
    //   le heat suivant appartient à un AUTRE WOD » (fin de tous les heats du
    //   WOD). L'ancienne version locale affichait ✂️ COUPURE dès que
    //   coupureApres>0, à CHAQUE fin de heat — d'où le flash d'une demi-seconde
    //   avant que l'inter-heat publié par le TK ne le remplace.
    var isCoup=false;
    try{
      var _nx=getNext(zone);
      var _nxWod=_nx&&_nx.h&&_nx.h.wodInfo&&_nx.h.wodInfo.nom||null;
      var _curWod=w2.nom||null;
      isCoup=(cpL>0 && _curWod && _nxWod && String(_nxWod)!==String(_curWod));
    }catch(e){ isCoup=false; }
    var delayL=(isCoup?cpL:ihL);
    var stL=parseInt(h.startTimestamp,10)||0;
    if(stL>0 && capL>0 && delayL>0){
      var endL=stL+capL*1000+delayL*1000;
      var remL=Math.max(0,Math.ceil((endL-now())/1000));
      if(remL>0){
        return{
          val:fmt(remL),
          vcls:isCoup?'coup':'ih',
          lbl:isCoup?'✂️ COUPURE':'⏳ INTER-HEAT',
          bcls:'clr-ih'
        };
      }
    }
    return null;
  }

  if(st==='done'||st==='timecap'){
    // Si un IH/coupure devrait être en cours localement, l'afficher en priorité
    // (sinon "0:00 TIMECAP/TERMINÉ" reste figé jusqu'à propagation Firebase de l'IH)
    var _ihFrm=_localIhFrame();
    if(_ihFrm) return _ihFrm;
    // ★ FIX FLUIDITÉ — RÈGLE D'OR : ne JAMAIS afficher "0:00" figé sur le live.
    // Si pas d'IH, afficher "FIN" directement (label porte l'info).
    return{val:'FIN',vcls:st==='done'?'fin':'hot',
           lbl:st==='done'?'🏁 TERMINÉ':'🔴 TIMECAP',
           bcls:st==='done'?'clr-ok':'clr-hot'};
  }

  if(st==='live'){
    if(!frame){
      // startTimestamp pas encore reçu : afficher le cap du WOD (valeur initiale)
      var _w2=h.wodInfo||{};
      var _cap2=wodCapSec(_w2);
      return{val:_cap2>0?fmt(_cap2):'0:00',vcls:'run',lbl:'⏳ SYNC',bcls:'clr-run'};
    }
    // ★ FIX FLUIDITÉ — fin de heat en live. Chrono descendant (AMRAP) → "0:00".
    //   For Time montant & EMOM → flag `ended` (leur valeur passe par 0:00 sans
    //   que ce soit la fin : un EMOM a un round → on n'arrête JAMAIS sur son 0:00).
    if((frame.value==='0:00' && !frame.round) || frame.ended){
      var _ihFrm2=_localIhFrame();
      if(_ihFrm2) return _ihFrm2;
      // Pas d'IH calculé : afficher "FIN" directement, jamais "0:00"
      return{val:'FIN',vcls:'fin',lbl:'🏁 FIN',bcls:'clr-ok'};
    }
    // ★ FIX TOUR EMOM : utiliser le label du frame (ex "⚙️ TRAVAIL · R2/7") quand
    //   il existe — seul l'EMOM le pose. Les autres formats gardent "Z1/Z2".
    return{val:frame.value,vcls:frame.vcls,lbl:frame.lbl||('⏱ Z'+zone),bcls:frame.bcls,round:frame.round||'',phase:frame.phase||''};
  }

  // ★ FIX FLASH "--:--" : fallback (pending, etc.) — afficher le cap du WOD
  var _wFb=h&&h.wodInfo||{};
  var _capFb=wodCapSec(_wFb);
  return{val:_capFb>0?fmt(_capFb):'--:--',vcls:'idle',lbl:'⌛ EN ATTENTE',bcls:''};
}

// ⚠ NON UTILISÉE depuis le passage aux chronos par zone (chaque zone est peinte
//   indépendamment par tickZoneClock). Conservée pour référence/rollback.
function getSharedClockState(){
  // Priorité 1 : IH ou coupure sur n'importe quelle zone
  var ih=IH['1']&&IH['1'].active&&IH['1'].target>now()?IH['1']:
         IH['2']&&IH['2'].active&&IH['2'].target>now()?IH['2']:null;
  if(ih&&ih.target>now()){
    var raw=Math.ceil((ih.target-now())/1000);
    var coup=(ih.ihType||'')==='coupure';
    if(raw>0) return{val:fmt(raw),vcls:coup?'coup':'ih',lbl:coup?'✂️ COUPURE':'⏳ INTER-HEAT',bcls:'clr-ih'};
  }
  // Priorité 2 : countdown
  var cd=CD['1']||CD['2'];
  if(cd&&cd.active&&cd.target>now()){
    var rem=Math.max(0,Math.ceil((cd.target-now())/1000));
    return{val:rem>0?String(rem):'GO !',vcls:rem<=3?'hot':rem<=5?'warn':'run',lbl:'🔔 DÉPART',bcls:'clr-run'};
  }
  // Priorité 3 : heat live (Z1 ou Z2)
  // Synchro : on prend le chrono avec le moins de temps restant (le plus avancé)
  // pour que les deux zones soient alignées visuellement
  var s1=getZoneClockState(1), s2=getZoneClockState(2);
  var live1=s1.vcls==='run'||s1.vcls==='hot'||s1.vcls==='warn';
  var live2=s2.vcls==='run'||s2.vcls==='hot'||s2.vcls==='warn';
  if(live1&&live2){
    // Les deux zones actives : prendre le minimum (plus de temps restant = celui qui dirige)
    var v1=s1.val, v2=s2.val;
    // Convertir mm:ss en secondes pour comparer
    function toSec(v){var p=v.split(':');return p.length===2?parseInt(p[0])*60+parseInt(p[1]):(parseInt(v)||0);}
    var sec1=toSec(v1), sec2=toSec(v2);
    // Afficher le plus petit (moins de temps = zone plus avancée)
    var chosen=sec1<=sec2?s1:s2;
    return{val:chosen.val,vcls:chosen.vcls,lbl:'⏱ EN COURS',bcls:chosen.bcls};
  }
  if(live1) return{val:s1.val,vcls:s1.vcls,lbl:'⏱ EN COURS',bcls:s1.bcls};
  if(live2) return{val:s2.val,vcls:s2.vcls,lbl:'⏱ EN COURS',bcls:s2.bcls};
  // ★ FIX FLUIDITÉ — Si une zone montre IH/coupure local (mais Firebase pas encore propagé)
  var ihLike1=s1.vcls==='ih'||s1.vcls==='coup';
  var ihLike2=s2.vcls==='ih'||s2.vcls==='coup';
  if(ihLike1&&!ihLike2) return s1;
  if(ihLike2&&!ihLike1) return s2;
  if(ihLike1&&ihLike2){
    function toSec2(v){var p=String(v).split(':');return p.length===2?parseInt(p[0])*60+parseInt(p[1]):(parseInt(v)||0);}
    return toSec2(s1.val)<=toSec2(s2.val)?s1:s2;
  }
  // ★ FIX FLUIDITÉ — Si une zone est en FIN, l'afficher (jamais 0:00 figé)
  if(s1.vcls==='fin'||s2.vcls==='fin'){
    return s1.vcls==='fin'?s1:s2;
  }
  return{val:s1.val,vcls:s1.vcls,lbl:s1.lbl,bcls:s1.bcls};
}

// ════ CHRONO PAR ZONE — chaque zone tourne sur SON propre temps ════
// getZoneClockState(zone) est déjà indépendant (countdown, EMOM par-tour,
// inter-heat, fin). Ici on ne fait que PEINDRE chaque zone séparément, avec
// une ancre anti-flash PROPRE à chaque zone (aucun état partagé).
var _zAnchor={1:null,2:null};
var _zLastKey={1:null,2:null};

function tickZoneClock(zone){
  var cv=document.getElementById('cv-z'+zone),
      cl=document.getElementById('cl-z'+zone),
      cb=document.getElementById('cb-z'+zone);
  if(!cv) return; // zone en attente / non affichée : pas de chrono à peindre

  var s=getZoneClockState(zone);

  var anchor=_zAnchor[zone];
  var isHeatEnded=(s.vcls==='fin'||(s.lbl&&/TERMIN|TIMECAP|🏁|🔴/.test(s.lbl)));
  if(isHeatEnded){ _zAnchor[zone]=null; anchor=null; }

  var isHole=(s.val==='--:--' || s.vcls==='idle');
  var isActiveCountdown=(typeof s.val==='string' && /^\d+:\d{2}$/.test(s.val) &&
                        (s.vcls==='run' || s.vcls==='hot' || s.vcls==='warn'));

  if(isActiveCountdown){
    function parseSec(v){
      var p=v.split(':');
      return p.length===2 ? (parseInt(p[0],10)||0)*60 + (parseInt(p[1],10)||0) : (parseInt(v,10)||0);
    }
    _zAnchor[zone]={sec:parseSec(s.val),capturedAt:now(),vcls:s.vcls,lbl:s.lbl,bcls:s.bcls};
  } else if(isHole && anchor){
    var ageMs=now()-anchor.capturedAt;
    if(ageMs<=20000){
      var newSec=Math.max(0, anchor.sec - Math.floor(ageMs/1000));
      var mm=Math.floor(newSec/60), ss=newSec%60;
      s={
        val: mm+':'+(ss<10?'0':'')+ss,
        vcls: newSec<=10?'hot':newSec<=30?'warn':anchor.vcls,
        lbl: anchor.lbl||'⏱ EN COURS',
        bcls: anchor.bcls
      };
    } else {
      _zAnchor[zone]=null;
    }
  }

  // Ne touche au DOM que si l'état change ET que l'élément porte encore cet état.
  // (dataset.k tombe quand renderZone reconstruit la colonne → on repeint.)
  var key=s.val+'|'+s.vcls+'|'+(s.lbl||'')+'|'+(s.bcls||'')+'|'+(s.round||'')+'|'+(s.phase||'');
  if(_zLastKey[zone]===key && cb && cb.dataset && cb.dataset.k===key) return;
  _zLastKey[zone]=key;
  cv.textContent=s.val; cv.className='chrono-val '+s.vcls;
  if(cl) cl.textContent=s.lbl;
  // TOUR X/7 à côté du chrono — EMOM seulement (s.round posé par le frame EMOM)
  var cr=document.getElementById('cr-z'+zone);
  if(cr){
    if(s.round){ cr.textContent='TOUR '+s.round; cr.style.display=''; }
    else { cr.textContent=''; cr.style.display='none'; }
  }
  // Animation sobre travail/repos (EMOM) : classe de phase sur le bandeau
  var _phCls=s.phase==='work'?' ph-work':(s.phase==='rest'?' ph-rest':'');
  if(cb){ cb.className='zone-chrono chrono-band '+(s.bcls||'')+_phCls; if(cb.dataset) cb.dataset.k=key; }
}

function startZoneClocks(){
  if(_scIv)return;
  [1,2].forEach(tickZoneClock);
  var _rafRunning=false;
  function rafTick(){
    _rafRunning=false;
    try{ [1,2].forEach(tickZoneClock); }catch(e){}
    if(!document.hidden){ _rafRunning=true; requestAnimationFrame(rafTick); }
  }
  function ensureRunning(){
    if(_rafRunning) return;
    if(!document.hidden){ _rafRunning=true; requestAnimationFrame(rafTick); }
  }
  ensureRunning();
  _scIv=setInterval(function(){
    try{ [1,2].forEach(tickZoneClock); }catch(e){}
    ensureRunning();
  }, 250);
  document.addEventListener('visibilitychange', ensureRunning);
}

// applyC() met à jour _lastFrame ET le chrono de la zone (cv-z1/cv-z2)
function applyC(z,txt,vcls,lbl,bcls){
  // Mémorise le dernier état (pour holdLastFrame) mais ne touche plus aux chronos de zone
  _lastFrame[z]={txt:txt,lbl:lbl||'',vcls:vcls,bcls:bcls||''};
  // Le chrono de chaque zone est peint par tickZoneClock (lecture directe de
  // getZoneClockState). applyC ne sert plus qu'à mémoriser _lastFrame (holdLastFrame).
}
function holdLastFrame(z,ms){
  var f=_lastFrame[z];
  if(!f||f.txt==null) return false;
  setHold(z,f.txt,f.lbl,f.vcls,f.bcls,ms||1500);
  return true;
}
function startClock(z,hid,h,w){
  var cd=CD[String(z)];
  if(cd&&cd.active&&cd.target>now()){
    var k='cd:'+cd.target;if(_ivKey[z]===k)return;
    stopClock(z);_ivKey[z]=k;
    _iv[z]=setInterval(function(){
      var rem=Math.max(0,Math.ceil((cd.target-now())/1000));
      applyC(z,rem>0?String(rem):'GO !',rem<=3?'hot':rem<=5?'warn':'run','🔔 DÉPART','clr-run');
      if(rem<=0){
        setHold(z,'GO !','🚀 DÉPART','hot','clr-run',150);
        stopClock(z);
        CD[String(z)]=null;
        _dh[z]=null;
        scheduleRender();
      }
    },100);return;
  }
  var ih=IH[String(z)];
  // ★ FIX AFFICHAGE PUBLIC : le WOD en cours a PRIORITÉ sur l'inter-heat.
  //   Bug : un inter-heat resté marqué actif=true dans Firebase masquait le For Time
  //   en cours (« le for time n'est plus affiché, ça switch sur l'interheat »).
  //   Si le heat courant tourne vraiment (status live + chrono démarré), on ignore l'IH.
  var _heatLiveEnCours = h && h.status==='live' && (h.startTimestamp>0 || (HEATS[hid]&&HEATS[hid].startTimestamp>0));
  if(ih&&ih.active&&ih.target>(now()-4000) && !_heatLiveEnCours){
    var k='ih:'+ih.target;if(_ivKey[z]===k)return;
    stopClock(z);_ivKey[z]=k;
    var coup=(ih.ihType||'')==='coupure';
    _iv[z]=setInterval(function(){
      var raw=Math.ceil((ih.target-now())/1000);
      if(raw>0){
        applyC(z,fmt(raw),coup?'coup':'ih',coup?'✂️ COUPURE':'⏳ INTER-HEAT','clr-ih');
      } else {
        applyC(z,'GO !','hot','🚀 DÉPART','clr-run');
        if(raw<=-1){setHold(z,'GO !','🚀 DÉPART','hot','clr-run',150);stopClock(z);IH[String(z)]={active:false};scheduleRender();}
      }
    },100);return;
  }
  if(applyHold(z)) return;
  if(!h){var k='none-'+z;if(_ivKey[z]===k)return;stopClock(z);_ivKey[z]=k;applyC(z,'--:--','idle','⌛ EN ATTENTE','');return;}
  var wantId=hid+'|'+h.status;
  if(h.status==='done'||h.status==='timecap'){
    if(_ivKey[z]===wantId)return;stopClock(z);_ivKey[z]=wantId;
    var cap=wodCapSec(w);
    var ts=h.startTimestamp||(HEATS[hid]&&HEATS[hid].startTimestamp)||0;
    var elapsed=ts>0?Math.max(0,Math.round((now()-ts)/1000)):cap||0;
    // Sur AMRAP (descendant), heat fini = temps écoulé → afficher 0:00 (cohérent avec la fin du chrono)
    // Sur fortime, afficher le temps écoulé jusqu'à la fin (= cap si timecap, ou temps réel sinon)
    var sf=(w.scoreFinale||w.scoreType||'').toLowerCase();

function getLeaders(){

      var l=(h.slots||h.lanes)[ln];if(!l||!l.teamName)return;
      var sc=getSc(hid,h,ln);
      if(!(sc.judgeOk===true||sc.judgeOk===1||sc.judgeOk==='true'))return;
      grp.push({t:l.teamName,v:isT?(sc.finalTime>0?-sc.finalTime:0):parseInt(sc.reps)||0});
    });
    grp.sort(function(a,b){return b.v-a.v;});var pp=1;
    grp.forEach(function(e,i){
      if(i>0&&e.v!==grp[i-1].v)pp=i+1;
      if(!pts[cid])pts[cid]={};pts[cid][e.t]=(pts[cid][e.t]||0)+pp;
      if(pp===1){if(!p1[cid])p1[cid]={};p1[cid][e.t]=(p1[cid][e.t]||0)+1;}
    });
  });
  var leaders={};
  Object.keys(pts).forEach(function(cid){
    var arr=Object.keys(pts[cid]).map(function(t){return{t:t,p:pts[cid][t],p1:p1[cid]&&p1[cid][t]||0};});
    arr.sort(function(a,b){return a.p!==b.p?a.p-b.p:b.p1-a.p1;});
    if(arr.length)leaders[cid]=arr[0].t;
  });
  return leaders;
}


function adaptedQtyForMove(m,catId){
  if(!m)return 0;
  if(catId&&m.qtyParCat&&m.qtyParCat[catId]!=null&&m.qtyParCat[catId]!=='') return parseInt(m.qtyParCat[catId],10)||0;
  return parseInt(m.qty||m.ergoTarget||0,10)||0;
}
function getMoveLoad(m,catId){
  if(!m)return 0;
  var raw='';
  if(catId&&m.poids&&typeof m.poids==='object') raw=m.poids[catId]||'';
  else if(typeof m.poids==='string'||typeof m.poids==='number') raw=m.poids;
  return parseFloat(String(raw).replace(',', '.'))||0;
}
function movementDifficulty(m,catId){
  if(!m)return 1;
  var name=String(m.nom||m.name||'').toLowerCase();
  var diff=1;
  [
    ['wall walk',0.16],['rope climb',0.18],['muscle up',0.20],['bar muscle',0.20],['ring muscle',0.22],
    ['handstand',0.17],['snatch',0.14],['clean',0.12],['thruster',0.14],['burpee',0.11],['devil press',0.18],
    ['box jump',0.08],['pistol',0.12],['toes to bar',0.11],['pull up',0.09],['double under',0.05],
    ['row',0.07],['ski',0.08],['bike',0.09],['run',0.06],['farmer',0.10],['lunge',0.08]
  ].forEach(function(pair){ if(name.indexOf(pair[0])!==-1) diff+=pair[1]; });
  var load=getMoveLoad(m,catId);
  if(load>=120)diff+=0.24; else if(load>=100)diff+=0.18; else if(load>=80)diff+=0.14; else if(load>=60)diff+=0.10; else if(load>=40)diff+=0.06;
  var qty=adaptedQtyForMove(m,catId);
  if(qty>=50)diff+=0.12; else if(qty>=35)diff+=0.08; else if(qty>=20)diff+=0.05; else if(qty>=10)diff+=0.02;
  return Math.min(2.2,Math.max(1,diff));
}
function progressInfoForWod(w,sc,catId){
  var moves=(w&&w.mouvements)||[];
  var idx=parseInt((sc&&sc.curMoveIdx)||0,10)||0;
  var moveReps=parseInt((sc&&sc.moveReps)||0,10)||0;
  var total=0, doneBefore=0, currentQty=0, currentMove=null;
  moves.forEach(function(m,mi){
    var q=adaptedQtyForMove(m,catId);
    total+=q;
    if(mi<idx) doneBefore+=q;
    if(mi===idx){currentQty=q;currentMove=m;}
  });
  var liveRepsVal=parseInt((sc&&sc.reps)||0,10)||0;
  var done=Math.max(liveRepsVal,doneBefore+moveReps);
  if(total>0) done=Math.min(done,total);
  // Fallback : si pas de mouvements définis, utiliser reps bruts
  // L'ETA ne peut pas calculer un "total" mais peut quand même afficher une cadence
  if(total===0 && liveRepsVal>0){
    done=liveRepsVal;
    // Estimer total depuis capSec et cadence (pour AMRAP seulement)
    var isAmrap=(w&&(w.wodFormat||'').toLowerCase()==='amrap');
    if(!isAmrap) total=0; // ForTime sans mouvements : pas d'ETA possible
  }
  return {total:total,done:done,idx:idx,moveReps:moveReps,currentQty:currentQty,currentMove:currentMove,moves:moves};
}
function getEtaTrackKey(row,h){

function updateEtaMemory(row,h,prog,elapsed){
  var sc=row&&row.sc||{};
  var lane=(row&&row.ln)||'';
  var hid=(h&&h._id)||'';
  var key=hid+'_'+lane;

  var mem=ETA_MEM[key];

  var idx=parseInt(prog.idx||0,10)||0;
  if(mem.lastMoveIdx!==null && idx!==mem.lastMoveIdx) mem.transitionPenalty=Math.min(12,(mem.transitionPenalty||0)+2.4);
  if(mem.lastTs && ts>mem.lastTs && reps<mem.lastReps){ mem.samples=[]; }
  if(!mem.samples.length || ts!==mem.lastTs || reps!==mem.lastReps || idx!==mem.lastMoveIdx){
    mem.samples.push({ts:ts,reps:reps,idx:idx,elapsed:elapsed});
    if(mem.samples.length>18) mem.samples=mem.samples.slice(-18);
    mem.lastTs=ts; mem.lastReps=reps; mem.lastMoveIdx=idx;
  }
  if(mem.transitionPenalty>0) mem.transitionPenalty=Math.max(0,mem.transitionPenalty-0.08);
  return mem;
}
function rateFromSamples(samples, seconds){
  if(!samples||samples.length<2) return 0;
  var last=samples[samples.length-1];
  for(var i=samples.length-2;i>=0;i--){
    var s=samples[i];
    var dt=(last.ts-s.ts)/1000;
    if(dt>=seconds){
      var dr=last.reps-s.reps;
      return dt>0&&dr>=0?dr/dt:0;
    }
  }
  var first=samples[0];
  var dt2=(last.ts-first.ts)/1000,dr2=last.reps-first.reps;
  return dt2>0&&dr2>=0?dr2/dt2:0;
}
function clamp(n,min,max){ return Math.max(min,Math.min(max,n)); }
function fmtDelta(s){ return '±'+fmt(Math.max(0,Math.round(s||0))); }

// ── Régression linéaire sur les échantillons (reps = a*elapsed + b) ──
// Retourne {rate, r2} : taux instantané et coefficient de détermination (qualité du fit)
function linReg(samples){
  var n=samples.length;
  if(n<2) return {rate:0,r2:0};
  var sx=0,sy=0,sxy=0,sxx=0,syy=0;
  for(var i=0;i<n;i++){
    var x=samples[i].elapsed, y=samples[i].reps;
    sx+=x; sy+=y; sxy+=x*y; sxx+=x*x; syy+=y*y;
  }
  var denom=n*sxx-sx*sx;
  if(Math.abs(denom)<0.001) return {rate:0,r2:0};
  var a=(n*sxy-sx*sy)/denom; // pente = reps/sec
  // R² pour mesurer la qualité du fit
  var yMean=sy/n, ssTot=0, ssRes=0, b=(sy-a*sx)/n;
  for(var i=0;i<n;i++){
    var yHat=a*samples[i].elapsed+b;
    ssRes+=Math.pow(samples[i].reps-yHat,2);
    ssTot+=Math.pow(samples[i].reps-yMean,2);
  }
  var r2=ssTot>0?Math.max(0,1-ssRes/ssTot):0;
  return {rate:Math.max(0,a), r2:r2};
}

// Modèle de fatigue exponentielle (gardé pour compatibilité)
function fatigueAdjust(baseRate, elapsed, cap, diff, pctDone){
  if(cap<=0||baseRate<=0) return baseRate;
  var k=clamp(0.20 + (diff-1)*0.25, 0.15, 0.65);
  var tNorm=clamp(elapsed/cap, 0, 1);
  var tRem=clamp(1-tNorm, 0.01, 1);
  var integral=(Math.exp(-k*tNorm)-Math.exp(-k))/(k*tRem);
  var rateAtNow=baseRate*Math.exp(-k*tNorm);
  var rateMeanFuture=rateAtNow>0?rateAtNow*integral:baseRate*integral;
  return Math.max(0, rateMeanFuture);
}

// Taux normatif reps/sec par mouvement (CrossFit niveau intermédiaire)
var _MOV_NORMS = {
  'air squat':0.62,'squat':0.55,
  'push up':0.48,'push-up':0.48,
  'pull up':0.32,'pull-up':0.32,'chest-to-bar':0.25,'c2b':0.25,
  'kb swing':0.52,'kettlebell':0.48,
  'box jump':0.37,'box jump over':0.32,
  'burpee':0.22,'burpee over':0.18,'devil press':0.18,
  'wall ball':0.42,'thruster':0.26,
  'power snatch':0.22,'snatch':0.20,
  'power clean':0.25,'clean':0.23,'hang power clean':0.27,
  'deadlift':0.37,
  'toes to bar':0.32,'toes-to-bar':0.32,'t2b':0.32,
  'double under':1.30,'double-under':1.30,
  'wall walk':0.08,
  'bar muscle':0.18,'muscle up':0.15,'ring muscle':0.12,
  'handstand push':0.20,'hspu':0.20,
  'pistol':0.25,
  'row':0.55,'ski':0.55,'bike':0.65,'run':0.42,
  'back squat':0.30,'front squat':0.28,
  'farmer':0.45,'lunge':0.40,
  'sit up':0.55,'sit-up':0.55
};

function normRateForMove(m, catId){
  if(!m) return 0.35;
  var name = String(m.nom||m.name||'').toLowerCase();
  var rate = 0.35; // défaut
  Object.keys(_MOV_NORMS).forEach(function(k){
    if(name.indexOf(k) !== -1) rate = Math.max(rate, _MOV_NORMS[k]);
  });
  // Ajuster selon la charge
  var load = getMoveLoad ? getMoveLoad(m, catId) : 0;
  if(load >= 100) rate *= 0.62;
  else if(load >= 80) rate *= 0.72;
  else if(load >= 60) rate *= 0.82;
  else if(load >= 40) rate *= 0.91;
  return rate;
}

// Construire un tableau de taux par mouvement (norme + mesures réelles)
function buildMovRates(moves, mem, sc, catId){
  var rates = {};
  if(!moves||!moves.length) return rates;
  // Initialiser avec les normes
  moves.forEach(function(m, mi){ rates[mi] = normRateForMove(m, catId); });
  // Affiner avec les échantillons réels
  var samples = mem.samples||[];
  if(samples.length < 2) return rates;
  for(var i=1; i<samples.length; i++){
    var s0=samples[i-1], s1=samples[i];
    var dt=(s1.ts-s0.ts)/1000;
    var dr=s1.reps-s0.reps;
    var idx=s0.idx;
    if(dt>0.3 && dr>=0 && idx < moves.length){
      var measured = dr/dt;
      // Poids de la mesure réelle : augmente avec le nombre d'échantillons
      var w = clamp(0.15 + (i/samples.length)*0.65, 0.15, 0.85);
      rates[idx] = rates[idx]*(1-w) + measured*w;
    }
  }
  return rates;
}

// Simulation du temps restant en projetant mouvement par mouvement
function simulateAmrap(moves, curMoveIdx, curMoveReps, movRates, timeLeft, cap, elapsed, catId){
  if(timeLeft<=0 || !moves||!moves.length) return 0;
  var projReps=0;
  var t=0;
  var mi=curMoveIdx;
  var miReps=curMoveReps;
  var tNorm=elapsed/Math.max(1,cap);
  var maxIter=500; // sécurité
  var iter=0;
  while(t < timeLeft && iter < maxIter){
    iter++;
    var mIdx=mi % moves.length;
    var move=moves[mIdx];
    if(!move){ mi++; continue; }
    var qty=adaptedQtyForMove(move,catId);
    if(qty<=0){ mi++; miReps=0; continue; }
    // Taux de base pour ce mouvement
    var baseR = movRates[mIdx] || normRateForMove(move,catId);
    // Fatigue exponentielle globale
    var k=0.28;
    var fatigue=Math.exp(-k*(tNorm + t/Math.max(1,cap)));
    var rate = baseR * fatigue;
    if(rate <= 0.01) break;
    var repsLeft = qty - miReps;
    if(repsLeft <= 0){ mi++; miReps=0; continue; }
    var timeNeeded = repsLeft/rate;
    if(t + timeNeeded > timeLeft){
      // Temps écoulé pendant ce mouvement partiel
      projReps += Math.floor((timeLeft-t)*rate);
      t=timeLeft;
    } else {
      projReps += repsLeft;
      t += timeNeeded;
      mi++;
      miReps=0;
    }
  }
  return projReps;
}

// Simulation ForTime : estimer le temps de fin
function simulateForTime(moves, curMoveIdx, curMoveReps, movRates, cap, elapsed, catId){
  var t=0;
  var mi=curMoveIdx;
  var miReps=curMoveReps;
  var tNorm=elapsed/Math.max(1,cap);
  var maxIter=500;
  var iter=0;
  while(iter < maxIter){
    iter++;
    if(mi >= moves.length) break; // fini !
    var move=moves[mi];
    if(!move){ mi++; continue; }
    var qty=adaptedQtyForMove(move,catId);
    if(qty<=0){ mi++; miReps=0; continue; }
    var baseR=movRates[mi] || normRateForMove(move,catId);
    var k=0.22;
    var fatigue=Math.exp(-k*(tNorm + t/Math.max(1,cap)));
    var rate=baseR*fatigue;
    if(rate<=0.01) return cap+60; // cap dépassé
    var repsLeft=qty-miReps;
    if(repsLeft<=0){ mi++; miReps=0; continue; }
    t += repsLeft/rate;
    mi++;
    miReps=0;
  }
  return elapsed + t;
}

function etaInfoForRow(row,w,h,catId){
  var sc=row&&row.sc||{};
  if(!h||h.status!=='live'||!h.startTimestamp||sc.judgeOk) return null;
  var fmtName=String((w.wodFormat||w.type||'').toLowerCase());
  var sf=String((w.scoreFinale||w.scoreType||'').toLowerCase());
  var jm=String((w.judgeMode||'').toLowerCase());
  var isFortime=fmtName==='fortime'||sf==='time'||(w.scoreFields&&w.scoreFields.indexOf&&w.scoreFields.indexOf('time')>=0)||(w.type&&w.type.toLowerCase()==='fortime');
  var isMaxload=fmtName==='maxload'||jm==='maxload'||sf==='load';
  var isErgo=fmtName==='ergo'||jm==='ergo'||sf==='dist';
  var isRounds=fmtName==='rounds'||(fmtName===''&&parseInt(w.rounds||1)>1);
  if(isMaxload) return {text:'LOAD LIVE',cls:'eta'};

  var elapsed=Math.max(1,Math.round((now()-h.startTimestamp)/1000));
  var cap=wodCapSec(w);
  var timeLeft=Math.max(0,cap-elapsed);
  var moves=(w&&w.mouvements)||[];
  var totalReps=parseInt(sc.reps||0,10)||0;
  var curMoveIdx=parseInt(sc.curMoveIdx||0,10)||0;
  var curMoveReps=parseInt(sc.moveReps||0,10)||0;

  var prog=progressInfoForWod(w,sc,catId);
  var mem=updateEtaMemory(row,h,prog,elapsed);
  var movRates=buildMovRates(moves,mem,sc,catId);
  var diff=movementDifficulty(prog.currentMove,catId);

  // ── ERGO ──
  if(isErgo){
    var dist=parseFloat(sc.dist||sc.distance||sc.ergoVal||sc.reps||0)||0;
    if(elapsed<3||dist<=0) return null;
    var ergoRate=dist/elapsed;
    var adjErgo=fatigueAdjust(ergoRate,elapsed,cap,diff,0);
    var proj=cap>0?Math.round(dist+adjErgo*timeLeft):Math.round(dist);
    return {text:'PROJ '+proj+(w.scoreFinaleUnit||' m'),cls:(cap>0&&elapsed/cap>0.8)?'eta warn':'eta'};
  }

  // ── FOR TIME ──
  if(isFortime){
    var totalUnits=prog.total||0;
    var doneUnits=prog.done||0;
    if(totalUnits<=0) return null;
    // Dès la 1ère rep : simulation
    var etaSec;
    if(doneUnits<=0){
      // Pas encore de reps : estimer depuis norme globale
      var normRate=moves.length>0?moves.reduce(function(s,m){return s+normRateForMove(m,catId)*adaptedQtyForMove(m,catId);},0)/Math.max(1,moves.reduce(function(s,m){return s+adaptedQtyForMove(m,catId);},0)):0.35;
      etaSec=normRate>0?elapsed+Math.round(totalUnits/normRate):cap;
    } else {
      etaSec=elapsed+Math.round(simulateForTime(moves,curMoveIdx,curMoveReps,movRates,cap,elapsed,catId)-elapsed);
      etaSec=Math.max(elapsed+1,etaSec);
    }
    if(cap>0){
      var margin=cap-etaSec;
      var cls=margin>=20?'eta ok':margin>=0?'eta warn':'eta err';
      var text=margin>=0?'FIN ~'+fmt(etaSec):'TC +'+fmt(Math.abs(margin));
      return {text:text,cls:cls};
    }
    return {text:'ETA '+fmt(etaSec),cls:'eta'};
  }

  // ── AMRAP / ROUNDS ──
  if(cap>0){
    // Dès la 1ère rep
    var projReps;

function compareScores(a,b,w){

  //   distance/cals, à distance ÉGALE, l'équipe qui a fait PLUS de reps du mouvement
  //   (ex : snatch) passe devant. Ainsi pendant le round — avant que la distance du
  //   tour soit saisie — c'est le nombre de snatch qui départage, et le classement
  //   bouge à chaque rep. 1 snatch d'avance = devant.
  var _cjm=((w&&w.judgeMode)||'').toLowerCase();
  var _csf=((w&&(w.scoreFinale||w.scoreType))||'').toLowerCase();
  if((_cjm==='ergo'||_csf==='dist'||_csf==='cal') && !a.ok && !b.ok){
    // (uniquement en DIRECT — scores non validés — sinon le dernier tour fausserait

    if(at===0&&bt>0) return 1;

  var bl=parseInt(String(b.ln).replace(/\D/g,''))||0;
