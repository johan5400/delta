// ★ ÉQUIPES INVITÉES (mur live) : catégorie effective d'une lane. Une invitée est
//   rattachée à SA catégorie d'origine (teamCatName), pas à la catégorie du heat hôte.
//   Sert à séparer, dans le CLASSEMENT GÉNÉRAL, un heat « mère » (ex. Rx F-F + Rx H-F)
//   en un classement par catégorie — sinon les équipes et leurs points sont mélangés.
function _liveLaneEffCat(lane, h){
  if(lane && lane.isGuest && lane.teamCatName) return lane.teamCatName;
  return (h && (h.catName||h.catNom)) || '';
}
// Liste des catégories effectives présentes dans un heat (dédupliquées, ordre hôte d'abord).
function _liveHeatEffCats(h){
  var hostCat=(h&&(h.catName||h.catNom))||'';
  var out={}, order=[];
  var lanes=(h&&(h.slots||h.lanes))||{};
  Object.keys(lanes).forEach(function(ln){
    var l=lanes[ln]; if(!l||!l.teamName) return;
    var k=_liveLaneEffCat(l,h);
    if(!out[k]){ out[k]=true; order.push(k); }
  });
  order.sort(function(a,b){ if(a===hostCat)return -1; if(b===hostCat)return 1; return 0; });
  return order.length?order:[hostCat];
}

function buildWodClassement(h, catFilter){
  var catId=String(h.catId||'');
  // ★ Si un filtre de catégorie effective est fourni (heat mère), le classement porte
  //   ce nom-là ; sinon la catégorie du heat. Les lanes d'une AUTRE catégorie effective
  //   sont ignorées → chaque catégorie invitée obtient son propre classement/points.
  var catName=catFilter||h.catName||'';
  function _laneKeep(l,hh){ return catFilter ? (_liveLaneEffCat(l,hh)===catFilter) : true; }
  var allTeams={};
  Object.keys(HEATS).forEach(function(k){
    var hh=HEATS[k]; if(!hh||String(hh.catId)!==catId)return;
    var lanes=hh.slots||hh.lanes||{};
    Object.keys(lanes).forEach(function(ln){var l=lanes[ln];if(l&&l.teamName&&_laneKeep(l,hh))allTeams[l.teamName]=true;});
  });
  // ★ HEAT MÈRE (catFilter actif) : on IGNORE le classement Firebase publié — celui-ci
  //   est construit sous le nom du heat hôte (« Rx F-F/Rx H-F ») et mélangerait les
  //   catégories. On force le recalcul local ci-dessous, filtré par catégorie effective.
  if(!catFilter && CLASSEMENT&&Object.keys(CLASSEMENT).length){
    var zoneNum=parseInt(h.catZone!=null?h.catZone:h.zone,10)||1;
    var catKey=(catName+'__z'+zoneNum).replace(/[^a-zA-Z0-9_-]/g,'_');
    var fbCat=CLASSEMENT[catKey];
    if(fbCat&&fbCat.teams&&fbCat.teams.length){
      var fbRes=fbCat.teams.map(function(t){return{t:t.name,p:t.points,p1:t.podiums?t.podiums.p1:0};});
      // ★ FALLBACK 0 PTS : si le classement Firebase ne contient AUCUN point (>0),
      //   c'est qu'il a été publié incomplet → on ne l'utilise PAS et on laisse filer
      //   vers le recalcul local ci-dessous (évite un "0 pts" affiché sur le mur).
      var _fbHasPts=fbRes.some(function(r){return (parseFloat(r.p)||0)>0;});
      if(_fbHasPts){
        var seen={}; fbRes.forEach(function(r){seen[r.t]=true;});
        Object.keys(allTeams).forEach(function(tn){if(!seen[tn])fbRes.push({t:tn,p:0,p1:0,nr:true});});
        return fbRes;
      }
      // sinon (aucun point) → on n'arrête pas ici, le calcul local prend le relais
    }
  }
  var catH=Object.keys(HEATS).filter(function(k){var hh=HEATS[k];return hh&&String(hh.catId)===catId&&(hh.status==='done'||hh.status==='timecap');});
  var tpts={},tp1={};
  var _cfg=[100,95,90,85,80,75,70,65,60,55,50,45,40,35,30,25,20,15,10,0];
  // ★ FIX 2 HEATS / MÊME CATÉGORIE : regrouper les équipes par WOD et les classer
  //   TOUTES ENSEMBLE (pas heat par heat) — sinon 2 heats = deux 1ers à 100 pts.
  var byWod={};
  catH.forEach(function(k){
    var hh=HEATS[k], ww=hh.wodInfo||{};
    var wkey=String(ww.nom||ww.id||k);
    if(!byWod[wkey]) byWod[wkey]={ww:ww, teams:[]};
    Object.keys(hh.slots||hh.lanes||{}).forEach(function(ln){
      var l=(hh.slots||hh.lanes)[ln]; if(!l||!l.teamName||!_laneKeep(l,hh))return;
      var sc=getSc(k,hh,ln); if(!(sc.judgeOk===true||sc.judgeOk===1))return;
      var sf2=(ww.scoreType||ww.scoreFinale||'').toLowerCase();
      var v;
      if(ww.judgeMode==='maxload'||sf2==='load') v=parseFloat(sc.load)||0;
      else if(ww.judgeMode==='ergo'||sf2==='dist'||sf2==='cal') v=parseFloat(sc.ergoVal||sc.dist||sc.distance)||0;
      else if((ww.wodFormat||'').toLowerCase()==='fortime'||sf2==='time'){
        // ★ Finisher (finalTime>0) devant ; timecap (reps seulement) derrière les finishers ;
        //   rien fait tout en bas. Cohérent avec classement.html / podium.html.
        if(sc.finalTime>0) v=-parseInt(sc.finalTime);
        else if(parseInt(sc.reps)>0) v=-1000000+parseInt(sc.reps);
        else v=-2000000;
      }
      else v=parseInt(sc.reps)||0;
      byWod[wkey].teams.push({t:l.teamName, v:v});
    });
  });
  Object.keys(byWod).forEach(function(wkey){
    var grp=byWod[wkey].teams;
    grp.sort(function(a,b){return b.v-a.v;});
    var pp=1;
    grp.forEach(function(e,i){if(i>0&&e.v!==grp[i-1].v)pp=i+1;var pts=(pp>=1&&pp<=_cfg.length)?_cfg[pp-1]:0;tpts[e.t]=(tpts[e.t]||0)+pts;if(pp===1){if(!tp1[e.t])tp1[e.t]=0;tp1[e.t]++;}});
  });
  var gen=Object.keys(tpts).map(function(t){return{t:t,p:tpts[t],p1:tp1[t]||0};});
  gen.sort(function(a,b){return a.p!==b.p?b.p-a.p:b.p1-a.p1;}); // ★ PLUS de points = meilleur (CrossFit)
  var seenG={}; gen.forEach(function(r){seenG[r.t]=true;});
  Object.keys(allTeams).forEach(function(tn){if(!seenG[tn])gen.push({t:tn,p:0,p1:0,nr:true});});
  return gen;
}
function isLastCategoryHeat(h){
  h=h||{};
  var catId=String(h.catId||'');
  var curHeatNum=parseInt(h.catHeatNum,10)||0;
  if(catId){
    var sameCat=Object.keys(HEATS).map(function(hid){ return HEATS[hid]; }).filter(function(x){
      return x && String(x.catId||'')===catId;
    });
    if(sameCat.length){
      var maxCatHeat=0;
      sameCat.forEach(function(x){
        var n=parseInt(x.catHeatNum,10)||0;
        if(n>maxCatHeat) maxCatHeat=n;
      });
      if(curHeatNum>0 && maxCatHeat>0) return curHeatNum>=maxCatHeat;
      var curGlobal=parseInt(h.globalNum,10)||0;
      var maxGlobal=0;
      sameCat.forEach(function(x){
        var g=parseInt(x.globalNum,10)||0;
        if(g>maxGlobal) maxGlobal=g;
      });
      if(curGlobal>0 && maxGlobal>0) return curGlobal>=maxGlobal;
    }
  }
  return !!(h.catHeatNum && h.nbHeatsTotal && parseInt(h.catHeatNum,10)>=parseInt(h.nbHeatsTotal,10));
}
// ── WOD « amrapsteph » (ex : « Bike N Run ») : le juge saisit les cals du bike UNE FOIS en
//    fin de WOD. On ne doit donc PAS afficher les résultats de ce heat tant que la saisie
//    n'est pas faite (sinon classement faux / incomplet). Ces deux helpers servent de garde.
function _isAmrapStephHeat(h){
  var w=(h&&h.wodInfo)||{};
  return String(w.wodFormat||'').toLowerCase()==='amrapsteph';
}
// Heat entièrement saisi = au moins une équipe, et TOUTES les équipes ont un score validé (judgeOk).
function _heatFullyScored(hid,h){
  if(!h) return true;
  var lanes=h.slots||h.lanes||{}, nbTeams=0, nbOk=0;
  Object.keys(lanes).forEach(function(ln){
    var l=lanes[ln]; if(!l||!(l.teamName||l.team)) return;
    nbTeams++;
    var sc=getSc(hid,h,ln)||{};
    if(sc.judgeOk===true||sc.judgeOk===1||sc.judgeOk==='true') nbOk++;
  });
  return nbTeams>0 && nbOk===nbTeams;
}
// L'affichage des RÉSULTATS d'un heat doit-il attendre ? (uniquement amrapsteph non encore saisi)
function _heatResultsShouldWait(hid,h){
  return _isAmrapStephHeat(h) && !_heatFullyScored(hid,h);
}
// ── Flèche pour le RÉSULTAT D'UN HEAT : ce résultat fait-il monter/descendre l'équipe
//    au classement GÉNÉRAL ? → rang général APRÈS ce heat comparé au rang général AVANT.
//    Même logique que le général (style Competition Corner), calculée par catégorie effective
//    pour que la comparaison reste juste sur un heat mère multi-catégories.
function _heatArrowFn(hid, h){
  var effCats=_liveHeatEffCats(h);
  var afterRank={}, beforeRank={};
  (effCats.length?effCats:[null]).forEach(function(_cf){
    var catId=String(h.catId||'');
    // Tous les heats finis de la ou les catégorie(s) concernée(s)
    var doneH=Object.keys(HEATS).filter(function(k){var hh=HEATS[k];return hh&&(hh.status==='done'||hh.status==='timecap');});
    // "avant" = on retire CE heat ; "après" = on le garde
    var beforeH=doneH.filter(function(k){return k!==String(hid);});
    // Restreindre à la bonne catégorie comme le fait le général
    var catH=doneH.filter(function(k){return String((HEATS[k]||{}).catId)===catId;});
    var catBeforeH=beforeH.filter(function(k){return String((HEATS[k]||{}).catId)===catId;});
    var rA=_genCumulativeRanks(catH, _cf);
    var rB=_genCumulativeRanks(catBeforeH, _cf);
    Object.keys(rA).forEach(function(t){ if(afterRank[t]==null) afterRank[t]=rA[t]; });
    Object.keys(rB).forEach(function(t){ if(beforeRank[t]==null) beforeRank[t]=rB[t]; });
  });
  // S'il n'y a aucun heat "avant" (c'est le tout premier de la catégorie), aucune flèche.
  if(!Object.keys(beforeRank).length) return null;
  return function(team){
    var a=afterRank[team], b=beforeRank[team];
    if(a==null||b==null) return null;   // pas présente avant → pas de flèche
    if(a<b) return 'up';
    if(a>b) return 'down';
    return 'same';
  };
}
function renderHeatHtml(hid,h){
  var w=h.wodInfo||{},sf=(w.scoreType||w.scoreFinale||'').toLowerCase();
  var isT=(w.wodFormat||'').toLowerCase()==='fortime'||sf==='time';
  var lanes=h.slots||h.lanes||{},entries=[];
  var arrowFn=null; try{ arrowFn=_heatArrowFn(hid,h); }catch(e){}
  Object.keys(lanes).forEach(function(ln){var l=lanes[ln];if(!l||!l.teamName)return;var sc=getSc(hid,h,ln);entries.push({t:l.teamName,sc:sc,v:scoreVal(sc,w),isGuest:!!l.isGuest,guestCatName:l.teamCatName||'',guestCatColor:l.teamCatColor||'#888'});});
  entries.sort(function(a,b){
    if(a.sc.judgeOk&&!b.sc.judgeOk)return -1;
    if(!a.sc.judgeOk&&b.sc.judgeOk)return 1;
    if(b.v!==a.v) return b.v-a.v;
    var aTbs=tbArr(a.sc),bTbs=tbArr(b.sc);
    for(var ti=0;ti<Math.max(aTbs.length,bTbs.length);ti++){
      var at=aTbs[ti]||0,bt=bTbs[ti]||0;
      if(at>0&&bt>0&&at!==bt) return at-bt;
      if(at>0&&bt===0) return -1;
      if(at===0&&bt>0) return 1;
    }
    return 0;
  });
  var html='<div class="p-title">🏁 '+esc(w.nom||'WOD')+'</div>'
    +'<div class="p-sub">'+esc(h.catName||'')+' · Heat '+(h.catHeatNum||'—')+' / '+(h.nbHeatsTotal||'—')+'</div>';
  entries.forEach(function(e,i){
    // ★ Colonne TENDANCE (même visuel que le classement général) : ce résultat fait-il
    //   monter/descendre l'équipe au général ? Rien à comparer → colonne vide.
    var _tCls='same', _tSym='';
    if(arrowFn && e.sc.judgeOk){ var _d=arrowFn(e.t);
      if(_d==='up'){ _tCls='up'; _tSym='▲'; }
      else if(_d==='down'){ _tCls='down'; _tSym='▼'; }
      else if(_d==='same'){ _tCls='same'; _tSym='▬'; } }
    var trendHtml='<div class="p-trend '+_tCls+'"><span class="tri">'+_tSym+'</span></div>';
    html+='<div class="p-row'+(i<3?' r'+(i+1):'')+'">'
      +trendHtml
      +'<div class="p-rk">'+(i+1)+'</div>'
      +'<div class="p-nm">'+esc(e.t)+'</div>'
      +'<div class="p-sc">'+(e.sc.judgeOk?scoreStr(e.sc,w):'—')+'</div>'
      +'</div>';
  });
  return html;
}
// ── Classement cumulé (rangs) à partir d'une liste de heats — base des flèches de progression ──
function _genCumulativeRanks(heatKeys, catFilter){
  var tpts={},tp1={};
  var _cfg=[100,95,90,85,80,75,70,65,60,55,50,45,40,35,30,25,20,15,10,0];
  var byWod={};
  (heatKeys||[]).forEach(function(k){
    var hh=HEATS[k]; if(!hh) return; var ww=hh.wodInfo||{};
    var wkey=String(ww.nom||ww.id||k);
    if(!byWod[wkey]) byWod[wkey]={teams:[]};
    Object.keys(hh.slots||hh.lanes||{}).forEach(function(ln){
      var l=(hh.slots||hh.lanes)[ln]; if(!l||!l.teamName)return;
      if(catFilter && _liveLaneEffCat(l,hh)!==catFilter)return;
      var sc=getSc(k,hh,ln); if(!(sc.judgeOk===true||sc.judgeOk===1))return;
      var sf2=(ww.scoreType||ww.scoreFinale||'').toLowerCase();
      var v;
      if(ww.judgeMode==='maxload'||sf2==='load') v=parseFloat(sc.load)||0;
      else if(ww.judgeMode==='ergo'||sf2==='dist'||sf2==='cal') v=parseFloat(sc.ergoVal||sc.dist||sc.distance)||0;
      else if((ww.wodFormat||'').toLowerCase()==='fortime'||sf2==='time'){
        if(sc.finalTime>0) v=-parseInt(sc.finalTime);
        else if(parseInt(sc.reps)>0) v=-1000000+parseInt(sc.reps);
        else v=-2000000;
      }
      else v=parseInt(sc.reps)||0;
      byWod[wkey].teams.push({t:l.teamName, v:v});
    });
  });
  Object.keys(byWod).forEach(function(wkey){
    var grp=byWod[wkey].teams;
    grp.sort(function(a,b){return b.v-a.v;});
    var pp=1;
    grp.forEach(function(e,i){if(i>0&&e.v!==grp[i-1].v)pp=i+1;var pts=(pp>=1&&pp<=_cfg.length)?_cfg[pp-1]:0;tpts[e.t]=(tpts[e.t]||0)+pts;if(pp===1){tp1[e.t]=(tp1[e.t]||0)+1;}});
  });
  var g=Object.keys(tpts).map(function(t){return{t:t,p:tpts[t],p1:tp1[t]||0};});
  g.sort(function(a,b){return a.p!==b.p?b.p-a.p:b.p1-a.p1;});
  var rank={}; g.forEach(function(t,i){rank[t.t]=i+1;});
  return rank;
}
// ── Flèche par équipe : compare le classement ACTUEL à celui d'AVANT le dernier WOD fait ──
function _genArrowFn(h, gen, catFilter){
  var catId=String(h.catId||'');
  var catH=Object.keys(HEATS).filter(function(k){var hh=HEATS[k];return hh&&String(hh.catId)===catId&&(hh.status==='done'||hh.status==='timecap');});
  var byWodHeats={}, wodRecency={};
  catH.forEach(function(k){
    var hh=HEATS[k], ww=hh.wodInfo||{};
    var wkey=String(ww.nom||ww.id||k);
    (byWodHeats[wkey]=byWodHeats[wkey]||[]).push(k);
    // récence du WOD = quand son heat a tourné (startTimestamp), repli sur catHeatNum
    var n=parseInt(hh.startTimestamp,10)||parseInt(hh.catHeatNum,10)||0;
    if(wodRecency[wkey]==null||n>wodRecency[wkey]) wodRecency[wkey]=n;
  });
  var wodKeys=Object.keys(byWodHeats);
  if(wodKeys.length<2) return null; // moins de 2 WODs faits → pas de comparaison possible, pas de flèche
  var lastWod=wodKeys[0];
  wodKeys.forEach(function(wk){ if(wodRecency[wk]>wodRecency[lastWod]) lastWod=wk; });
  var prevHeats=catH.filter(function(k){var ww=(HEATS[k].wodInfo||{});var wkey=String(ww.nom||ww.id||k);return wkey!==lastWod;});
  var prevRank=_genCumulativeRanks(prevHeats, catFilter);
  var curRank={}; gen.forEach(function(t,i){curRank[t.t]=i+1;});
  return function(team){
    var c=curRank[team], p=prevRank[team];
    if(p==null||c==null) return null;     // équipe pas présente avant → pas de flèche
    if(c<p) return 'up';                   // rang plus petit = remonte
    if(c>p) return 'down';
    return 'same';
  };
}
function renderWodHtml(h){
  // ★ HEAT MÈRE : s'il accueille des équipes invitées de plusieurs catégories
  //   (ex. Rx F-F + Rx H-F), on affiche UN classement général PAR catégorie effective,
  //   chacun avec ses propres points (1er=100…). Un heat mono-catégorie est inchangé.
  var _cats=_liveHeatEffCats(h);
  var html='<div class="gen-classement">';
  _cats.forEach(function(_catName, _ci){
    var _filter=(_cats.length>1)?_catName:null;
    var gen=buildWodClassement(h, _filter);
    var arrowFn=null; try{ arrowFn=_genArrowFn(h,gen,_filter); }catch(e){}
    html+='<div class="p-title gen-title"'+(_ci>0?' style="margin-top:18px"':'')+'>🏆 CLASSEMENT GÉNÉRAL</div>'
      +'<div class="p-sub gen-sub">'+esc(_catName||h.catName||'')+'</div>';
    gen.forEach(function(t,i){
      var isNR=t.nr||t.p===0;
      var rowCls='p-row gen-row'+(i<3&&!isNR?' r'+(i+1):'');
      var op=isNR?' style="opacity:.5"':'';
      var ptsHtml=isNR?'<div class="p-pts" style="color:var(--ink3)">—</div>':'<div class="p-pts">'+t.p+' pt'+(t.p>1?'s':'')+'</div>';
      // ★ Colonne TENDANCE dédiée (style Competition Corner) — à gauche du rang.
      //   Toutes les équipes sont présentes dès le début → pas de cas "nouvelle".
      //   Rien à comparer (début de compét ou équipe sans historique) → colonne vide.
      var _tCls='same', _tSym='';
      if(arrowFn && !isNR){ var _d=arrowFn(t.t);
        if(_d==='up'){ _tCls='up'; _tSym='▲'; }
        else if(_d==='down'){ _tCls='down'; _tSym='▼'; }
        else if(_d==='same'){ _tCls='same'; _tSym='▬'; } }
      var trendHtml='<div class="p-trend '+_tCls+'"><span class="tri">'+_tSym+'</span></div>';
      html+='<div class="'+rowCls+'"'+op+'>'+trendHtml+'<div class="p-rk">'+(i+1)+'</div><div class="p-nm">'+esc(t.t)+'</div>'+ptsHtml+'</div>';
    });
  });
  html+='</div>';
  return html;
}
function showPodium(zone,hid,h,ihSec){

// Une coupure est-elle dans sa 1ère MOITIÉ ? (sponsors = 1ère moitié, prochain heat = 2ème)
function _coupureFirstHalf(ih){
  if(!ih||!ih.active||ih.ihType!=='coupure') return false;
  var tgt=ih.target||0, secs=parseInt(ih.seconds,10)||0, n=now();
  if(tgt<=n) return false;            // coupure finie
  if(secs<=0) return tgt>n;           // pas de durée connue → on garde sponsors tant que la coupure dure
  var start=tgt-secs*1000;
  var mid=start+(secs*1000)/2;
  return n>=start && n<mid;           // uniquement la 1ère moitié
}
// ★ FENÊTRE SPONSORS — ordre voulu : résultat → classement → SPONSORS → preview prochain heat.
//   Les sponsors NE recouvrent PLUS le résultat ni le classement : ils sortent au MILIEU
//   de la coupure (après ~55% = résultat ~25% + classement ~30%), et s'arrêtent assez tôt
//   pour réserver du temps à l'affichage du prochain heat (≥10s, ~22% de la coupure).
function _coupureSponsorWindow(ih){
  if(!ih||!ih.active||ih.ihType!=='coupure') return false;
  var tgt=ih.target||0, secs=parseInt(ih.seconds,10)||0, n=now();
  if(tgt<=n) return false;                       // coupure finie
  if(secs<=0) return tgt>n;                       // durée inconnue → sponsors tant que ça dure
  var start=tgt-secs*1000;
  var afterClassement=start+Math.round(secs*1000*0.12);            // ★ #3 : sponsors ENCORE PLUS VITE (résultat très court, 12%)
  var previewReserveMs=Math.max(8000,Math.round(secs*1000*0.15));  // ★ #7 : prochain heat à 15% du temps restant
  var sponEnd=tgt-previewReserveMs;
  if(sponEnd<=afterClassement) return false;      // coupure trop courte → on saute les sponsors
  return n>=afterClassement && n<sponEnd;
}

    // Enrichir HEATS avec catName/wodInfo depuis CATS+WD si manquant
    Object.keys(HEATS).forEach(function(hid){
      var h=HEATS[hid]; if(!h||!h.catId) return;
      var cat=CATS[String(h.catId)]; if(!cat) return;
      if(!h.catName&&cat.nom)   h.catName=cat.nom;
      if(!h.catZone&&cat.zone)  h.catZone=String(cat.zone);
      if(!h.wodId&&cat.wodId)   h.wodId=cat.wodId;
      if(cat.wodId&&WD[String(cat.wodId)]){
        var wlive=WD[String(cat.wodId)];
        if(!h.wodInfo) h.wodInfo={};
        Object.assign(h.wodInfo, wlive, {id:cat.wodId});
      }
    });
    // ★ Ne forcer rebuild complet que si quelque chose de visible a changé
    var newSig=_computeCatSig();
    if(newSig!==_catSig){
      _catSig=newSig;
      _dh[1]=null; _dh[2]=null;
    }
    scheduleRender();
  });
  var _mcdIv=null;
  db.ref('system/morningCountdown').on('value',function(s){
    var d=s.val()||{};
    var el=document.getElementById('morning-cd');
    var val=document.getElementById('mcd-val');
    var sub=document.getElementById('mcd-sub');
    clearInterval(_mcdIv);
    // Si morningCountdown n'est plus actif → masquer overlay immédiatement
    if(!d.active||!d.target){
      if(el)el.className='';
      _dh[1]=null;_dh[2]=null;
      scheduleRender();
      return;
    }
    // Si target déjà dépassé → GO immédiat, pas d'affichage
    if(d.target<=now()){
      if(el)el.className='';
      _dh[1]=null;_dh[2]=null;
      scheduleRender();
      return;
    }
    if(el)el.className='on';
    // Charger le logo FOC dans l'overlay
    var mcdLogo=document.getElementById('mcd-logo');
    if(mcdLogo&&FOC_LOGO) mcdLogo.src=FOC_LOGO;
    function tick(){
      var rem=Math.max(0,Math.ceil((d.target-now())/1000));
      if(rem<=0){
        if(val){val.textContent='GO !';val.className='mcd-val go';}
        if(sub)sub.textContent='C\'est parti !';
        clearInterval(_mcdIv);
        _dh[1]=null;_dh[2]=null;
        // Fermer l'overlay après 1s et syncer immédiatement avec les heats Firebase
        setTimeout(function(){
          if(el)el.className='';
          scheduleRender();
        },1000);
        return;
      }
      var m=Math.floor(rem/60),ss=rem%60;
      if(val){val.textContent=m+':'+p2(ss);val.className='mcd-val'+(rem<=10?' hot':rem<=30?' warn':'');}
      if(sub)sub.textContent=rem<=10?'Attention…':'Préparation en cours…';
    }
    tick();
    _mcdIv=setInterval(tick,200);
  });
} else {
  // Firebase indisponible — afficher message d'erreur dans les zones
  window.addEventListener('DOMContentLoaded',function(){
    startZoneClocks();
    [1,2].forEach(function(z){
      var root=document.getElementById('z'+z);
      if(root) root.innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100%;font-family:var(--ff);font-size:18px;letter-spacing:3px;color:var(--err)">⚠ FIREBASE INDISPONIBLE</div>';
    });
  });
}

setInterval(function(){var n=new Date(),el=document.getElementById('clk');if(el)el.textContent=p2(n.getHours())+':'+p2(n.getMinutes())+':'+p2(n.getSeconds());},1000);
setInterval(scheduleRender,5000);

/* ════════════════════════════════════════════════════════════════
   AUTO-FIT LIVE — garde le header propre quel que soit le contenu :
   · titre de WOD trop long  → réduit la police jusqu'à tenir sur 1 ligne
   · trop de mouvements      → réduit la police, puis masque le surplus
                               et ajoute un badge « +N » (jamais caché en douce)
   Idempotent + caché par clé (texte+largeur) pour zéro flicker.
   ════════════════════════════════════════════════════════════════ */
(function(){
  function fitNom(el){
    if(!el) return;
    var hdr = el.closest ? el.closest('.wod-hdr') : el.parentElement;
    var box = hdr || el.parentElement; if(!box) return;
    var cat = hdr ? hdr.querySelector('.wod-cat') : null;
    var maxW = box.clientWidth - (cat ? cat.offsetWidth + 14 : 0) - 4;
    if(maxW <= 0) return; // pas encore mis en page
    var key = (el.textContent||'') + '|' + maxW;
    if(el.dataset.fitKey === key) return;
    el.dataset.fitKey = key;
    el.style.whiteSpace = 'nowrap';
    el.style.fontSize = '';                 // repartir de la taille CSS (clamp)
    var size = parseFloat(getComputedStyle(el).fontSize) || 40, g = 0;
    while(el.scrollWidth > maxW && size > 12 && g < 80){ size -= 1; el.style.fontSize = size + 'px'; g++; }
  }
  function fitMov(row){
    if(!row) return;
    if(!('movSrc' in row.dataset)) row.dataset.movSrc = row.innerHTML; // état pristine (nœud neuf à chaque rendu)
    var w = row.clientWidth; if(w <= 0) return;
    var key = w + '|' + row.dataset.movSrc.length;
    if(row.dataset.fitKey === key) return;
    row.dataset.fitKey = key;
    row.innerHTML = row.dataset.movSrc;     // restaurer avant de re-mesurer
    row.style.fontSize = '';
    var size = parseFloat(getComputedStyle(row).fontSize) || 20, g = 0;
    while(row.scrollWidth > row.clientWidth && size > 10 && g < 60){ size -= 1; row.style.fontSize = size + 'px'; g++; }
    if(row.scrollWidth > row.clientWidth){
      var movs = Array.prototype.slice.call(row.querySelectorAll('.mov'));
      var hidden = 0;
      var more = document.createElement('div');
      more.className = 'mov mov-more';
      more.innerHTML = '<span class="mov-q">+0</span>';
      row.appendChild(more);
      for(var i = movs.length - 1; i >= 0; i--){
        if(row.scrollWidth <= row.clientWidth) break;
        movs[i].style.display = 'none'; hidden++;
        more.firstChild.textContent = '+' + hidden;
      }
      if(hidden === 0){ more.remove(); }
    }
  }
  function fitAll(){
    var noms = document.querySelectorAll('.wod-nom'); for(var i=0;i<noms.length;i++) fitNom(noms[i]);
    var rows = document.querySelectorAll('.mov-row'); for(var j=0;j<rows.length;j++) fitMov(rows[j]);
  }
  var raf = null;
  function schedule(){ if(raf) return; raf = requestAnimationFrame(function(){ raf = null; fitAll(); }); }
  window.addEventListener('resize', schedule);
  try{
    new MutationObserver(schedule).observe(document.body, {childList:true, subtree:true});
  }catch(e){}
  setInterval(fitAll, 1200);              // filet de sécurité
  window.addEventListener('DOMContentLoaded', fitAll);
  setTimeout(fitAll, 400);
})();

// ★ Décompte de reprise 3-2-1 sur l'affichage public
(function(){
  if(typeof db==='undefined'||!db) return;
  var ov=document.createElement('div'); ov.id='resume-cd-live';
  ov.style.cssText='display:none;position:fixed;inset:0;z-index:9998;background:rgba(6,20,14,.95);flex-direction:column;align-items:center;justify-content:center;gap:14px';
  ov.innerHTML='<div style="font-size:26px;font-weight:800;letter-spacing:5px;color:#00E5A0;text-transform:uppercase">Reprise dans</div><div id="rcl-n" style="font-size:220px;font-weight:900;line-height:1;color:#fff">3</div>';
  document.body.appendChild(ov);
  var iv=null;
  function sNow(){ return (typeof _off!=='undefined')? Date.now()+_off : Date.now(); }
  db.ref('system/resumeCountdown').on('value',function(snap){
    var u=snap.val()||{};
    if(iv){ clearInterval(iv); iv=null; }
    if(!u.active||!u.goAt){ ov.style.display='none'; return; }
    ov.style.display='flex';
    function upd(){
      var rem=Math.ceil((u.goAt - sNow())/1000);
      var n=document.getElementById('rcl-n');
      if(rem>0){ if(n)n.textContent=rem; }
      else { if(n)n.textContent='GO !'; setTimeout(function(){ov.style.display='none';},700); clearInterval(iv); iv=null; }
    }
    upd(); iv=setInterval(upd,200);
  });
})();
</script>
<script>
  // ★ FEU RÉSEAU DISCRET — un petit point dans le coin qui reflète le débit reçu, pour
  //   surveiller le réseau sans aller sur le TK. Vert=sain, orange=surveiller, rouge=risque.
  window._traf = window._traf || { total:0, win:[] };
  window._trafTick = function(snap){
    try{ var v=snap&&snap.val?snap.val():null; var b=v!=null?JSON.stringify(v).length:24; window._traf.total+=b; window._traf.win.push([Date.now(),b]); }catch(e){}
  };
  (function(){
    var st=document.createElement('style'); st.textContent='@keyframes netblink{50%{opacity:.4}}'; document.head.appendChild(st);
    // ★ PLUS VISIBLE : pastille + label "RÉSEAU" et débit affichés en permanence (bas gauche).
    //   Un seul conteneur cliquable pour agrandir/réduire le détail.
    var box=document.createElement('div'); box.id='netFeuBox'; box.title='Santé réseau — vert sain · orange à surveiller · rouge risque';
    box.style.cssText='position:fixed;left:12px;bottom:12px;z-index:9500;display:flex;align-items:center;gap:8px;background:rgba(7,10,18,.78);border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:5px 11px 5px 7px;cursor:pointer;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);box-shadow:0 2px 10px rgba(0,0,0,.35)';
    var feu=document.createElement('div'); feu.id='netFeu';
    feu.style.cssText='width:18px;height:18px;border-radius:50%;background:#06d6a0;box-shadow:0 0 10px rgba(6,214,160,.75);transition:background .4s,box-shadow .4s;flex-shrink:0';
    var lbl=document.createElement('div'); lbl.id='netFeuLbl';
    lbl.style.cssText='font-family:monospace;font-size:12px;font-weight:800;color:#e6eefc;letter-spacing:.3px;white-space:nowrap';
    lbl.textContent='RÉSEAU';
    box.appendChild(feu); box.appendChild(lbl); document.body.appendChild(box);
    var detail=true; box.onclick=function(){ detail=!detail; render(); };
    function render(){
      var now=Date.now(), T=window._traf;
      T.win=T.win.filter(function(x){ return now-x[0]<5000; });
      var koPerSec=(T.win.reduce(function(a,x){return a+x[1];},0)/5)/1024;
      var col,glow,blur,etat;
      if(koPerSec<25){ col='#06d6a0'; glow='rgba(6,214,160,.75)'; blur=10; etat='OK'; }
      else if(koPerSec<100){ col='#FFB020'; glow='rgba(255,176,32,.85)'; blur=14; etat='⚠'; }
      else { col='#FF3B5C'; glow='rgba(255,59,92,.95)'; blur=18; etat='RISQUE'; }
      feu.style.background=col; feu.style.boxShadow='0 0 '+blur+'px '+glow;
      feu.style.animation = koPerSec>=100 ? 'netblink 1s ease-in-out infinite' : 'none';
      // Label toujours visible : "RÉSEAU" + état, et le débit en plus si on a cliqué (detail).
      lbl.textContent = detail ? ('RÉSEAU '+etat+' · '+koPerSec.toFixed(1)+' Ko/s') : ('RÉSEAU '+etat);
    }
    setInterval(render, 1000); render();
  })();
</script>
